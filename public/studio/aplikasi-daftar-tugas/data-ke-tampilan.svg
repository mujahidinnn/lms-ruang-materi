<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Array tugas dan variabel filter masuk ke render, yang hanya menampilkan tugas aktif di layar</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="740" fill="#ffffff"/>
<text x="600" y="58" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Tampilan digambar dari data</text><text x="60" y="120" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d">Data (array tugas)</text><rect x="40" y="140" width="470" height="400" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="64" y="182" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">let tugas = [</text><rect x="80" y="205" width="400" height="76" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="98" y="237" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">{ id: "a1", teks: "Beli susu",</text><text x="98" y="265" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">  selesai: true }</text><rect x="80" y="297" width="400" height="76" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="98" y="329" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">{ id: "a2", teks: "Kerjakan PR",</text><text x="98" y="357" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">  selesai: false }</text><rect x="80" y="389" width="400" height="76" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="98" y="421" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">{ id: "a3", teks: "Cuci sepatu",</text><text x="98" y="449" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">  selesai: false }</text><text x="64" y="510" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">];</text><rect x="40" y="560" width="470" height="60" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="64" y="598" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">let filter = "aktif";</text><rect x="560" y="300" width="180" height="110" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="650" y="348" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">render()</text><text x="650" y="382" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">pakai terlihat()</text><line x1="512" y1="355" x2="554" y2="355" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="512" y1="590" x2="650" y2="590" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10"/><line x1="650" y1="590" x2="650" y2="418" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10" marker-end="url(#ah)"/><line x1="742" y1="355" x2="792" y2="355" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="800" y="120" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d">Layar (filter Aktif)</text><rect x="800" y="140" width="360" height="400" rx="22" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><rect x="824" y="164" width="72" height="34" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="2"/><text x="860" y="188" font-size="16" font-weight="500" text-anchor="middle" fill="#0f100d">Semua</text><rect x="906" y="164" width="72" height="34" rx="10" fill="#0f100d"/><text x="942" y="188" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">Aktif</text><rect x="988" y="164" width="80" height="34" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="2"/><text x="1028" y="188" font-size="16" font-weight="500" text-anchor="middle" fill="#0f100d">Selesai</text><rect x="824" y="222" width="312" height="62" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><rect x="840" y="240" width="26" height="26" rx="5" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="882" y="261" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">Kerjakan PR</text><text x="1120" y="261" font-size="17" font-weight="500" text-anchor="end" fill="#a33b2b">Hapus</text><text x="1150" y="261" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d"></text><rect x="824" y="298" width="312" height="62" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><rect x="840" y="316" width="26" height="26" rx="5" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="882" y="337" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">Cuci sepatu</text><text x="1120" y="337" font-size="17" font-weight="500" text-anchor="end" fill="#a33b2b">Hapus</text><text x="1150" y="337" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d"></text><text x="980" y="420" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">2 tugas belum selesai</text><text x="600" y="670" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">"Beli susu" tidak hilang dari array, hanya tidak lolos filter. Ganti filter ke Semua, ia tampil lagi.</text><text x="600" y="708" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Setiap tugas butuh id: dua tugas boleh punya teks yang sama, tapi id-nya pasti beda.</text>
</svg>
