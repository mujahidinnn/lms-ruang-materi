<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" width="1200" height="710" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Siklus aplikasi daftar tugas: pengguna berbuat, array tugas diubah, perbarui menyimpan ke localStorage dan memanggil render, layar digambar ulang</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="710" fill="#ffffff"/>
<text x="600" y="58" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Pola inti: ubah data, lalu gambar ulang</text><rect x="60" y="120" width="330" height="120" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="225" y="172" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">1. Pengguna</text><text x="225" y="210" font-size="20" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">submit / change / click</text><rect x="450" y="120" width="300" height="120" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="600" y="172" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">2. Ubah array</text><text x="600" y="210" font-size="20" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">tugas.push(...)</text><rect x="810" y="120" width="330" height="120" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="975" y="172" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">3. perbarui()</text><text x="975" y="210" font-size="20" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">simpan(); render();</text><rect x="810" y="360" width="330" height="120" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="975" y="412" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">4. render()</text><text x="975" y="450" font-size="20" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">replaceChildren(...)</text><rect x="450" y="360" width="300" height="120" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="600" y="412" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">5. Layar baru</text><text x="600" y="450" font-size="20" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">&lt;ul&gt; berisi &lt;li&gt;</text><rect x="60" y="360" width="330" height="120" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="3" stroke-dasharray="10 8"/><text x="225" y="410" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">localStorage</text><text x="225" y="448" font-size="20" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">"daftar-tugas"</text><line x1="392" y1="180" x2="444" y2="180" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="752" y1="180" x2="804" y2="180" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="975" y1="242" x2="975" y2="354" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="808" y1="420" x2="756" y2="420" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="600" y1="482" x2="600" y2="540" stroke="#0f100d" stroke-width="5" stroke-linecap="round"/><line x1="600" y1="540" x2="30" y2="540" stroke="#0f100d" stroke-width="5" stroke-linecap="round"/><line x1="30" y1="540" x2="30" y2="180" stroke="#0f100d" stroke-width="5" stroke-linecap="round"/><line x1="30" y1="180" x2="54" y2="180" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="315" y="572" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">pengguna melihat hasilnya, lalu berbuat lagi</text><path d="M860 244 C 800 320, 440 300, 394 400" fill="none" stroke="#0f100d" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#ah)"/><text x="225" y="342" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">simpan(): JSON.stringify</text><text x="600" y="640" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Tombol filter melompati langkah 2 dan 3: ia hanya mengganti variabel filter lalu memanggil render().</text><text x="600" y="678" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Kalau layar salah, periksa dua tempat saja: isi array tugas di Console, dan fungsi render().</text>
</svg>
