<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Event delegation: klik tombol Hapus menggelembung ke ul, lalu closest li dan dataset.id memberi id tugas</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="660" fill="#ffffff"/>
<text x="600" y="58" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Satu pendengar di &lt;ul&gt; untuk semua item</text><rect x="60" y="110" width="620" height="420" rx="20" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="84" y="150" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">&lt;ul id="daftar-tugas"&gt;</text><rect x="420" y="124" width="240" height="40" rx="20" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="540" y="151" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">addEventListener</text><rect x="90" y="180" width="560" height="92" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="110" y="206" font-size="17" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">&lt;li data-id="a1"&gt;</text><rect x="112" y="224" width="26" height="26" rx="5" fill="#2f6b45" stroke="#0f100d" stroke-width="3"/><path d="M118 237l5 6l10 -12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="152" y="246" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">Beli susu</text><rect x="520" y="220" width="110" height="40" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="2"/><text x="575" y="247" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">Hapus</text><rect x="90" y="292" width="560" height="92" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="5"/><text x="110" y="318" font-size="17" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">&lt;li data-id="a2"&gt;</text><rect x="112" y="336" width="26" height="26" rx="5" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="152" y="358" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">Kerjakan PR</text><rect x="520" y="332" width="110" height="40" rx="10" fill="#f4b6c2" stroke="#0f100d" stroke-width="4"/><text x="575" y="359" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">Hapus</text><rect x="90" y="404" width="560" height="92" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="110" y="430" font-size="17" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">&lt;li data-id="a3"&gt;</text><rect x="112" y="448" width="26" height="26" rx="5" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="152" y="470" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">Cuci sepatu</text><rect x="520" y="444" width="110" height="40" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="2"/><text x="575" y="471" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">Hapus</text><path d="M632 352 C 750 352, 750 160, 666 146" fill="none" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="696" y="388" font-size="20" font-weight="700" text-anchor="start" fill="#0f100d">1. klik</text><text x="745" y="232" font-size="20" font-weight="700" text-anchor="start" fill="#0f100d">2. menggelembung</text><text x="745" y="258" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">button → li → ul</text><rect x="780" y="300" width="380" height="230" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="800" y="340" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">3. Di pendengar &lt;ul&gt;:</text><text x="800" y="390" font-size="20" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">e.target</text><text x="1140" y="390" font-size="20" font-weight="500" text-anchor="end" fill="#0f100d">tombol Hapus</text><text x="800" y="436" font-size="20" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">.closest("li")</text><text x="1140" y="436" font-size="20" font-weight="500" text-anchor="end" fill="#0f100d">&lt;li&gt; terdekat</text><text x="800" y="482" font-size="20" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">.dataset.id</text><text x="1140" y="482" font-size="20" font-weight="500" text-anchor="end" fill="#0f100d">"a2"</text><text x="600" y="590" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Item dibuat ulang setiap render(), jadi pendengar di tiap tombol akan ikut hilang.</text><text x="600" y="628" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">&lt;ul&gt; tidak pernah diganti, jadi satu pendengar di sana cukup untuk item lama dan baru.</text>
</svg>
