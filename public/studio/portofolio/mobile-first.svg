<text x="600" y="58" font-size="38" font-weight="800" text-anchor="middle" fill="#0f100d">Mobile first: gaya dasar dulu, media query menambah</text><line x1="80" y1="140" x2="1120" y2="140" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="80" y1="128" x2="80" y2="152" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><text x="80" y="116" font-size="21" font-weight="700" text-anchor="start" fill="#0f100d">0</text><line x1="347.42857142857144" y1="128" x2="347.42857142857144" y2="152" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><text x="347.42857142857144" y="116" font-size="21" font-weight="700" text-anchor="middle" fill="#0f100d">360px</text><line x1="650.5142857142857" y1="128" x2="650.5142857142857" y2="152" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><text x="650.5142857142857" y="116" font-size="21" font-weight="700" text-anchor="middle" fill="#0f100d">768px = 48rem</text><line x1="971.4285714285714" y1="128" x2="971.4285714285714" y2="152" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><text x="971.4285714285714" y="116" font-size="21" font-weight="700" text-anchor="middle" fill="#0f100d">1200px</text><rect x="80" y="168" width="1040" height="64" rx="12" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="100" y="210" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d">Gaya dasar (tanpa media query): berlaku di semua lebar</text><rect x="650.5142857142857" y="248" width="469.48571428571427" height="64" rx="12" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="670.5142857142857" y="290" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">@media (min-width: 48rem) { ... }</text><line x1="650.5142857142857" y1="232" x2="650.5142857142857" y2="248" stroke="#0f100d" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 8"/><rect x="80" y="360" width="400" height="330" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="280" y="400" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Di bawah 768px</text><text x="104" y="450" font-size="20" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">.hero h1</text><text x="456" y="450" font-size="20" font-weight="700" text-anchor="end" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">2.25rem</text><text x="104" y="490" font-size="20" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">.proyek-grid</text><text x="456" y="490" font-size="20" font-weight="700" text-anchor="end" fill="#0f100d">1 kolom</text><rect x="104" y="515" width="352" height="70" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="280" y="558" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">kartu 1</text><rect x="104" y="597" width="352" height="70" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="280" y="640" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">kartu 2</text><rect x="560" y="360" width="560" height="330" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="840" y="400" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Mulai 768px ke atas</text><text x="584" y="450" font-size="20" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">.hero h1</text><text x="1096" y="450" font-size="20" font-weight="700" text-anchor="end" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">3.25rem</text><text x="584" y="490" font-size="20" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">.proyek-grid</text><text x="1096" y="490" font-size="20" font-weight="700" text-anchor="end" fill="#0f100d">2 kolom</text><rect x="584" y="515" width="248" height="70" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="708" y="558" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">kartu 1</text><rect x="848" y="515" width="248" height="70" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="972" y="558" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">kartu 2</text><text x="600" y="740" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Tulis dulu untuk HP. Media query hanya menimpa yang berubah di layar lebar.</text><text x="600" y="778" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Uji di DevTools pada 360px, 768px, dan 1200px: di 768px kartu proyek mulai berjajar dua.</text>
