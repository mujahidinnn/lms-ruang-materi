<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Alur GitHub Pages: berkas di laptop dikirim dengan git push ke repositori, GitHub Pages menayangkannya di alamat USERNAME.github.io</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="590" fill="#ffffff"/>
<text x="600" y="58" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Dari git push sampai alamat publik</text><rect x="40" y="120" width="240" height="200" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="160" y="168" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Laptopmu</text><text x="160" y="212" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">index.html</text><text x="160" y="244" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">style.css</text><text x="160" y="276" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">README.md</text><rect x="340" y="120" width="240" height="200" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="460" y="168" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Repositori</text><text x="460" y="212" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">GitHub</text><text x="460" y="244" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">branch main</text><text x="460" y="276" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">folder / (root)</text><rect x="640" y="120" width="240" height="200" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="760" y="168" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">GitHub Pages</text><text x="760" y="212" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">menyalin berkas</text><text x="760" y="244" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">ke server web</text><text x="760" y="276" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">1-2 menit</text><rect x="940" y="120" width="220" height="200" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1050" y="168" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Pengunjung</text><text x="1050" y="212" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">browser di HP</text><text x="1050" y="244" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">atau laptop</text><line x1="282" y1="220" x2="334" y2="220" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="582" y1="220" x2="634" y2="220" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="882" y1="220" x2="934" y2="220" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="308" y="360" font-size="22" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">git push</text><text x="608" y="360" font-size="20" font-weight="700" text-anchor="middle" fill="#0f100d">Settings → Pages</text><rect x="200" y="400" width="800" height="70" rx="35" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="600" y="445" font-size="26" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">https://USERNAME.github.io/portofolio/</text><text x="600" y="520" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Setiap git push berikutnya otomatis memperbarui situs. Nama berkas peka huruf besar-kecil:</text><text x="600" y="556" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Style.css dan style.css dianggap dua berkas berbeda di server.</text>
</svg>
