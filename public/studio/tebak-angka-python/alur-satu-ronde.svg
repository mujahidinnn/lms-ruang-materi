<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Alur satu ronde: input tidak valid atau berulang kembali ke pertanyaan tanpa mengurangi kesempatan; tebakan valid dicatat lalu dicek benar atau tidak</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="690" fill="#ffffff"/>
<text x="600" y="52" font-size="36" font-weight="800" text-anchor="middle" fill="#0f100d">Satu ronde: hanya tebakan valid yang dihitung</text><rect x="40" y="160" width="250" height="90" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="165" y="198" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">tanya()</text><text x="165" y="228" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">Tebakan (n tersisa):</text><rect x="350" y="160" width="220" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="460" y="198" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">valid?</text><text x="460" y="228" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">baca_tebakan()</text><rect x="640" y="160" width="220" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="750" y="198" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">sudah ditebak?</text><text x="750" y="228" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">tebakan in sudah</text><rect x="930" y="160" width="230" height="90" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="1045" y="198" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">sudah.add()</text><text x="1045" y="228" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">kesempatan terpakai +1</text><rect x="930" y="360" width="230" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1045" y="414" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">benar?</text><rect x="930" y="520" width="230" height="90" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="1045" y="558" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">Benar!</text><text x="1045" y="588" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">return hitung_skor()</text><rect x="420" y="360" width="420" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="630" y="398" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">tulis(petunjuk())</text><text x="630" y="428" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">Terlalu kecil, hangat.</text><rect x="40" y="360" width="300" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="190" y="414" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">masih ada kesempatan?</text><rect x="40" y="520" width="300" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="190" y="558" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">Kesempatan habis</text><text x="190" y="588" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">return 0</text><line x1="292" y1="205" x2="342" y2="205" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="572" y1="205" x2="632" y2="205" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="862" y1="205" x2="922" y2="205" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="602" y="192" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">ya</text><text x="892" y="192" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">tidak</text><line x1="1045" y1="252" x2="1045" y2="352" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="1045" y1="452" x2="1045" y2="512" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="1060" y="490" font-size="18" font-weight="700" text-anchor="start" fill="#0f100d">ya</text><line x1="928" y1="405" x2="848" y2="405" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="888" y="392" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">tidak</text><line x1="418" y1="405" x2="348" y2="405" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="190" y1="358" x2="190" y2="258" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="204" y="314" font-size="18" font-weight="700" text-anchor="start" fill="#0f100d">ya</text><line x1="190" y1="452" x2="190" y2="512" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="204" y="490" font-size="18" font-weight="700" text-anchor="start" fill="#0f100d">tidak</text><line x1="460" y1="158" x2="460" y2="118" stroke="#0f100d" stroke-width="5" stroke-linecap="round"/><line x1="750" y1="158" x2="750" y2="118" stroke="#0f100d" stroke-width="5" stroke-linecap="round"/><line x1="750" y1="118" x2="165" y2="118" stroke="#0f100d" stroke-width="5" stroke-linecap="round"/><line x1="165" y1="118" x2="165" y2="152" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="472" y="146" font-size="17" font-weight="700" text-anchor="start" fill="#0f100d">tidak</text><text x="762" y="146" font-size="17" font-weight="700" text-anchor="start" fill="#0f100d">ya</text><text x="605" y="108" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">tidak valid / sudah pernah: tulis pesan, tanya lagi</text><text x="600" y="650" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Kesempatan terpakai = len(sudah). Input salah dan tebakan berulang di-continue sebelum add.</text>
</svg>
