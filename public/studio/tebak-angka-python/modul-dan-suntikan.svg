<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Tiga modul: logika.py murni, rekor.py menyentuh berkas, main() menerima input, output, random, dan lokasi berkas sebagai parameter</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="760" fill="#ffffff"/>
<text x="600" y="58" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Aturan murni, input-output disuntikkan</text><rect x="40" y="110" width="640" height="250" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="64" y="152" font-size="28" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">__init__.py</text><text x="64" y="190" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">main(tanya, tulis, acak, berkas)</text><text x="84" y="232" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">tanya  = input</text><text x="84" y="264" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">tulis  = print</text><text x="84" y="296" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">acak   = random.Random()</text><text x="84" y="328" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">berkas = ~/.tebak-angka.json</text><rect x="780" y="110" width="380" height="250" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="3" stroke-dasharray="10 8"/><text x="804" y="152" font-size="24" font-weight="800" text-anchor="start" fill="#0f100d">Saat dites (pytest)</text><text x="804" y="232" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">jawaban("1", "15")</text><text x="804" y="264" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">keluar.append</text><text x="804" y="296" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">AcakTetap(15)</text><text x="804" y="328" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">tmp_path / "rekor.json"</text><line x1="774" y1="235" x2="688" y2="235" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="731" y="220" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">ganti</text><rect x="40" y="450" width="420" height="180" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="64" y="492" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">logika.py</text><text x="64" y="530" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">LEVEL, baca_tebakan, suhu,</text><text x="64" y="558" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">petunjuk, hitung_skor</text><text x="64" y="600" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">murni: nilai masuk, nilai keluar</text><rect x="520" y="450" width="380" height="180" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="544" y="492" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">rekor.py</text><text x="544" y="530" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">muat_rekor, simpan_rekor</text><text x="544" y="566" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">hilang / rusak: {}</text><text x="544" y="600" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">tulis .tmp, lalu replace</text><path d="M960 455 h150 l40 40 v135 h-190 z" fill="#ffffff" stroke="#0f100d" stroke-width="4" stroke-linejoin="round"/><path d="M1110 455 v40 h40" fill="none" stroke="#0f100d" stroke-width="4"/><text x="1055" y="552" font-size="20" font-weight="700" text-anchor="middle" fill="#0f100d">rekor</text><text x="1055" y="582" font-size="20" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">.json</text><line x1="250" y1="362" x2="250" y2="442" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="262" y="410" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">memanggil</text><line x1="600" y1="362" x2="650" y2="442" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="640" y="400" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">memanggil</text><line x1="902" y1="540" x2="952" y2="540" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="600" y="690" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Hanya main() yang tahu soal keyboard, layar, dan angka acak.</text><text x="600" y="728" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Tes mengganti keempatnya, jadi game bisa dimainkan tanpa mengetik apa pun.</text>
</svg>
