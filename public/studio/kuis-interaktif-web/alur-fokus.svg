<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Perjalanan fokus keyboard dalam satu soal dan wilayah aria-live yang membacakan umpan balik</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="600" fill="#ffffff"/>
<text x="600" y="58" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Ke mana fokus pergi dalam satu soal</text><rect x="40" y="120" width="250" height="170" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><circle cx="74" cy="154" r="20" fill="#0f100d"/><text x="74" y="162" font-size="22" font-weight="800" text-anchor="middle" fill="#ffffff">1</text><text x="104" y="162" font-size="23" font-weight="800" text-anchor="start" fill="#0f100d">Judul soal</text><text x="60" y="210" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">h2 tabindex=-1</text><text x="60" y="246" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">tampilkanSoal() lalu</text><text x="60" y="270" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">.focus()</text><line x1="292" y1="205" x2="324" y2="205" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="330" y="120" width="250" height="170" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="364" cy="154" r="20" fill="#0f100d"/><text x="364" y="162" font-size="22" font-weight="800" text-anchor="middle" fill="#ffffff">2</text><text x="394" y="162" font-size="23" font-weight="800" text-anchor="start" fill="#0f100d">Grup radio</text><text x="350" y="210" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">Tab, lalu panah</text><text x="350" y="246" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">fieldset + legend:</text><text x="350" y="270" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">pertanyaan dibacakan</text><line x1="582" y1="205" x2="614" y2="205" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="620" y="120" width="250" height="170" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="654" cy="154" r="20" fill="#0f100d"/><text x="654" y="162" font-size="22" font-weight="800" text-anchor="middle" fill="#ffffff">3</text><text x="684" y="162" font-size="23" font-weight="800" text-anchor="start" fill="#0f100d">Periksa</text><text x="640" y="210" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">Enter</text><text x="640" y="246" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">form submit, periksa()</text><text x="640" y="270" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">menilai</text><line x1="872" y1="205" x2="904" y2="205" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="910" y="120" width="250" height="170" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><circle cx="944" cy="154" r="20" fill="#0f100d"/><text x="944" y="162" font-size="22" font-weight="800" text-anchor="middle" fill="#ffffff">4</text><text x="974" y="162" font-size="23" font-weight="800" text-anchor="start" fill="#0f100d">Berikutnya</text><text x="930" y="210" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">fokus dipindah</text><text x="930" y="246" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">tombol Periksa</text><text x="930" y="270" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">disembunyikan</text><rect x="560" y="360" width="600" height="140" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="3" stroke-dasharray="10 8"/><text x="584" y="398" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">#umpan-balik  aria-live="polite"</text><text x="584" y="440" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">✓ Benar!  /  ✗ Kurang tepat. Jawaban yang benar: ...</text><text x="584" y="474" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">dibacakan otomatis tanpa memindahkan fokus</text><path d="M745 292 C 745 330, 760 340, 780 356" fill="none" stroke="#0f100d" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#ah)"/><line x1="1105" y1="292" x2="1105" y2="330" stroke="#0f100d" stroke-width="5" stroke-linecap="round"/><line x1="1105" y1="330" x2="1180" y2="330" stroke="#0f100d" stroke-width="5" stroke-linecap="round"/><line x1="1180" y1="330" x2="1180" y2="96" stroke="#0f100d" stroke-width="5" stroke-linecap="round"/><line x1="1180" y1="96" x2="165" y2="96" stroke="#0f100d" stroke-width="5" stroke-linecap="round"/><line x1="165" y1="96" x2="165" y2="114" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="660" y="88" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">Enter: soal berikutnya, fokus kembali ke judul soal baru</text><rect x="40" y="360" width="480" height="140" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="64" y="398" font-size="21" font-weight="800" text-anchor="start" fill="#0f100d">Kalau fokus tidak dipindah:</text><text x="64" y="438" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">elemen fokus disembunyikan, fokus jatuh</text><text x="64" y="470" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">ke &lt;body&gt;, pengguna mulai Tab dari awal.</text><text x="600" y="560" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Wilayah aria-live harus sudah ada di HTML sebelum isinya diubah.</text>
</svg>
