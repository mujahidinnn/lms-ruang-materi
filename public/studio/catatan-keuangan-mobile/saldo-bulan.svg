<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Total bulan hanya menjumlahkan November, sedangkan saldo menjumlahkan semua transaksi sampai akhir November di SQL</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="740" fill="#ffffff"/>
<text x="600" y="58" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Total bulan vs saldo</text><rect x="60" y="120" width="340" height="150" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="230" y="162" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">September 2026</text><text x="90" y="204" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">Masuk</text><text x="370" y="204" font-size="19" font-weight="800" text-anchor="end" fill="#0f100d">+2.000.000</text><text x="90" y="240" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">Keluar</text><text x="370" y="240" font-size="19" font-weight="800" text-anchor="end" fill="#0f100d">-2.320.000</text><rect x="430" y="120" width="340" height="150" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="600" y="162" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Oktober 2026</text><text x="460" y="204" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">Masuk</text><text x="740" y="204" font-size="19" font-weight="800" text-anchor="end" fill="#0f100d">+2.000.000</text><text x="460" y="240" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">Keluar</text><text x="740" y="240" font-size="19" font-weight="800" text-anchor="end" fill="#0f100d">-2.100.000</text><rect x="800" y="120" width="340" height="150" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="970" y="162" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">November 2026</text><text x="830" y="204" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">Masuk</text><text x="1110" y="204" font-size="19" font-weight="800" text-anchor="end" fill="#0f100d">+2.500.000</text><text x="830" y="240" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">Keluar</text><text x="1110" y="240" font-size="19" font-weight="800" text-anchor="end" fill="#0f100d">-830.000</text><line x1="800" y1="290" x2="800" y2="310" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><line x1="800" y1="310" x2="1110" y2="310" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><line x1="1110" y1="290" x2="1110" y2="310" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><text x="955" y="344" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Total bulan ini</text><text x="955" y="374" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">dihitung di JavaScript</text><text x="955" y="402" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">dari daftar yang sudah diambil</text><text x="955" y="436" font-size="15" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">BETWEEN '2026-11-01' AND '2026-11-31'</text><line x1="60" y1="470" x2="60" y2="490" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="490" x2="1110" y2="490" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><line x1="1110" y1="470" x2="1110" y2="490" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><rect x="160" y="520" width="880" height="150" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="600" y="562" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Saldo sampai akhir November = Rp 1.250.000</text><text x="600" y="600" font-size="17" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">SELECT COALESCE(SUM(CASE WHEN jenis = 'masuk'</text><text x="600" y="626" font-size="17" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">THEN jumlah ELSE -jumlah END), 0) FROM transaksi</text><text x="600" y="652" font-size="17" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">WHERE tanggal &lt;= '2026-11-31'</text><text x="600" y="714" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Saldo memakai semua transaksi sebelumnya: minus 420.000 dari September dan Oktober ikut terbawa.</text>
</svg>
