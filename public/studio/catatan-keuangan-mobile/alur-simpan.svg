<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Alur Simpan: isi form divalidasi; galat kembali ke form, data valid disimpan dengan query berparameter ke SQLite, lalu router.back dan beranda memuat ulang</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="780" fill="#ffffff"/>
<text x="600" y="58" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Alur tombol Simpan</text><rect x="40" y="110" width="330" height="140" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="205" y="150" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Isi form (semua teks)</text><text x="205" y="184" font-size="16" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">jumlah: "15000"</text><text x="205" y="210" font-size="16" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">kategori: "Makan"</text><text x="205" y="236" font-size="16" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">tanggal: "2026-11-26"</text><rect x="450" y="110" width="300" height="140" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="600" y="150" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">validasi(form)</text><text x="600" y="184" font-size="16" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">uang.ts, tanpa layar</text><text x="600" y="210" font-size="16" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">diuji node --test</text><line x1="372" y1="180" x2="444" y2="180" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="830" y="110" width="330" height="140" rx="18" fill="#f4b6c2" stroke="#0f100d" stroke-width="4"/><text x="995" y="150" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">{ ok: false, galat }</text><text x="995" y="184" font-size="16" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">jumlah: "Isi jumlahnya."</text><text x="995" y="210" font-size="16" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">teks merah di bawah</text><text x="995" y="236" font-size="16" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">kolom yang salah</text><line x1="752" y1="160" x2="824" y2="160" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="788" y="148" font-size="16" font-weight="700" text-anchor="middle" fill="#0f100d">salah</text><path d="M995 252 C 995 300, 205 300, 205 256" fill="none" stroke="#0f100d" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#ah)"/><text x="330" y="330" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">pemakai memperbaiki,</text><text x="330" y="354" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">lalu tekan Simpan lagi</text><line x1="600" y1="252" x2="600" y2="366" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="616" y="350" font-size="17" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">{ ok: true, data }</text><rect x="300" y="372" width="600" height="150" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="600" y="412" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">tambahTransaksi(db, data)</text><text x="600" y="446" font-size="16" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">INSERT INTO transaksi (jenis, jumlah, ...)</text><text x="600" y="472" font-size="16" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">VALUES (?, ?, ?, ?, ?)</text><text x="600" y="498" font-size="16" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">nilai dikirim terpisah dari teks SQL</text><rect x="40" y="390" width="200" height="110" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="3" stroke-dasharray="10 8"/><text x="140" y="432" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">menyimpan</text><text x="140" y="466" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">tombol dikunci,</text><text x="140" y="490" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">tak ada data ganda</text><line x1="242" y1="446" x2="296" y2="446" stroke="#0f100d" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 8"/><rect x="960" y="390" width="200" height="110" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1060" y="430" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">uangku.db</text><text x="1060" y="464" font-size="16" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">berkas SQLite</text><text x="1060" y="490" font-size="16" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">di HP</text><line x1="902" y1="446" x2="954" y2="446" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="600" y1="524" x2="600" y2="576" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="616" y="556" font-size="17" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">router.back()</text><rect x="300" y="582" width="600" height="120" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="600" y="622" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Beranda tampil lagi</text><text x="600" y="656" font-size="16" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">useFocusEffect → muat() ulang</text><text x="600" y="682" font-size="16" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">daftar, total, dan saldo ikut berubah</text><text x="600" y="752" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Gagal menyimpan (misalnya database error) tidak diam: Alert menampilkan pesannya.</text>
</svg>
