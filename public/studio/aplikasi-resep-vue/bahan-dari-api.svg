"#ffffff" stroke="#0f100d" stroke-width="4"/><text x="926" y="260" font-size="23" font-weight="800" text-anchor="start" fill="#0f100d">Bahan (3)</text><line x1="926" y1="290" x2="1140" y2="290" stroke="#0f100d" stroke-width="2" stroke-linecap="round"/><text x="926" y="332" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">soy sauce</text><text x="1140" y="332" font-size="18" font-weight="500" text-anchor="end" fill="#0f100d">3/4 cup</text><line x1="926" y1="360" x2="1140" y2="360" stroke="#0f100d" stroke-width="2" stroke-linecap="round"/><text x="926" y="402" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">water</text><text x="1140" y="402" font-size="18" font-weight="500" text-anchor="end" fill="#0f100d">1/2 cup</text><line x1="926" y1="430" x2="1140" y2="430" stroke="#0f100d" stroke-width="2" stroke-linecap="round"/><text x="926" y="472" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">brown sugar</text><text x="1140" y="472" font-size="18" font-weight="500" text-anchor="end" fill="#0f100d">1/4 cup</text><text x="1033" y="520" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">{ name, measure }[]</text><rect x="656" y="560" width="504" height="100" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="3" stroke-dasharray="10 8"/><text x="676" y="598" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">Awas: lookup.php?i=abc menjawab</text><text x="676" y="630" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">{"meals": "Invalid ID"}, bukan null</text><text x="600" y="712" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Komponen hanya melihat array rapi; detail API tinggal di src/api/mealdb.ts.</text>
