<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 990" width="1200" height="990" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Alur pencarian: debounce, URL sebagai sumber kebenaran, useFetch membatalkan request lama, findMeals mengambil irisan, lalu empat keadaan tampilan</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="990" fill="#ffffff"/>
<text x="600" y="58" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Dari ketikan sampai kartu resep</text><rect x="40" y="110" width="300" height="150" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="64" y="148" font-size="23" font-weight="800" text-anchor="start" fill="#0f100d">Kotak pencarian</text><text x="64" y="182" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">ref text</text><rect x="64" y="200" width="252" height="40" rx="8" fill="#ffffff" stroke="#0f100d" stroke-width="2"/><text x="78" y="227" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">c, ch, chi ... chicken</text><rect x="450" y="110" width="300" height="150" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="474" y="148" font-size="23" font-weight="800" text-anchor="start" fill="#0f100d">debounce 400 ms</text><text x="474" y="184" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">7 ketikan cepat</text><text x="474" y="214" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">= 1 panggilan setQuery</text><rect x="860" y="110" width="300" height="150" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="884" y="148" font-size="21" font-weight="800" text-anchor="start" fill="#0f100d">URL (sumber kebenaran)</text><text x="884" y="188" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/?q=chicken</text><text x="884" y="218" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">&amp;c=Chicken&amp;a=Japanese</text><line x1="342" y1="185" x2="444" y2="185" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="752" y1="185" x2="854" y2="185" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="1010" y="290" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">dropdown menulis URL langsung</text><line x1="1010" y1="300" x2="1010" y2="352" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="860" y="360" width="300" height="120" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="884" y="398" font-size="23" font-weight="800" text-anchor="start" fill="#0f100d">computed filters</text><text x="884" y="432" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">{ q, c, a } dari</text><text x="884" y="460" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">route.query</text><line x1="856" y1="420" x2="760" y2="420" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="360" y="340" width="394" height="160" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="384" y="378" font-size="21" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">useFetch(filters, findMeals)</text><text x="384" y="414" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">1. abort() request sebelumnya</text><text x="384" y="444" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">2. loading = true</text><text x="384" y="474" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">3. hasil telat dibuang</text><rect x="40" y="340" width="250" height="160" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="3" stroke-dasharray="10 8"/><text x="60" y="378" font-size="21" font-weight="800" text-anchor="start" fill="#0f100d">request lama</text><text x="60" y="412" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">search.php?s=chick</text><text x="60" y="448" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">AbortError: diabaikan</text><line x1="356" y1="420" x2="296" y2="420" stroke="#0f100d" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#ah)"/><text x="326" y="404" font-size="16" font-weight="500" text-anchor="middle" fill="#0f100d">batal</text><line x1="557" y1="502" x2="557" y2="552" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="40" y="560" width="1120" height="180" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="64" y="598" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">findMeals: satu request per filter, dikirim bersamaan (Promise.all)</text><rect x="64" y="620" width="256" height="96" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="78" y="654" font-size="16" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">search.php?s=chicken</text><text x="78" y="692" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">id: 1, 2, 5, 7</text><rect x="344" y="620" width="256" height="96" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="358" y="654" font-size="16" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">filter.php?c=Chicken</text><text x="358" y="692" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">id: 1, 2, 3, 5</text><rect x="624" y="620" width="256" height="96" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="638" y="654" font-size="16" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">filter.php?a=Japanese</text><text x="638" y="692" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">id: 2, 5, 9</text><line x1="886" y1="668" x2="944" y2="668" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="950" y="620" width="186" height="96" rx="12" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="1043" y="654" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">irisan id</text><text x="1043" y="694" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">2, 5</text><line x1="1043" y1="742" x2="1043" y2="790" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="40" y="800" width="256" height="96" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="168" y="840" font-size="23" font-weight="800" text-anchor="middle" fill="#0f100d">memuat</text><text x="168" y="874" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">8 kartu skeleton</text><rect x="324" y="800" width="256" height="96" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="452" y="840" font-size="23" font-weight="800" text-anchor="middle" fill="#0f100d">gagal</text><text x="452" y="874" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">pesan + Coba lagi</text><rect x="608" y="800" width="256" height="96" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="736" y="840" font-size="23" font-weight="800" text-anchor="middle" fill="#0f100d">kosong</text><text x="736" y="874" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">pesan + Hapus filter</text><rect x="892" y="800" width="256" height="96" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="1020" y="840" font-size="23" font-weight="800" text-anchor="middle" fill="#0f100d">hasil</text><text x="1020" y="874" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">grid RecipeCard</text><text x="600" y="946" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Urutan v-if di template = urutan prioritas: memuat, gagal, kosong, baru hasil.</text>
</svg>
