<rect width="1200" height="780" fill="#ffffff"/>
<text x="600" y="58" font-size="38" font-weight="800" text-anchor="middle" fill="#0f100d">Refresh di /resep/52772: kenapa butuh fallback</text><rect x="40" y="120" width="250" height="130" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="165" y="164" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Browser</text><text x="165" y="200" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">GET /resep/52772</text><text x="165" y="228" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">(refresh / tautan)</text><line x1="292" y1="185" x2="400" y2="185" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="406" y="110" width="330" height="150" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="571" y="152" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Netlify / Vercel</text><text x="571" y="190" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">ada berkas dengan</text><text x="571" y="218" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">nama itu di dist/?</text><line x1="740" y1="150" x2="850" y2="150" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="795" y="136" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">ya</text><rect x="856" y="100" width="304" height="110" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="876" y="138" font-size="21" font-weight="800" text-anchor="start" fill="#0f100d">layani berkasnya</text><text x="876" y="172" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/assets/index-abc.js</text><text x="876" y="196" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/favicon.ico</text><line x1="571" 