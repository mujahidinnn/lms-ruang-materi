 fill="#0f100d">index.html memuat JavaScript</text><text x="644" y="642" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">Vue Router membaca /resep/52772</text><text x="644" y="672" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">lalu menampilkan RecipeView</text><rect x="40" y="566" width="500" height="130" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="64" y="604" font-size="21" font-weight="800" text-anchor="start" fill="#0f100d">Di mana aturannya?</text><text x="64" y="640" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">Netlify: [[redirects]] di netlify.toml</text><text x="64" y="670" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">Vercel: rewrites di vercel.json</text><text x="600" y="746" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">npm run preview sudah melakukan fallback ini; hosting harus diberi tahu.</text>
