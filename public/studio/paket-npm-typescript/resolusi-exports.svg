<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Resolusi exports map: import ESM ke kunci titik kondisi import ke index.js dan index.d.ts, require CJS ke kunci nik kondisi require ke nik.cjs dan nik.d.cts, impor dalam ke dist ditolak</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="840" fill="#ffffff"/>
<text x="600" y="58" font-size="32" font-weight="800" text-anchor="middle" fill="#0f100d">Satu nama paket, berkas yang dipilih tergantung siapa yang bertanya</text><text x="175" y="112" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">Pemakai menulis</text><text x="520" y="112" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">Kunci exports</text><text x="760" y="112" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">Kondisi</text><text x="1015" y="112" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">Berkas di dist/</text><rect x="30" y="140" width="290" height="150" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="48" y="180" font-size="18" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">import { terbilang }</text><text x="48" y="210" font-size="18" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">from "@namamu/idn-kit"</text><text x="48" y="258" font-size="20" font-weight="700" text-anchor="start" fill="#0f100d">ESM (Node, Vite)</text><rect x="420" y="180" width="200" height="70" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="520" y="224" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">"."</text><rect x="680" y="180" width="160" height="70" rx="12" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="760" y="224" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">import</text><rect x="890" y="140" width="280" height="150" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="910" y="184" font-size="17" font-weight="700" text-anchor="start" fill="#0f100d">types</text><text x="990" y="184" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">index.d.ts</text><text x="910" y="218" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d">dibaca TypeScript</text><text x="910" y="256" font-size="17" font-weight="700" text-anchor="start" fill="#0f100d">default</text><text x="990" y="256" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">index.js</text><text x="910" y="280" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d">dijalankan Node</text><line x1="324" y1="215" x2="412" y2="215" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="622" y1="215" x2="672" y2="215" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="842" y1="215" x2="882" y2="215" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="330" width="290" height="150" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="48" y="370" font-size="18" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">require(</text><text x="48" y="400" font-size="18" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">"@namamu/idn-kit/nik")</text><text x="48" y="448" font-size="20" font-weight="700" text-anchor="start" fill="#0f100d">CommonJS</text><rect x="420" y="370" width="200" height="70" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="520" y="414" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">"./nik"</text><rect x="680" y="370" width="160" height="70" rx="12" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="760" y="414" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">require</text><rect x="890" y="330" width="280" height="150" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="910" y="374" font-size="17" font-weight="700" text-anchor="start" fill="#0f100d">types</text><text x="990" y="374" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">nik.d.cts</text><text x="910" y="408" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d">dibaca TypeScript</text><text x="910" y="446" font-size="17" font-weight="700" text-anchor="start" fill="#0f100d">default</text><text x="990" y="446" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">nik.cjs</text><text x="910" y="470" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d">dijalankan Node</text><line x1="324" y1="405" x2="412" y2="405" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="622" y1="405" x2="672" y2="405" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="842" y1="405" x2="882" y2="405" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="520" width="290" height="120" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4" stroke-dasharray="10 8"/><text x="48" y="560" font-size="17" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">require("@namamu/idn-kit</text><text x="48" y="590" font-size="17" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/dist/nik.cjs")</text><text x="48" y="622" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">jalan pintas ke dalam</text><rect x="420" y="545" width="750" height="70" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="4" stroke-dasharray="10 8"/><text x="440" y="578" font-size="20" font-weight="700" text-anchor="start" fill="#0f100d">tidak ada kunci "./dist/nik.cjs" di exports</text><text x="440" y="604" font-size="18" font-weight="700" text-anchor="start" fill="#b42318" font-family="ui-monospace, Menlo, Consolas, monospace">Node: ERR_PACKAGE_PATH_NOT_EXPORTED</text><line x1="324" y1="580" x2="412" y2="580" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="600" y="694" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">exports adalah daftar pintu resmi: yang tidak tertulis tidak bisa diimpor,</text><text x="600" y="726" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">jadi isi dist/ boleh kamu ubah tanpa merusak pemakai.</text><text x="600" y="770" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">"types" ditulis paling atas di tiap cabang. Node tidak mengenal kondisi itu,</text><text x="600" y="802" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">jadi ia melewatinya dan memakai "default".</text>
</svg>
