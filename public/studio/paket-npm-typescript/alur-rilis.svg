<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 930" width="1200" height="930" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Alur rilis Changesets: ngoding dan changeset, PR dengan CI, merge ke main, select-mode memilih version (PR Version Packages) atau pack lalu publish dengan OIDC ke npm, plus izin tiap job</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="930" fill="#ffffff"/>
<text x="600" y="58" font-size="38" font-weight="800" text-anchor="middle" fill="#0f100d">Dari changeset sampai terbit di npm</text><rect x="30" y="100" width="255" height="130" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="158" y="140" font-size="23" font-weight="800" text-anchor="middle" fill="#0f100d">1. Ngoding</text><text x="158" y="178" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">fitur + tes</text><text x="158" y="208" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">npx changeset</text><line x1="288" y1="165" x2="317" y2="165" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="325" y="100" width="255" height="130" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="453" y="140" font-size="23" font-weight="800" text-anchor="middle" fill="#0f100d">2. Pull request</text><text x="453" y="178" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">CI matriks Node</text><text x="453" y="208" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">22, 24, 26</text><line x1="583" y1="165" x2="612" y2="165" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="620" y="100" width="255" height="130" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="748" y="140" font-size="23" font-weight="800" text-anchor="middle" fill="#0f100d">3. Merge ke main</text><text x="748" y="178" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">release.yml</text><text x="748" y="208" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">berjalan</text><line x1="878" y1="165" x2="907" y2="165" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="915" y="100" width="255" height="130" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="1043" y="140" font-size="23" font-weight="800" text-anchor="middle" fill="#0f100d">4. select-mode</text><text x="1043" y="178" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">ada changeset?</text><text x="1043" y="208" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">versi sudah terbit?</text><polyline points="935,232 935,290 748,290 748,322" fill="none" stroke="#0f100d" stroke-width="5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="842" y="280" font-size="18" font-weight="800" text-anchor="middle" fill="#0f100d">ada changeset</text><rect x="620" y="330" width="255" height="230" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="748" y="368" font-size="23" font-weight="800" text-anchor="middle" fill="#0f100d">5a. version</text><text x="748" y="404" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">membuka PR</text><text x="748" y="432" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">"Version Packages":</text><text x="748" y="460" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">versi naik,</text><text x="748" y="488" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">CHANGELOG ditulis,</text><text x="748" y="516" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">changeset dihapus.</text><text x="748" y="544" font-size="18" font-weight="800" text-anchor="middle" fill="#0f100d">Merge PR ini: ke 3 lagi</text><line x1="1150" y1="232" x2="1150" y2="322" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="1140" y="262" font-size="17" font-weight="800" text-anchor="end" fill="#0f100d">tidak ada changeset,</text><text x="1140" y="286" font-size="17" font-weight="800" text-anchor="end" fill="#0f100d">versi belum di npm</text><rect x="915" y="330" width="255" height="120" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1042" y="368" font-size="23" font-weight="800" text-anchor="middle" fill="#0f100d">5b. pack</text><text x="1042" y="402" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">npm test, lalu</text><text x="1042" y="430" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">tarball .tgz</text><line x1="1042" y1="452" x2="1042" y2="492" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="915" y="500" width="255" height="150" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="1042" y="538" font-size="23" font-weight="800" text-anchor="middle" fill="#0f100d">6. publish</text><text x="1042" y="572" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">token OIDC dari GitHub,</text><text x="1042" y="600" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">tanpa NPM_TOKEN,</text><text x="1042" y="628" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">provenance otomatis</text><line x1="1042" y1="652" x2="1042" y2="692" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="915" y="700" width="255" height="120" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1042" y="738" font-size="23" font-weight="800" text-anchor="middle" fill="#0f100d">7. Terbit</text><text x="1042" y="772" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">npm + tag git</text><text x="1042" y="800" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">+ GitHub Release</text><rect x="30" y="330" width="545" height="490" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="3" stroke-dasharray="10 8"/><text x="54" y="372" font-size="23" font-weight="800" text-anchor="start" fill="#0f100d">Izin tiap job (permissions)</text><text x="54" y="420" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">select-mode</text><text x="250" y="420" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">contents: read</text><text x="54" y="464" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">version</text><text x="250" y="464" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">contents: write</text><text x="250" y="508" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">pull-requests: write</text><text x="54" y="552" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">pack</text><text x="250" y="552" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">contents: read</text><text x="54" y="596" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">publish</text><text x="250" y="596" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">contents: write</text><text x="250" y="640" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">id-token: write</text><line x1="54" y1="696" x2="550" y2="696" stroke="#0f100d" stroke-width="2" stroke-linecap="round"/><text x="54" y="734" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">Hanya job publish yang boleh meminta</text><text x="54" y="762" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">token OIDC, dan job itu tidak menjalankan</text><text x="54" y="790" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">build ataupun tes. Tarball dibuat oleh pack.</text><text x="600" y="866" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">Semua action dipasang ke SHA commit lengkap, jadi tag yang dipindah orang lain</text><text x="600" y="898" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">tidak bisa mengganti kode yang berjalan.</text>
</svg>
