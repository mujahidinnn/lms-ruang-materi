<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Alur handler webhook Midtrans: cek tanda tangan, ambil status dari API, catat webhook_events dengan on conflict do nothing, ubah order pending ke paid sekali, perpanjang langganan; contoh tiga notifikasi dengan hasilnya</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="1000" fill="#ffffff"/>
<text x="600" y="56" font-size="32" font-weight="800" text-anchor="middle" fill="#0f100d">Webhook Midtrans: aman dikirim ulang, aman tidak berurutan</text><rect x="60" y="100" width="600" height="84" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="94" cy="142" r="20" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="94" y="150" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d">1</text><text x="130" y="136" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d">Cek tanda tangan</text><text x="130" y="166" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">SHA512(order_id+status_code+gross+key)</text><rect x="760" y="112" width="400" height="60" rx="12" fill="#f4b6c2" stroke="#0f100d" stroke-width="3"/><text x="780" y="150" font-size="18" font-weight="700" text-anchor="start" fill="#0f100d">salah: 401, berhenti</text><line x1="664" y1="142" x2="754" y2="142" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="210" width="600" height="84" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="94" cy="252" r="20" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="94" y="260" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d">2</text><text x="130" y="246" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d">Ambil status dari API Midtrans</text><text x="130" y="276" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">isi notifikasi hanya pemicu</text><rect x="760" y="222" width="400" height="60" rx="12" fill="#f4b6c2" stroke="#0f100d" stroke-width="3"/><text x="780" y="260" font-size="18" font-weight="700" text-anchor="start" fill="#0f100d">API gagal: 500, Midtrans kirim ulang</text><line x1="664" y1="252" x2="754" y2="252" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="340" width="600" height="84" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="94" cy="382" r="20" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="94" y="390" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d">3</text><text x="130" y="376" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d">Catat webhook_events</text><text x="130" y="406" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">insert (order_id:status) on conflict do nothing</text><rect x="760" y="352" width="400" height="60" rx="12" fill="#f1f1ee" stroke="#0f100d" stroke-width="3"/><text x="780" y="390" font-size="18" font-weight="700" text-anchor="start" fill="#0f100d">sudah ada: duplikat, 200</text><line x1="664" y1="382" x2="754" y2="382" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="450" width="600" height="84" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="94" cy="492" r="20" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="94" y="500" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d">4</text><text x="130" y="486" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d">billing_orders: pending -&gt; paid</text><text x="130" y="516" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">where status &lt;&gt; 'paid' and gross_amount cocok</text><rect x="760" y="462" width="400" height="60" rx="12" fill="#f1f1ee" stroke="#0f100d" stroke-width="3"/><text x="780" y="500" font-size="18" font-weight="700" text-anchor="start" fill="#0f100d">tidak kena: diabaikan, 200</text><line x1="664" y1="492" x2="754" y2="492" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="560" width="600" height="84" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="94" cy="602" r="20" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="94" y="610" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d">5</text><text x="130" y="596" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d">Perpanjang langganan</text><text x="130" y="626" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">plan_id, paid_until + 1 bulan, audit_log</text><rect x="760" y="572" width="400" height="60" rx="12" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="780" y="610" font-size="18" font-weight="700" text-anchor="start" fill="#0f100d">dibayar, 200</text><line x1="664" y1="602" x2="754" y2="602" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="360" y1="188" x2="360" y2="204" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="360" y1="298" x2="360" y2="334" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="360" y1="428" x2="360" y2="444" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="360" y1="538" x2="360" y2="554" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="40" y="326" width="640" height="330" rx="16" fill="none" stroke="#0f100d" stroke-width="3" stroke-dasharray="12 9"/><text x="48" y="680" font-size="18" font-weight="800" text-anchor="start" fill="#0f100d">langkah 3 sampai 5: satu transaksi app_system</text><text x="40" y="740" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Tiga notifikasi untuk order sub-org1-202611</text><rect x="40" y="760" width="1120" height="48" rx="10" fill="#b5d36f" stroke="#0f100d" stroke-width="2"/><text x="60" y="792" font-size="17" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">#1  settlement</text><text x="420" y="792" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">event baru, order pending -&gt; paid, paid_until +1 bulan</text><rect x="40" y="816" width="1120" height="48" rx="10" fill="#f1f1ee" stroke="#0f100d" stroke-width="2"/><text x="60" y="848" font-size="17" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">#2  settlement (dikirim ulang)</text><text x="420" y="848" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">event sudah ada: duplikat, tidak ada yang berubah</text><rect x="40" y="872" width="1120" height="48" rx="10" fill="#f1f1ee" stroke="#0f100d" stroke-width="2"/><text x="60" y="904" font-size="17" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">#3  expire (terlambat datang)</text><text x="420" y="904" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">event baru, tapi gagal hanya mengubah order pending: tetap paid</text><text x="600" y="966" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Hasil akhirnya sama, berapa kali pun dan dalam urutan apa pun notifikasi datang.</text>
</svg>
