<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Row Level Security: transaksi app_user memasang app.org_id A, policy tenant menyaring baris bookings ke org A sehingga query untuk org B mengembalikan nol baris; empat role koneksi dan tugasnya</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="850" fill="#ffffff"/>
<text x="600" y="56" font-size="32" font-weight="800" text-anchor="middle" fill="#0f100d">RLS: database yang menyaring, bukan aplikasi yang ingat</text><rect x="40" y="96" width="560" height="330" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="64" y="134" font-size="21" font-weight="800" text-anchor="start" fill="#0f100d">withTenant(u1, orgA)  sebagai app_user</text><text x="64" y="174" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">begin</text><text x="64" y="202" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">set_config('app.user_id', 'u1', true)</text><text x="64" y="230" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">cek memberships: u1 anggota A?</text><text x="64" y="258" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">set_config('app.org_id', 'A', true)</text><text x="64" y="286" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">select * from bookings</text><text x="64" y="314" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">  where org_id = 'B'  -- iseng/lupa</text><text x="64" y="342" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">commit  -- setting ikut hilang</text><line x1="604" y1="260" x2="650" y2="260" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="656" y="96" width="504" height="110" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="680" y="134" font-size="21" font-weight="800" text-anchor="start" fill="#0f100d">policy tenant  (to app_user)</text><text x="680" y="170" font-size="18" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">using (org_id = app.current_org())</text><text x="680" y="194" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">with check (sama, untuk insert/update)</text><text x="680" y="240" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">bookings</text><rect x="656" y="252" width="504" height="38" rx="8" fill="#b5d36f" stroke="#0f100d" stroke-width="2"/><text x="676" y="278" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">1</text><text x="720" y="278" font-size="17" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">org A</text><text x="840" y="278" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">Rina, 09.00</text><text x="1144" y="278" font-size="17" font-weight="700" text-anchor="end" fill="#0f100d">terlihat</text><rect x="656" y="296" width="504" height="38" rx="8" fill="#f1f1ee" stroke="#0f100d" stroke-width="2" stroke-dasharray="6 6"/><text x="676" y="322" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">2</text><text x="720" y="322" font-size="17" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">org B</text><text x="840" y="322" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">Doni, 10.00</text><text x="1144" y="322" font-size="17" font-weight="700" text-anchor="end" fill="#0f100d">tak ada bagi A</text><rect x="656" y="340" width="504" height="38" rx="8" fill="#b5d36f" stroke="#0f100d" stroke-width="2"/><text x="676" y="366" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">3</text><text x="720" y="366" font-size="17" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">org A</text><text x="840" y="366" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">Sari, 13.00</text><text x="1144" y="366" font-size="17" font-weight="700" text-anchor="end" fill="#0f100d">terlihat</text><rect x="656" y="384" width="504" height="38" rx="8" fill="#f1f1ee" stroke="#0f100d" stroke-width="2" stroke-dasharray="6 6"/><text x="676" y="410" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">4</text><text x="720" y="410" font-size="17" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">org B</text><text x="840" y="410" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">Agus, 15.00</text><text x="1144" y="410" font-size="17" font-weight="700" text-anchor="end" fill="#0f100d">tak ada bagi A</text><rect x="40" y="450" width="1120" height="80" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="64" y="486" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">Hasil: 0 baris. Policy menyisakan baris org A dulu, lalu where org_id = 'B' tidak cocok dengan apa pun.</text><text x="64" y="514" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">Tanpa set_config: current_org() bernilai null, jadi nol baris. Bukan error, bukan semua baris.</text><text x="40" y="584" font-size="24" font-weight="800" text-anchor="start" fill="#0f100d">Empat role koneksi</text><rect x="40" y="604" width="265" height="170" rx="16" fill="#f4b6c2" stroke="#0f100d" stroke-width="4"/><text x="60" y="642" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">pemilik</text><text x="60" y="680" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">DATABASE_URL</text><text x="60" y="708" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">migrasi saja; pemilik</text><text x="60" y="736" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">tabel melewati RLS</text><rect x="325" y="604" width="265" height="170" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="345" y="642" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">app_user</text><text x="345" y="680" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">request web</text><text x="345" y="708" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">policy tenant +</text><text x="345" y="736" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">hak minimum</text><rect x="610" y="604" width="265" height="170" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="630" y="642" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">app_system</text><text x="630" y="680" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">webhook, worker</text><text x="630" y="708" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">policy system</text><text x="630" y="736" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">using (true), eksplisit</text><rect x="895" y="604" width="265" height="170" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="915" y="642" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">app_auth</text><text x="915" y="680" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">Better Auth</text><text x="915" y="708" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">hanya tabel auth,</text><text x="915" y="736" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">tanpa data tenant</text><text x="600" y="818" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Satu transaksi, satu tenant: set_config(..., true) aman di pooler mode transaksi.</text>
</svg>
