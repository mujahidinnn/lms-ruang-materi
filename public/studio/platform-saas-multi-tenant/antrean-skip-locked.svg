<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 910" width="1200" height="910" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Dua worker mengambil job berbeda dengan FOR UPDATE SKIP LOCKED; job yang belum waktunya, kedaluwarsa kuncinya, dan selesai; jeda retry 1, 2, 4, 8 menit sampai max_attempts</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="910" fill="#ffffff"/>
<text x="600" y="56" font-size="32" font-weight="800" text-anchor="middle" fill="#0f100d">Antrean job di Postgres: FOR UPDATE SKIP LOCKED</text><text x="440" y="116" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">id</text><text x="480" y="116" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">kind</text><text x="670" y="116" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">run_at</text><text x="780" y="116" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">locked_until</text><text x="930" y="116" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">keadaan</text><line x1="420" y1="128" x2="1160" y2="128" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><rect x="420" y="142" width="740" height="50" rx="10" fill="#b5d36f" stroke="#0f100d" stroke-width="2"/><text x="440" y="175" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">1</text><text x="480" y="175" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">booking.reminder</text><text x="670" y="175" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">lewat</text><text x="780" y="175" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">+5 mnt</text><text x="930" y="175" font-size="16" font-weight="700" text-anchor="start" fill="#0f100d">dikunci Worker A</text><rect x="420" y="200" width="740" height="50" rx="10" fill="#b5d36f" stroke="#0f100d" stroke-width="2"/><text x="440" y="233" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">2</text><text x="480" y="233" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">booking.reminder</text><text x="670" y="233" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">lewat</text><text x="780" y="233" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">+5 mnt</text><text x="930" y="233" font-size="16" font-weight="700" text-anchor="start" fill="#0f100d">dikunci Worker B</text><rect x="420" y="258" width="740" height="50" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="2"/><text x="440" y="291" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">3</text><text x="480" y="291" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">booking.reminder</text><text x="670" y="291" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">besok</text><text x="780" y="291" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">-</text><text x="930" y="291" font-size="16" font-weight="700" text-anchor="start" fill="#0f100d">belum waktunya</text><rect x="420" y="316" width="740" height="50" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="2"/><text x="440" y="349" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">4</text><text x="480" y="349" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">billing.check</text><text x="670" y="349" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">lewat</text><text x="780" y="349" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">kedaluwarsa</text><text x="930" y="349" font-size="16" font-weight="700" text-anchor="start" fill="#0f100d">worker mati: siap lagi</text><rect x="420" y="374" width="740" height="50" rx="10" fill="#f1f1ee" stroke="#0f100d" stroke-width="2" stroke-dasharray="6 6"/><text x="440" y="407" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">5</text><text x="480" y="407" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">booking.reminder</text><text x="670" y="407" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">lewat</text><text x="780" y="407" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">-</text><text x="930" y="407" font-size="16" font-weight="700" text-anchor="start" fill="#0f100d">selesai (done_at)</text><rect x="60" y="144" width="230" height="46" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="175" y="176" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Worker A</text><line x1="294" y1="167" x2="414" y2="167" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="202" width="230" height="46" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="175" y="234" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Worker B</text><line x1="294" y1="225" x2="414" y2="225" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="60" y="300" font-size="18" font-weight="700" text-anchor="start" fill="#0f100d">Baris 1 sudah dikunci A.</text><text x="60" y="326" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">B tidak menunggu: SKIP LOCKED</text><text x="60" y="352" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">melompat ke baris berikutnya.</text><rect x="40" y="450" width="1120" height="104" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="64" y="486" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">update jobs set attempts = attempts + 1, locked_until = now() + '5 min'</text><text x="64" y="514" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">where id = (select id ... order by run_at limit 1 for update skip locked)</text><text x="40" y="610" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Kalau handler gagal: run_at mundur eksponensial</text><circle cx="110" cy="680" r="34" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="110" y="688" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">1</text><line x1="148" y1="680" x2="290" y2="680" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="220" y="664" font-size="18" font-weight="800" text-anchor="middle" fill="#0f100d">1 mnt</text><circle cx="330" cy="680" r="34" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="330" y="688" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">2</text><line x1="368" y1="680" x2="510" y2="680" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="440" y="664" font-size="18" font-weight="800" text-anchor="middle" fill="#0f100d">2 mnt</text><circle cx="550" cy="680" r="34" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="550" y="688" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">3</text><line x1="588" y1="680" x2="730" y2="680" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="660" y="664" font-size="18" font-weight="800" text-anchor="middle" fill="#0f100d">4 mnt</text><circle cx="770" cy="680" r="34" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="770" y="688" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">4</text><line x1="808" y1="680" x2="950" y2="680" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="880" y="664" font-size="18" font-weight="800" text-anchor="middle" fill="#0f100d">8 mnt</text><circle cx="990" cy="680" r="34" fill="#f4b6c2" stroke="#0f100d" stroke-width="4"/><text x="990" y="688" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">5</text><text x="110" y="742" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">percobaan</text><text x="990" y="742" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">max_attempts</text><text x="1050" y="690" font-size="17" font-weight="700" text-anchor="start" fill="#0f100d">-&gt; menyerah,</text><text x="1050" y="714" font-size="17" font-weight="700" text-anchor="start" fill="#0f100d">cek manual</text><rect x="40" y="772" width="1120" height="112" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="64" y="808" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">Job dimasukkan di transaksi yang sama dengan booking: booking batal, job ikut batal.</text><text x="64" y="840" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">dedupe_key unik: satu booking satu pengingat. Idempotency-Key di Resend: retry tidak membuat email dobel.</text><text x="64" y="870" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">locked_until 5 menit: job milik worker yang mati diambil lagi setelahnya.</text>
</svg>
