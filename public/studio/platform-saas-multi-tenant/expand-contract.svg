<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810" width="1200" height="810" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Tiga rilis expand, pindah, contract untuk mengganti client_email menjadi contact_email: tambah kolom dan trigger sinkron, kode pindah ke kolom baru, lalu kolom lama dihapus</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="810" fill="#ffffff"/>
<text x="600" y="56" font-size="32" font-weight="800" text-anchor="middle" fill="#0f100d">Expand/contract: ganti nama kolom tanpa mematikan aplikasi</text><rect x="40" y="96" width="360" height="600" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><rect x="40" y="96" width="360" height="60" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="220" y="136" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Rilis N: Expand</text><text x="64" y="190" font-size="18" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">bookings</text><rect x="64" y="206" width="150" height="44" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="139" y="235" font-size="16" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">client_email</text><rect x="234" y="206" width="150" height="44" rx="10" fill="#b5d36f" stroke="#0f100d" stroke-width="3" stroke-dasharray="8 6"/><text x="309" y="235" font-size="16" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">contact_email</text><text x="214" y="268" font-size="16" font-weight="700" text-anchor="middle" fill="#0f100d">trigger sinkron dua arah</text><text x="64" y="312" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">Migrasi</text><text x="64" y="340" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">tambah kolom (nullable)</text><text x="64" y="368" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">trigger sinkron dua arah</text><text x="64" y="396" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">backfill per 5.000 baris,</text><text x="64" y="424" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">  commit tiap batch</text><text x="64" y="452" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">CHECK ... NOT VALID,</text><text x="64" y="480" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">  lalu VALIDATE</text><text x="64" y="508" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">indeks CONCURRENTLY</text><text x="64" y="536" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">lock_timeout 5s</text><line x1="60" y1="560" x2="380" y2="560" stroke="#0f100d" stroke-width="2" stroke-linecap="round"/><text x="64" y="592" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">Kode yang berjalan</text><text x="64" y="622" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">v lama: client_email</text><text x="64" y="650" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">v N: client_email</text><text x="64" y="678" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">trigger mengisi kolom baru</text><rect x="420" y="96" width="360" height="600" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><rect x="420" y="96" width="360" height="60" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="600" y="136" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Rilis N+1: Pindah</text><text x="444" y="190" font-size="18" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">bookings</text><rect x="444" y="206" width="150" height="44" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="519" y="235" font-size="16" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">client_email</text><rect x="614" y="206" width="150" height="44" rx="10" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="689" y="235" font-size="16" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">contact_email</text><text x="594" y="268" font-size="16" font-weight="700" text-anchor="middle" fill="#0f100d">keduanya masih tersinkron</text><text x="444" y="312" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">Migrasi</text><text x="444" y="340" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">tidak ada migrasi</text><text x="444" y="368" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d"></text><text x="444" y="396" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">kode membaca dan menulis</text><text x="444" y="424" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">contact_email</text><line x1="440" y1="560" x2="760" y2="560" stroke="#0f100d" stroke-width="2" stroke-linecap="round"/><text x="444" y="592" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">Kode yang berjalan</text><text x="444" y="622" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">v N dan v N+1 sempat</text><text x="444" y="650" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">berjalan bersamaan;</text><text x="444" y="678" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">trigger menjaga keduanya benar</text><rect x="800" y="96" width="360" height="600" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><rect x="800" y="96" width="360" height="60" rx="18" fill="#f4b6c2" stroke="#0f100d" stroke-width="4"/><text x="980" y="136" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Rilis N+2: Contract</text><text x="824" y="190" font-size="18" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">bookings</text><rect x="824" y="206" width="150" height="44" rx="10" fill="#f1f1ee" stroke="#0f100d" stroke-width="3" stroke-dasharray="8 6"/><text x="899" y="235" font-size="16" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">client_email</text><rect x="994" y="206" width="150" height="44" rx="10" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="1069" y="235" font-size="16" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">contact_email</text><text x="974" y="268" font-size="16" font-weight="700" text-anchor="middle" fill="#0f100d">kolom lama dihapus</text><text x="824" y="312" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">Migrasi</text><text x="824" y="340" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">SET NOT NULL (pakai CHECK</text><text x="824" y="368" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">  yang sudah valid, tanpa</text><text x="824" y="396" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">  scan ulang)</text><text x="824" y="424" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">hapus CHECK, trigger,</text><text x="824" y="452" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">  dan client_email</text><text x="824" y="480" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">baru setelah tidak ada kode</text><text x="824" y="508" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">  yang menyentuh kolom lama</text><line x1="820" y1="560" x2="1140" y2="560" stroke="#0f100d" stroke-width="2" stroke-linecap="round"/><text x="824" y="592" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">Kode yang berjalan</text><text x="824" y="622" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">hanya kode yang memakai</text><text x="824" y="650" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">contact_email</text><line x1="404" y1="400" x2="416" y2="400" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="784" y1="400" x2="796" y2="400" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="600" y="744" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Setiap migrasi harus cocok dengan dua versi kode yang sempat berjalan bersamaan saat deploy.</text><text x="600" y="778" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Tiga pull request terpisah. Rollback aman di N dan N+1; setelah contract, kolom lama sudah hilang.</text>
</svg>
