<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">ambilJson: fetch melempar error saat koneksi putus, respons.ok bernilai false saat server menjawab 4xx atau 5xx; keduanya ditangkap tampilkanUntuk</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="600" fill="#ffffff"/>
<text x="600" y="58" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">ambilJson: dua cara permintaan gagal</text><rect x="60" y="120" width="300" height="110" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="210" y="170" font-size="22" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">await fetch(url)</text><text x="210" y="204" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">minta ke server</text><rect x="470" y="120" width="300" height="110" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="620" y="170" font-size="22" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">respons.ok ?</text><text x="620" y="204" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">status 200-299?</text><rect x="880" y="120" width="260" height="110" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1010" y="170" font-size="22" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">respons.json()</text><text x="1010" y="204" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">data siap dipakai</text><line x1="362" y1="175" x2="464" y2="175" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="413" y="160" font-size="15" font-weight="500" text-anchor="middle" fill="#0f100d">ada jawaban</text><line x1="772" y1="175" x2="874" y2="175" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="823" y="160" font-size="19" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">true</text><line x1="210" y1="232" x2="210" y2="324" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="226" y="286" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">melempar error</text><line x1="620" y1="232" x2="620" y2="324" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="636" y="286" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">false: 404, 500, ...</text><rect x="60" y="330" width="380" height="130" rx="18" fill="#f4b6c2" stroke="#0f100d" stroke-width="4"/><text x="250" y="374" font-size="23" font-weight="800" text-anchor="middle" fill="#0f100d">Koneksi putus</text><text x="250" y="410" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">"Tidak bisa terhubung ke</text><text x="250" y="436" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">server cuaca..."</text><rect x="470" y="330" width="380" height="130" rx="18" fill="#f4b6c2" stroke="#0f100d" stroke-width="4"/><text x="660" y="374" font-size="23" font-weight="800" text-anchor="middle" fill="#0f100d">Server menolak</text><text x="660" y="410" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">"Server cuaca menolak</text><text x="660" y="436" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">permintaan (kode 400)..."</text><rect x="880" y="330" width="260" height="130" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="3" stroke-dasharray="10 8"/><text x="1010" y="374" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">tampilkanUntuk</text><text x="1010" y="408" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">catch → baris status</text><text x="1010" y="436" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">finally → tombol aktif</text><line x1="250" y1="462" x2="250" y2="500" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="660" y1="462" x2="660" y2="500" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="250" y1="500" x2="1010" y2="500" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="1010" y1="500" x2="1010" y2="466" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="600" y="560" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">fetch tidak melempar error untuk 404 atau 500. Tanpa cek respons.ok, galat server lolos diam-diam.</text>
</svg>
