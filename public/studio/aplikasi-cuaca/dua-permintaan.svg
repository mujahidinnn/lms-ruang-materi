<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Alur dua permintaan ke Open-Meteo: geocoding mengubah nama kota jadi koordinat, forecast mengubah koordinat jadi cuaca; lokasiku langsung ke forecast</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="670" fill="#ffffff"/>
<text x="600" y="58" font-size="38" font-weight="800" text-anchor="middle" fill="#0f100d">Dua permintaan: nama kota → koordinat → cuaca</text><rect x="40" y="110" width="220" height="120" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="150" y="160" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">Pengguna</text><text x="150" y="198" font-size="19" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">"Bandung"</text><rect x="340" y="100" width="820" height="150" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="364" y="140" font-size="24" font-weight="800" text-anchor="start" fill="#0f100d">1. Geocoding</text><text x="364" y="176" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">geocoding-api.open-meteo.com/v1/search</text><text x="364" y="206" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">?name=Bandung&amp;count=1&amp;language=id</text><text x="364" y="236" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">→ results[0].latitude, results[0].longitude</text><line x1="262" y1="170" x2="334" y2="170" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="340" y="300" width="820" height="150" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="364" y="340" font-size="24" font-weight="800" text-anchor="start" fill="#0f100d">2. Forecast</text><text x="364" y="376" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">api.open-meteo.com/v1/forecast</text><text x="364" y="406" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">?latitude=-6.92&amp;longitude=107.61&amp;current=...&amp;daily=...</text><text x="364" y="436" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">→ current { temperature_2m, weather_code } dan daily</text><line x1="750" y1="252" x2="750" y2="294" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="40" y="310" width="220" height="120" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="150" y="354" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Pakai</text><text x="150" y="386" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">lokasiku</text><text x="150" y="416" font-size="16" font-weight="500" text-anchor="middle" fill="#0f100d">lat, lon dari browser</text><line x1="262" y1="370" x2="334" y2="370" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="340" y="500" width="820" height="90" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="364" y="540" font-size="21" font-weight="800" text-anchor="start" fill="#0f100d">Tanpa hasil:</text><text x="520" y="540" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">results tidak ada sama sekali</text><text x="364" y="574" font-size="21" font-weight="800" text-anchor="start" fill="#0f100d">Koordinat salah:</text><text x="560" y="574" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">status 400, { "error": true, "reason": ... }</text><text x="600" y="640" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Jalan pintas lokasiku melompati geocoding karena koordinatnya sudah ada.</text>
</svg>
