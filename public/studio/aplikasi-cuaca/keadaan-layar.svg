<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Keadaan layar: awal, memuat, berhasil, dan tiga keadaan gagal; membuka lagi memuat tempat terakhir</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="730" fill="#ffffff"/>
<text x="600" y="58" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Keadaan layar aplikasi cuaca</text><rect x="60" y="110" width="300" height="130" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="210" y="154" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">Awal</text><text x="210" y="190" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">cari kota atau</text><text x="210" y="218" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">pakai lokasi</text><rect x="450" y="110" width="300" height="130" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="600" y="154" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">Memuat</text><text x="600" y="190" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">"Memuat cuaca..."</text><text x="600" y="218" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">tombol nonaktif</text><rect x="840" y="110" width="300" height="130" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="990" y="154" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">Berhasil</text><text x="990" y="190" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">kartu sekarang</text><text x="990" y="218" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">dan 7 hari</text><line x1="362" y1="160" x2="444" y2="160" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="403" y="146" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">Cari</text><text x="403" y="196" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">Lokasiku</text><line x1="752" y1="175" x2="834" y2="175" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="380" width="320" height="120" rx="18" fill="#f4b6c2" stroke="#0f100d" stroke-width="4"/><text x="220" y="426" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Kota tidak ditemukan</text><text x="220" y="464" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">sebut nama yang diketik</text><line x1="600" y1="242" x2="220" y2="374" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="440" y="380" width="320" height="120" rx="18" fill="#f4b6c2" stroke="#0f100d" stroke-width="4"/><text x="600" y="426" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Internet putus / server</text><text x="600" y="464" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">sarankan coba lagi</text><line x1="600" y1="242" x2="600" y2="374" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="820" y="380" width="320" height="120" rx="18" fill="#f4b6c2" stroke="#0f100d" stroke-width="4"/><text x="980" y="426" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Izin lokasi ditolak</text><text x="980" y="464" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">arahkan ke cari kota</text><line x1="600" y1="242" x2="980" y2="374" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="612" y="300" font-size="20" font-weight="700" text-anchor="start" fill="#0f100d">gagal</text><rect x="840" y="540" width="300" height="110" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="3" stroke-dasharray="10 8"/><text x="990" y="584" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Dibuka lagi besok</text><text x="990" y="620" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">tempat terakhir → Memuat</text><path d="M860 540 C 780 530, 780 300, 720 246" fill="none" stroke="#0f100d" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" marker-end="url(#ah)"/><text x="60" y="560" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">Dari keadaan gagal, pengguna</text><text x="60" y="590" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">cukup mencari lagi: kembali</text><text x="60" y="620" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">ke Memuat, bukan muat ulang.</text><text x="600" y="700" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Semua pesan, termasuk gagal, tampil di satu baris status yang dibacakan pembaca layar.</text>
</svg>
