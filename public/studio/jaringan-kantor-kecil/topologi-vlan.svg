<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 970" width="1200" height="970" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Topologi jaringan kantor: modem ISP di ether1, access point trunk VLAN 10, 20, 30 di ether2, PC staf VLAN 10 di ether3, printer VLAN 30 di ether4, dan tabel rencana IP tiap VLAN</title>
<defs></defs>
<rect width="1200" height="970" fill="#ffffff"/>
<text x="600" y="58" font-size="34" font-weight="800" text-anchor="middle" fill="#0f100d">Topologi RTR-KANTOR: satu bridge, tiga VLAN</text><rect x="470" y="86" width="260" height="60" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="600" y="126" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Internet</text><line x1="600" y1="146" x2="600" y2="176" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="470" y="176" width="260" height="60" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="600" y="216" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Modem ISP</text><line x1="600" y1="236" x2="600" y2="290" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><text x="616" y="272" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">ether1  WAN, DHCP dari ISP</text><rect x="160" y="290" width="880" height="120" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="600" y="334" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">RTR-KANTOR  (RouterOS v7)</text><text x="600" y="370" font-size="21" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">bridge br-lan  vlan-filtering=yes</text><text x="600" y="398" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">gateway .1 di vlan10-staf, vlan20-tamu, vlan30-printer</text><line x1="250" y1="410" x2="250" y2="520" stroke="#0f100d" stroke-width="5" stroke-linecap="round"/><rect x="188" y="428" width="124" height="40" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="250" y="455" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">ether2</text><text x="264" y="500" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">trunk 10, 20, 30 bertag</text><rect x="100" y="520" width="300" height="130" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="250" y="558" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">Access point</text><text x="250" y="590" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">SSID Kantor-Staf -&gt; VLAN 10</text><text x="250" y="616" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">SSID Kantor-Tamu -&gt; VLAN 20</text><line x1="600" y1="410" x2="600" y2="520" stroke="#0f100d" stroke-width="5" stroke-linecap="round"/><rect x="538" y="428" width="124" height="40" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="600" y="455" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">ether3</text><text x="614" y="500" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">VLAN 10 tanpa tag</text><rect x="450" y="520" width="300" height="130" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="600" y="558" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">PC staf</text><text x="600" y="590" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">pvid=10</text><text x="600" y="616" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">dapat 192.168.10.1xx</text><line x1="950" y1="410" x2="950" y2="520" stroke="#0f100d" stroke-width="5" stroke-linecap="round"/><rect x="888" y="428" width="124" height="40" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="950" y="455" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">ether4</text><text x="964" y="500" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">VLAN 30 tanpa tag</text><rect x="800" y="520" width="300" height="130" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="950" y="558" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">Printer</text><text x="950" y="590" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">pvid=30</text><text x="950" y="616" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">tetap 192.168.30.10</text><text x="60" y="712" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d">Zona</text><text x="220" y="712" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d">VLAN</text><text x="320" y="712" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d">Interface</text><text x="560" y="712" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d">Gateway</text><text x="830" y="712" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d">Pool DHCP</text><text x="1030" y="712" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d">Sewa</text><line x1="50" y1="726" x2="1150" y2="726" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><rect x="50" y="744" width="1100" height="44" rx="10" fill="#b5d36f" stroke="#0f100d" stroke-width="2"/><text x="60" y="774" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d">STAF</text><text x="220" y="774" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">10</text><text x="320" y="774" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">vlan10-staf</text><text x="560" y="774" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">192.168.10.1/24</text><text x="830" y="774" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">.100-.199</text><text x="1030" y="774" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">8 jam</text><rect x="50" y="796" width="1100" height="44" rx="10" fill="#f4b6c2" stroke="#0f100d" stroke-width="2"/><text x="60" y="826" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d">TAMU</text><text x="220" y="826" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">20</text><text x="320" y="826" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">vlan20-tamu</text><text x="560" y="826" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">192.168.20.1/24</text><text x="830" y="826" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">.100-.250</text><text x="1030" y="826" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">1 jam</text><rect x="50" y="848" width="1100" height="44" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="2"/><text x="60" y="878" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d">PRINTER</text><text x="220" y="878" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">30</text><text x="320" y="878" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">vlan30-printer</text><text x="560" y="878" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">192.168.30.1/24</text><text x="830" y="878" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">.100-.120</text><text x="1030" y="878" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">1 hari</text><text x="600" y="930" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Alamat .2 sampai .99 disisakan untuk alamat tetap. Hindari 192.168.0.x dan 192.168.1.x milik modem.</text>
</svg>
