<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Peta akses antar zona: STAF boleh ke internet, router, dan printer; TAMU hanya ke internet dengan batas bandwidth; PRINTER tidak punya jalur keluar</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="800" fill="#ffffff"/>
<text x="600" y="58" font-size="32" font-weight="800" text-anchor="middle" fill="#0f100d">Matriks akses sebagai peta: siapa boleh bicara dengan siapa</text><rect x="150" y="100" width="300" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="300" y="140" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Internet</text><text x="300" y="176" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">lewat NAT di ether1</text><rect x="750" y="100" width="300" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="900" y="140" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Router (kelola)</text><text x="900" y="176" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">Winbox, SSH</text><rect x="35" y="440" width="270" height="120" rx="16" fill="#f4b6c2" stroke="#0f100d" stroke-width="4"/><text x="170" y="480" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">TAMU</text><text x="170" y="516" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">VLAN 20</text><text x="170" y="546" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">kepercayaan rendah</text><rect x="465" y="440" width="270" height="120" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="600" y="480" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">STAF</text><text x="600" y="516" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">VLAN 10</text><text x="600" y="546" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">kepercayaan tinggi</text><rect x="895" y="440" width="270" height="120" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="1030" y="480" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">PRINTER</text><text x="1030" y="516" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">VLAN 30</text><text x="1030" y="546" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">hanya menerima</text><line x1="170" y1="434" x2="270" y2="200" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="110" y="320" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d">boleh,</text><text x="110" y="346" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d">dibatasi</text><line x1="560" y1="434" x2="340" y2="200" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="470" y="310" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d">boleh</text><line x1="640" y1="434" x2="860" y2="200" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="770" y="310" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d">boleh</text><line x1="737" y1="500" x2="887" y2="500" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="812" y="486" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">cetak</text><line x1="307" y1="500" x2="463" y2="500" stroke="#0f100d" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10"/><line x1="371" y1="486" x2="399" y2="514" stroke="#0f100d" stroke-width="6" stroke-linecap="round"/><line x1="371" y1="514" x2="399" y2="486" stroke="#0f100d" stroke-width="6" stroke-linecap="round"/><text x="385" y="540" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">tidak</text><line x1="1030" y1="434" x2="1030" y2="300" stroke="#0f100d" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10"/><line x1="1016" y1="286" x2="1044" y2="314" stroke="#0f100d" stroke-width="6" stroke-linecap="round"/><line x1="1016" y1="314" x2="1044" y2="286" stroke="#0f100d" stroke-width="6" stroke-linecap="round"/><text x="1030" y="266" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">koneksi keluar</text><text x="1030" y="240" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">tidak memulai</text><rect x="40" y="620" width="1120" height="150" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="64" y="660" font-size="20" font-weight="700" text-anchor="start" fill="#0f100d">Garis putus dengan silang = ditolak. Yang tidak digambar juga ditolak: drop di akhir rantai.</text><text x="64" y="694" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">Laptop tamu terkena malware hanya menjangkau internet: tidak ke STAF, PRINTER, atau router.</text><text x="64" y="728" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">Semua zona tetap boleh memakai DNS, DHCP, dan NTP dari router.</text>
</svg>
