<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Frame tanpa tag dari PC staf masuk ether3, diberi tag VLAN 10 oleh pvid, lalu keluar lewat ether2 bertag atau ke interface vlan10-staf, dengan tabel tagged dan untagged per port</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="820" fill="#ffffff"/>
<text x="600" y="58" font-size="34" font-weight="800" text-anchor="middle" fill="#0f100d">Perjalanan frame di bridge dengan vlan-filtering</text><rect x="40" y="100" width="250" height="150" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="70" cy="130" r="18" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="70" y="138" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">1</text><text x="98" y="140" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">PC staf</text><text x="60" y="182" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">kirim frame</text><text x="60" y="208" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">tanpa tag ke ether3</text><rect x="330" y="100" width="250" height="150" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><circle cx="360" cy="130" r="18" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="360" y="138" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">2</text><text x="388" y="140" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">ether3</text><text x="350" y="182" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">pvid=10: frame</text><text x="350" y="208" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">diberi tag VLAN 10</text><rect x="620" y="100" width="250" height="150" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><circle cx="650" cy="130" r="18" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="650" y="138" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">3</text><text x="678" y="140" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">br-lan</text><text x="640" y="182" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">cek tabel VLAN 10:</text><text x="640" y="208" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">port mana boleh?</text><rect x="910" y="100" width="250" height="150" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><circle cx="940" cy="130" r="18" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="940" y="138" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">4</text><text x="968" y="140" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Keluar</text><text x="930" y="182" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">ether2 bertag 10,</text><text x="930" y="208" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">atau ke vlan10-staf</text><line x1="294" y1="175" x2="324" y2="175" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="584" y1="175" x2="614" y2="175" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="874" y1="175" x2="904" y2="175" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="60" y="318" font-size="24" font-weight="800" text-anchor="start" fill="#0f100d">Tabel /interface bridge vlan</text><text x="60" y="366" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d">VLAN</text><text x="400" y="366" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">ether2</text><text x="560" y="366" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">ether3</text><text x="720" y="366" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">ether4</text><text x="880" y="366" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">br-lan</text><text x="1040" y="366" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d">interface</text><text x="60" y="424" font-size="21" font-weight="800" text-anchor="start" fill="#0f100d">10 STAF</text><rect x="340" y="386" width="120" height="52" rx="10" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="400" y="421" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">tagged</text><rect x="500" y="386" width="120" height="52" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="560" y="421" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">untagged</text><rect x="660" y="386" width="120" height="52" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="2"/><text x="720" y="421" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">-</text><rect x="820" y="386" width="120" height="52" rx="10" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="880" y="421" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">tagged</text><text x="1040" y="421" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">vlan10-staf</text><text x="60" y="488" font-size="21" font-weight="800" text-anchor="start" fill="#0f100d">20 TAMU</text><rect x="340" y="450" width="120" height="52" rx="10" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="400" y="485" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">tagged</text><rect x="500" y="450" width="120" height="52" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="2"/><text x="560" y="485" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">-</text><rect x="660" y="450" width="120" height="52" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="2"/><text x="720" y="485" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">-</text><rect x="820" y="450" width="120" height="52" rx="10" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="880" y="485" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">tagged</text><text x="1040" y="485" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">vlan20-tamu</text><text x="60" y="552" font-size="21" font-weight="800" text-anchor="start" fill="#0f100d">30 PRINTER</text><rect x="340" y="514" width="120" height="52" rx="10" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="400" y="549" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">tagged</text><rect x="500" y="514" width="120" height="52" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="2"/><text x="560" y="549" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">-</text><rect x="660" y="514" width="120" height="52" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="720" y="549" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">untagged</text><rect x="820" y="514" width="120" height="52" rx="10" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="880" y="549" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">tagged</text><text x="1040" y="549" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">vlan30-printer</text><rect x="40" y="600" width="1120" height="190" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="64" y="640" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Yang sering terlewat</text><text x="64" y="676" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">br-lan wajib tagged di setiap VLAN. Tanpa itu router tidak ikut di VLAN dan gateway .1 diam.</text><text x="64" y="708" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">ether2 hanya menerima frame bertag, ether3 dan ether4 hanya frame tanpa tag (frame-types).</text><text x="64" y="740" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">TAMU tidak punya port untagged di kabel: tamu datang lewat AP di ether2 dengan tag 20.</text><text x="64" y="772" font-size="20" font-weight="700" text-anchor="start" fill="#0f100d">Nyalakan vlan-filtering=yes paling akhir, dengan Safe Mode.</text>
</svg>
