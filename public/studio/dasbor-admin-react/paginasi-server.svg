th="2"/><text x="1057" y="205" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">19</text><rect x="1086" y="150" width="50" height="90" rx="8" fill="#e3edc8" stroke="#0f100d" stroke-width="2"/><text x="1111" y="205" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">20</text><text x="60" y="275" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">id 1-10</text><text x="168" y="275" font-size="17" font-weight="700" text-anchor="start" fill="#0f100d">id 21-30</text><text x="1136" y="275" font-size="17" font-weight="500" text-anchor="end" fill="#0f100d">id 191-194</text><text x="60" y="340" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d">Halaman 3:</text><text x="220" y="340" font-size="24" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">skip = (3 - 1) × 10 = 20</text><rect x="60" y="380" width="1080" height="70" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="84" y="424" font-size="20" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">GET /products?limit=10&amp;skip=20&amp;select=title,category,price,stock,rating</text><line x1="600" y1="452" x2="600" y2="500" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="506" width="1080" height="120" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="84" y="546" font-size="21" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">{ "products": [ ...10 baris... ],</text><text x="84" y="580" font-size="21" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">  "total": 194, "skip": 20, "limit": 10 }</text><text x="1116" y="600" font-size="19" font-weight="700" text-anchor="end" fill="#0f100d">total ÷ limit = jumlah halaman</text><text x="600" y="680" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Server hanya mengirim 10 baris yang sedang dilihat, berapa pun total datanya.</text>
