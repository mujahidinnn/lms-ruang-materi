<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Alur halaman produk: URL dibaca useUrlParams, menjadi query key useQuery, ditampilkan di tabel; setiap klik hanya menulis URL baru</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="700" fill="#ffffff"/>
<text x="600" y="58" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Satu putaran: URL → query → tabel → URL</text><rect x="60" y="110" width="480" height="130" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="300" y="154" font-size="23" font-weight="800" text-anchor="middle" fill="#0f100d">1. URL</text><text x="300" y="190" font-size="17" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/produk?q=phone&amp;sort=price</text><text x="300" y="218" font-size="17" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">&amp;order=desc&amp;page=2</text><rect x="660" y="110" width="480" height="130" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="900" y="154" font-size="23" font-weight="800" text-anchor="middle" fill="#0f100d">2. useUrlParams</text><text x="900" y="190" font-size="17" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">{ q, sortBy, order, page }</text><text x="900" y="218" font-size="17" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">pageFrom(): ?page=abc → 1</text><rect x="660" y="330" width="480" height="130" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="900" y="374" font-size="23" font-weight="800" text-anchor="middle" fill="#0f100d">3. useQuery</text><text x="900" y="410" font-size="17" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">key: ["products", query]</text><text x="900" y="438" font-size="17" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">skip = (page - 1) × 10</text><rect x="60" y="330" width="480" height="130" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="300" y="374" font-size="23" font-weight="800" text-anchor="middle" fill="#0f100d">4. Tabel + Pagination</text><text x="300" y="410" font-size="17" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">10 baris, panah ↓ di Harga</text><text x="300" y="438" font-size="17" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">Halaman 2 dari 20</text><line x1="542" y1="175" x2="654" y2="175" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="900" y1="242" x2="900" y2="324" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="658" y1="395" x2="546" y2="395" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><path d="M300 462 C 300 540, 120 540, 70 470 S 40 260, 120 246" fill="none" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="330" y="510" font-size="20" font-weight="700" text-anchor="start" fill="#0f100d">klik kolom, tombol halaman, Cari</text><text x="330" y="538" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">→ update() menulis URL baru,</text><text x="330" y="566" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">lalu putaran berulang</text><rect x="760" y="490" width="380" height="110" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="3" stroke-dasharray="10 8"/><text x="950" y="532" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">Back, muat ulang, bagikan</text><text x="950" y="566" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">langsung bekerja: semuanya</text><text x="950" y="592" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">hanya mengganti URL</text><text x="600" y="640" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Tidak ada useState untuk filter. Kalau page lupa masuk query key,</text><text x="600" y="672" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">TanStack Query menganggap halaman 1 dan 2 data yang sama.</text>
</svg>
