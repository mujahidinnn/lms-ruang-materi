<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" width="1200" height="710" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">SPA fallback: tanpa aturan, server menjawab 404 untuk /produk/5; dengan rewrite ke index.html, React Router yang menampilkan detail produk</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="710" fill="#ffffff"/>
<text x="600" y="58" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">SPA fallback: kenapa /produk/5 bisa 404</text><rect x="60" y="110" width="300" height="100" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="210" y="152" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Browser</text><text x="210" y="186" font-size="19" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">GET /produk/5</text><rect x="480" y="110" width="660" height="100" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="810" y="152" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Server statis (isi folder dist)</text><text x="810" y="186" font-size="19" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">index.html  assets/index-xxxx.js</text><line x1="362" y1="160" x2="474" y2="160" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="735" y="272" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">Ada berkas produk/5? Tidak.</text><line x1="540" y1="212" x2="310" y2="316" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="1040" y1="212" x2="960" y2="316" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="322" width="500" height="180" rx="18" fill="#f4b6c2" stroke="#0f100d" stroke-width="4"/><text x="310" y="364" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Tanpa aturan</text><text x="310" y="404" font-size="22" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">404 NOT_FOUND</text><text x="310" y="444" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">Klik dari dalam aplikasi lancar,</text><text x="310" y="472" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">tapi muat ulang atau tautan langsung gagal</text><rect x="640" y="322" width="500" height="180" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="890" y="364" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Dengan rewrite</text><text x="890" y="400" font-size="17" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">vercel.json: /(.*) → /index.html</text><text x="890" y="428" font-size="17" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">_redirects: /* /index.html 200</text><text x="890" y="472" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">server menjawab index.html</text><line x1="890" y1="504" x2="890" y2="556" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="640" y="562" width="500" height="100" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="890" y="604" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">React Router membaca /produk/5</text><text x="890" y="638" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">lalu merender ProdukDetail id 5</text><text x="60" y="590" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">Berkas yang memang ada (JS, CSS,</text><text x="60" y="620" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">gambar) tetap dilayani apa adanya;</text><text x="60" y="650" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">rewrite hanya untuk alamat yang</text><text x="60" y="680" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">tidak cocok dengan berkas.</text>
</svg>
