<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Grafik batang hasil tuning: waktu EXPLAIN ANALYZE turun dari 2000 ke 550 ke 25 milidetik, p95 bench turun dari 2008 ke 916 ke 315 milidetik dengan galat dari 20 menjadi 0</title>
