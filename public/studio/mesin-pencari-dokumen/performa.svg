<rect width="1200" height="820" fill="#ffffff"/>
<text x="600" y="60" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Dua perbaikan, diukur: 100 ribu dokumen</text><text x="60" y="130" font-size="28" font-weight="800" text-anchor="start" fill="#0f100d">EXPLAIN ANALYZE kueri "produk"</text><text x="1140" y="130" font-size="21" font-weight="500" text-anchor="end" fill="#0f100d">32.185 potongan cocok</text><text x="60" y="198" font-size="22" font-weight="600" text-anchor="start" fill="#0f100d">ts_rank_cd, semua baris</text><rect x="400" y="166" width="500" height="46" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="914" y="198" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d">2.000 ms</text><text x="60" y="276" font-size="22" font-weight="600" text-anchor="start" fill="#0f100d">ts_rank, semua baris</text><rect x="400" y="244" width="137.5" height="46" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="551.5" y="276" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d">550 ms</text><text x="60" y="354" font-size="22" font-weight="600" text-anchor="start" fill="#0f100d">ts_rank, saring judul</text><rect x="400" y="322" width="8" height="46" rx="10" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="422" y="354" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d">25 ms · 1.586 baris</text><text x="60" y="440" font-size="28" font-weight="800" text-anchor="start" fill="#0f100d">p95 bench, 4 klien paralel</text><text x="1140" y="440" font-size="21" font-weight="500" text-anchor="end" fill="#0f100d">400 request, cache aplikasi dingin</text><text x="60" y="508" font-size="22" font-weight="600" text-anchor="start" fill="#0f100d">naif (ts_rank_cd)</text><rect x="400" y="476" width="500" height="46" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="914" y="508" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d">2.008 ms · 20 galat</text><text x="60" y="586" font-size="22" font-weigh