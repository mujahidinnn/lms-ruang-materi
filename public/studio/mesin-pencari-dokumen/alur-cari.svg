<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="1200" height="950" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Alur request pencarian: validasi dan rate limit, cache, kueri AND, koreksi ejaan trigram, fallback OR, ranking dengan keyset, cuplikan aman, lalu JSON dan metrik</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="950" fill="#ffffff"/>
<text x="600" y="60" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Satu request GET /cari, dari atas ke bawah</text><rect x="120" y="95" width="420" height="105" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="330" y="133" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">Validasi + rate limit</text><text x="330" y="167" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">skema Fastify, 60 req/menit per IP</text><rect x="120" y="240" width="420" height="105" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="330" y="278" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">Cache LRU 60 detik</text><text x="330" y="312" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">hit: kembalikan, x-cache: hit</text><rect x="120" y="385" width="420" height="105" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="330" y="423" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">1. websearch_to_tsquery</text><text x="330" y="457" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">semua kata wajib (AND)</text><rect x="120" y="530" width="420" height="105" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="330" y="568" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">2. Maksud Anda (pg_trgm)</text><text x="330" y="602" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">kata tak dikenal -&gt; terdekat</text><rect x="120" y="675" width="420" height="105" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="330" y="713" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">3. Sebagian kata (OR)</text><text x="330" y="747" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">kalau tetap nol hasil</text><line x1="330" y1="200" x2="330" y2="236" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="330" y1="345" x2="330" y2="381" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="330" y1="490" x2="330" y2="526" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="330" y1="635" x2="330" y2="671" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="344" y="226" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">lolos</text><text x="344" y="371" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">miss</text><text x="344" y="516" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">0 hasil</text><text x="344" y="661" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">0 hasil</text><text x="555" y="427" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">ada hasil</text><line x1="540" y1="437" x2="690" y2="437" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="540" y1="582" x2="690" y2="520" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 10" marker-end="url(#ah)"/><line x1="540" y1="727" x2="690" y2="560" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 10" marker-end="url(#ah)"/><rect x="690" y="385" width="420" height="200" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="900" y="423" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">Ranking + halaman</text><text x="900" y="457" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">kata umum? saring dari judul dulu</text><text x="900" y="485" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">skor = ts_rank x kesegaran x klik</text><text x="900" y="513" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">DISTINCT ON doc: potongan terbaik</text><text x="900" y="541" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">keyset: (skor, id) &lt; cursor</text><line x1="900" y1="585" x2="900" y2="660" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="690" y="665" width="420" height="115" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="900" y="703" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">ts_headline -&gt; escape</text><text x="900" y="737" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">penanda \u0002 -&gt; &lt;mark&gt;</text><line x1="900" y1="780" x2="900" y2="822" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="690" y="825" width="420" height="95" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="900" y="863" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">JSON + facet + log</text><text x="900" y="900" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">hasil, berikutnya, total, facet</text><rect x="120" y="825" width="420" height="95" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="330" y="863" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">Metrik /metrics</text><text x="330" y="900" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">histogram durasi, label cache</text><line x1="690" y1="872" x2="544" y2="872" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 10" marker-end="url(#ah)"/>
</svg>
