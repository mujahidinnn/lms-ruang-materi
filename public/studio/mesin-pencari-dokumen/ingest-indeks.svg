<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="1200" height="940" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Alur ingest berkas Markdown dan HTML menjadi potongan, kolom tsv berbobot A B C dengan indeks GIN, dan rantai kamus konfigurasi teks idn</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="940" fill="#ffffff"/>
<text x="600" y="60" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Dari berkas bantuan ke indeks pencarian</text><rect x="30" y="100" width="240" height="150" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="150" y="138" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">Berkas</text><text x="150" y="172" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">.md (front matter)</text><text x="150" y="200" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">.html (meta)</text><rect x="320" y="100" width="260" height="150" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="450" y="138" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">HTML bersih</text><text x="450" y="172" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">marked: md -&gt; html</text><text x="450" y="200" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">buang nav, script,</text><text x="450" y="228" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">footer, aside</text><rect x="630" y="100" width="260" height="150" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="760" y="138" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">Potongan</text><text x="760" y="172" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">satu per h2 / h3</text><text x="760" y="200" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">maks 1.500 karakter</text><text x="760" y="228" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">+ anchor #bagian</text><rect x="940" y="100" width="220" height="150" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="1050" y="138" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">Upsert</text><text x="1050" y="172" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">hash isi sama:</text><text x="1050" y="200" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">dilewati</text><line x1="270" y1="175" x2="312" y2="175" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="580" y1="175" x2="622" y2="175" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="890" y1="175" x2="932" y2="175" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="60" y="320" font-size="28" font-weight="800" text-anchor="start" fill="#0f100d">Kolom generated tsv (dihitung Postgres saat INSERT/UPDATE)</text><rect x="60" y="345" width="70" height="54" rx="12" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="95" y="383" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">A</text><text x="155" y="381" font-size="24" font-weight="600" text-anchor="start" fill="#0f100d">judul dokumen</text><text x="560" y="381" font-size="24" font-weight="500" text-anchor="end" fill="#0f100d">bobot 1,0</text><rect x="60" y="415" width="70" height="54" rx="12" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="95" y="453" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">B</text><text x="155" y="451" font-size="24" font-weight="600" text-anchor="start" fill="#0f100d">subjudul (h2 › h3)</text><text x="560" y="451" font-size="24" font-weight="500" text-anchor="end" fill="#0f100d">bobot 0,4</text><rect x="60" y="485" width="70" height="54" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="95" y="523" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">C</text><text x="155" y="521" font-size="24" font-weight="600" text-anchor="start" fill="#0f100d">isi potongan</text><text x="560" y="521" font-size="24" font-weight="500" text-anchor="end" fill="#0f100d">bobot 0,2</text><rect x="620" y="345" width="520" height="194" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="880" y="390" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Indeks GIN pada tsv</text><text x="880" y="428" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">leksem -&gt; daftar baris</text><text x="880" y="466" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">'password' -&gt; 12, 13, 57, ...</text><text x="880" y="504" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">@@ mencari tanpa membaca tabel</text><text x="60" y="610" font-size="28" font-weight="800" text-anchor="start" fill="#0f100d">Konfigurasi teks idn: satu kata melewati tiga kamus berurutan</text><rect x="60" y="640" width="260" height="110" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="190" y="682" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">unaccent</text><text x="190" y="720" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">café -&gt; cafe</text><line x1="322" y1="695" x2="356" y2="695" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="360" y="640" width="260" height="110" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="490" y="682" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">idn_sinonim</text><text x="490" y="720" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">sandi -&gt; password</text><line x1="622" y1="695" x2="656" y2="695" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="660" y="640" width="260" height="110" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="790" y="682" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">idn_kata</text><text x="790" y="720" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">huruf kecil,</text><text x="790" y="744" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">stopword dibuang</text><line x1="922" y1="695" x2="956" y2="695" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="960" y="640" width="180" height="110" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1050" y="682" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">leksem</text><text x="1050" y="720" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">tanpa stem</text><rect x="60" y="785" width="1080" height="70" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="600" y="829" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">"Cara ganti kata sandi di HP"  -&gt;  'ganti':2  'password':4  'ponsel':6</text><text x="600" y="900" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Ubah kamus = bangun ulang image db dan isi ulang data: tsv yang tersimpan tidak ikut berubah.</text>
</svg>
