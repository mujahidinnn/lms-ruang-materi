="80" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1010" y="552" font-size="18" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">chrome.commands</text><text x="1010" y="580" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">Alt+Shift+F</text><line x1="764" y1="205" x2="852" y2="558" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="40" y="610" width="1120" height="64" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="3" stroke-dasharray="10 8"/><text x="600" y="650" font-size="19" font-weight="600" text-anchor="middle" fill="#0f100d">Chrome boleh mematikan service worker kapan saja; alarm menyalakannya lagi, keadaan dibaca dari storage.</text>
