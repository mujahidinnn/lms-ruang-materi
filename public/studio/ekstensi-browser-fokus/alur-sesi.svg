<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Mesin keadaan Fokus Dulu: Mulai memindahkan diam ke fokus dan memasang aturan blokir, alarm sesi memindahkan fokus ke istirahat lalu ke diam dengan notifikasi, Berhenti dari mana saja kembali ke diam. Yang disimpan hanya mode dan waktu akhir.</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="760" fill="#ffffff"/>
<text x="600" y="58" font-size="38" font-weight="800" text-anchor="middle" fill="#0f100d">Tiga keadaan sesi Fokus Dulu</text><rect x="60" y="250" width="280" height="150" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="200" y="302" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Diam</text><text x="200" y="342" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">tanpa mode</text><text x="200" y="370" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">badge kosong</text><rect x="460" y="250" width="280" height="150" rx="14" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="600" y="302" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Fokus · 25 menit</text><text x="600" y="342" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">aturan blokir AKTIF</text><text x="600" y="370" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">badge hijau: menit sisa</text><rect x="860" y="250" width="280" height="150" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="1000" y="302" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Istirahat · 5 menit</text><text x="1000" y="342" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">aturan blokir dicabut</text><text x="1000" y="370" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">badge abu-abu</text><line x1="344" y1="325" x2="452" y2="325" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="398" y="206" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Mulai</text><text x="398" y="234" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">popup / Alt+Shift+F</text><line x1="744" y1="325" x2="852" y2="325" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="798" y="206" font-size="17" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">alarm "sesi"</text><text x="798" y="234" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">+ notifikasi</text><path d="M1000 404 C1000 520, 200 520, 200 412" fill="none" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="600" y="540" font-size="18" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">alarm "sesi" berbunyi lagi</text><text x="600" y="570" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">notifikasi “Istirahat selesai”, kembali diam</text><path d="M600 246 C600 140, 200 140, 200 242" fill="none" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 10" marker-end="url(#ah)"/><path d="M1000 246 C1000 110, 230 100, 214 240" fill="none" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 10" marker-end="url(#ah)"/><text x="600" y="112" font-size="20" font-weight="700" text-anchor="middle" fill="#0f100d">Berhenti (dari mana saja): cabut aturan, hapus alarm dan badge</text><rect x="120" y="610" width="960" height="120" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="3" stroke-dasharray="10 8"/><text x="600" y="650" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Yang disimpan hanya dua nilai di chrome.storage.local</text><text x="400" y="684" font-size="19" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">mode: "fokus" | "istirahat"</text><text x="820" y="684" font-size="19" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">akhir: Date.now() + durasi</text><text x="600" y="716" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">Sisa waktu selalu dihitung: akhir − Date.now(), jadi tetap benar walau service worker tidur.</text>
</svg>
