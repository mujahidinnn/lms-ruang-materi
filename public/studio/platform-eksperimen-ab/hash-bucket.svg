<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Assignment dua hash. Hash traffic memutuskan unit ikut eksperimen: menaikkan traffic dari 10 ke 20 persen hanya menambah unit baru. Hash varian memilih control atau treatment: mengubah bobot 50/50 menjadi 70/30 memindahkan bucket 5000 sampai 6999, sekitar 20 persen unit, dari treatment ke control.</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="660" fill="#ffffff"/>
<text x="600" y="56" font-size="34" font-weight="800" text-anchor="middle" fill="#0f100d">Dua hash: ikut atau tidak, lalu varian yang mana</text><text x="600" y="100" font-size="18" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">hash 1: bucket(salt + ":traffic", unit)</text><text x="140" y="152" font-size="20" font-weight="800" text-anchor="end" fill="#0f100d">traffic 10%</text><rect x="160" y="120" width="96" height="50" rx="6" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="208" y="153" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">10%</text><rect x="256" y="120" width="864" height="50" rx="6" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="688" y="153" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">default, tidak dicatat</text><text x="140" y="222" font-size="20" font-weight="800" text-anchor="end" fill="#0f100d">traffic 20%</text><text x="140" y="246" font-size="15" font-weight="500" text-anchor="end" fill="#6b6f66">unit lama tetap</text><rect x="160" y="190" width="96" height="50" rx="6" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="208" y="223" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">lama</text><rect x="256" y="190" width="96" height="50" rx="6" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="304" y="223" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">baru</text><rect x="352" y="190" width="768" height="50" rx="6" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="736" y="223" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">default</text><text x="160" y="262" font-size="14" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">0</text><text x="256" y="262" font-size="14" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">1000</text><text x="352" y="262" font-size="14" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">2000</text><text x="640" y="262" font-size="14" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">5000</text><text x="832" y="262" font-size="14" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">7000</text><text x="1120" y="262" font-size="14" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">10000</text><text x="600" y="320" font-size="18" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">hash 2: bucket(salt + ":variant", unit), independen dari hash 1</text><text x="140" y="372" font-size="20" font-weight="800" text-anchor="end" fill="#0f100d">bobot 50/50</text><rect x="160" y="340" width="480" height="50" rx="6" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="400" y="373" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">control</text><rect x="640" y="340" width="480" height="50" rx="6" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="880" y="373" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">treatment</text><text x="140" y="442" font-size="20" font-weight="800" text-anchor="end" fill="#0f100d">bobot 70/30</text><text x="140" y="466" font-size="15" font-weight="500" text-anchor="end" fill="#6b6f66">≈20% unit pindah</text><rect x="160" y="410" width="480" height="50" rx="6" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="400" y="443" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">control</text><rect x="640" y="410" width="192" height="50" rx="6" fill="#f4b6c2" stroke="#0f100d" stroke-width="3"/><text x="736" y="443" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">pindah → control</text><rect x="832" y="410" width="288" height="50" rx="6" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="976" y="443" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">treatment</text><text x="160" y="482" font-size="14" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">0</text><text x="256" y="482" font-size="14" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">1000</text><text x="352" y="482" font-size="14" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">2000</text><text x="640" y="482" font-size="14" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">5000</text><text x="832" y="482" font-size="14" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">7000</text><text x="1120" y="482" font-size="14" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">10000</text><rect x="100" y="520" width="1000" height="110" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="3" stroke-dasharray="10 8"/><text x="600" y="560" font-size="21" font-weight="700" text-anchor="middle" fill="#0f100d">Naikkan traffic kapan saja: unit yang sudah ikut tetap di variannya.</text><text x="600" y="596" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">Bobot dikunci saat running (409). Mau bobot lain? Buat flag baru dengan salt baru.</text>
</svg>
