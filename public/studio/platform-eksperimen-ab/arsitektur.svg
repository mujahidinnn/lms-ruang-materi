<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Arsitektur platform eksperimen: SDK di layanan produk mengevaluasi flag di memori, menerima perubahan lewat SSE dan mengirim event per batch. API menyimpan flag bersama audit log dan NOTIFY dalam satu transaksi, menyimpan event ke tabel berpartisi bulanan dengan kunci event_id dan ts, dan membuat laporan dari jumlah-jumlah per varian.</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="750" fill="#ffffff"/>
<text x="600" y="56" font-size="36" font-weight="800" text-anchor="middle" fill="#0f100d">Platform eksperimen dari ujung ke ujung</text><rect x="40" y="110" width="340" height="250" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="210" y="150" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Layanan produk</text><rect x="66" y="172" width="288" height="166" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="210" y="204" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d">SDK (di memori)</text><text x="84" y="236" font-size="17" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">variant(flag, user)</text><text x="84" y="262" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d">sinkron, tanpa jaringan</text><text x="84" y="292" font-size="17" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">track(metrik, user, nilai)</text><text x="84" y="318" font-size="16" font-weight="500" text-anchor="start" fill="#0f100d">antre → batch, id pseudonim</text><rect x="470" y="110" width="300" height="250" rx="14" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="620" y="150" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">API eksperimen</text><text x="492" y="192" font-size="17" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">GET  /sdk/flags</text><text x="492" y="222" font-size="17" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">GET  /sdk/stream</text><text x="492" y="252" font-size="17" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">POST /events</text><text x="492" y="282" font-size="17" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">PUT  /admin/flags/:key</text><text x="492" y="312" font-size="17" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">POST .../kill</text><text x="492" y="342" font-size="17" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">GET  .../results</text><rect x="860" y="130" width="300" height="110" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1010" y="174" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">PM / on-call</text><text x="1010" y="206" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">token admin = actor di audit</text><line x1="856" y1="190" x2="778" y2="220" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="860" y="270" width="300" height="90" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="3" stroke-dasharray="10 8"/><text x="1010" y="308" font-size="18" font-weight="600" text-anchor="middle" fill="#0f100d">Laporan: SRM, CI,</text><text x="1010" y="334" font-size="18" font-weight="600" text-anchor="middle" fill="#0f100d">CUPED, guardrail</text><line x1="778" y1="330" x2="852" y2="318" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="462" y1="170" x2="384" y2="170" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="423" y="158" font-size="15" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">SSE</text><line x1="462" y1="228" x2="384" y2="228" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="423" y="216" font-size="15" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">flags</text><line x1="384" y1="300" x2="462" y2="300" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="423" y="288" font-size="15" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">batch</text><rect x="40" y="440" width="1120" height="250" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="600" y="480" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">PostgreSQL</text><rect x="70" y="500" width="300" height="160" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="220" y="534" font-size="20" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">flags</text><text x="220" y="566" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">salt, traffic_bp, varian,</text><text x="220" y="592" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">killed, version</text><text x="220" y="630" font-size="17" font-weight="700" text-anchor="middle" fill="#0f100d">NOTIFY saat COMMIT</text><rect x="400" y="500" width="300" height="160" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="550" y="534" font-size="20" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">audit_log</text><text x="550" y="566" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">siapa, apa, kenapa,</text><text x="550" y="592" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">before / after</text><text x="550" y="630" font-size="17" font-weight="700" text-anchor="middle" fill="#0f100d">trigger: hanya INSERT</text><rect x="730" y="500" width="400" height="160" rx="14" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="930" y="534" font-size="19" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">events (partisi per bulan)</text><rect x="748" y="552" width="86" height="44" rx="8" fill="#e3edc8" stroke="#0f100d" stroke-width="2"/><text x="791" y="580" font-size="13" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">2026_10</text><rect x="843" y="552" width="86" height="44" rx="8" fill="#e3edc8" stroke="#0f100d" stroke-width="2"/><text x="886" y="580" font-size="13" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">2026_11</text><rect x="938" y="552" width="86" height="44" rx="8" fill="#e3edc8" stroke="#0f100d" stroke-width="2"/><text x="981" y="580" font-size="13" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">2026_12</text><rect x="1033" y="552" width="86" height="44" rx="8" fill="#ffffff" stroke="#0f100d" stroke-width="2" stroke-dasharray="6 5"/><text x="1076" y="580" font-size="13" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">DEFAULT</text><text x="930" y="630" font-size="17" font-weight="700" text-anchor="middle" fill="#0f100d">PK (event_id, ts) → duplikat dibuang</text><line x1="520" y1="366" x2="246" y2="490" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="350" y="414" font-size="15" font-weight="600" text-anchor="end" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">simpan + audit + NOTIFY</text><line x1="300" y1="492" x2="574" y2="368" stroke="#0f100d" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#ah)"/><text x="500" y="414" font-size="15" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">LISTEN</text><line x1="640" y1="364" x2="900" y2="494" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="860" y="418" font-size="15" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">INSERT … ON CONFLICT</text><text x="600" y="722" font-size="18" font-weight="600" text-anchor="middle" fill="#0f100d">Analisis: Postgres menjumlah n, Σy, Σy², Σx, Σx², Σxy per varian; Node menghitung uji dari angka itu.</text>
</svg>
