ight="264" rx="6" fill="#f4b6c2" stroke="#0f100d" stroke-width="3"/><text x="910" y="184" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">20,0%</text><text x="910" y="486" font-size="15" font-weight="500" text-anchor="middle" fill="#0f100d">intip</text><text x="910" y="508" font-size="15" font-weight="500" text-anchor="middle" fill="#0f100d">stop saat p&lt;0,05</text><rect x="1000" y="397.96" width="120" height="62.04" rx="6" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="1060" y="385.96" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">4,7%</text><text x="1060" y="486" font-size="15" font-weight="500" text-anchor="middle" fill="#0f100d">intip</text><text x="1060" y="508" font-size="15" font-weight="500" text-anchor="middle" fill="#0f100d">batas Pocock</text>
</svg>
