<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Kiri: p-value satu eksperimen A/A tanpa efek, dicek sepuluh kali; sempat di bawah 0,05 di intipan 2 lalu naik lagi. Kanan: dari 2.000 eksperimen A/A, membaca sekali di akhir memberi 4,9 persen positif palsu, berhenti saat p kurang dari 0,05 di salah satu dari 10 intipan memberi 20 persen, dan batas Pocock memberi 4,7 persen.</title>
<defs></defs>
<rect width="1200" height="600" fill="#ffffff"/>
