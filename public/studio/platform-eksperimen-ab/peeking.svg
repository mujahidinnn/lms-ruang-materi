="110" cy="430.7134851134713" r="6" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><circle cx="162.22222222222223" cy="446.3449587983963" r="9" fill="#0f100d" stroke="#0f100d" stroke-width="3"/><circle cx="214.44444444444446" cy="298.35657119924315" r="6" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><circle cx="266.66666666666663" cy="309.99940044938387" r="6" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><circle cx="318.8888888888889" cy="294.1108938464887" r="6" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><circle cx="371.11111111111114" cy="260.76543885905824" r="6" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><circle cx="423.3333333333333" cy="167.0012207507736" r="6" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><circle cx="475.55555555555554" cy="143.8173300469423" r="6" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><circle cx="527.7777777777778" cy="168.8970024505486" r="6" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><circle cx="580" cy="243.97166579135276" r="6" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="110" y="484" font-size="14" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">1</text><text x="162.22222222222223" y="484" font-size="14" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">2</text><text x="214.44444444444446" y="484" font-size="14" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">3</text><text x="266.66666666666663" y="484" font-size="14" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">4</text><text x="318.8888888888889" y="484" font-size="14" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">5</text><text x="371.11111111111114" y="484" font-size="14" font-weight="600" text-anchor="middle" fill="#0f