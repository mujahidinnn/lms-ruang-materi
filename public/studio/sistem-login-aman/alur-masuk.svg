<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Alur POST /login: rate limit, cari email, verifikasi argon2 dengan hash palsu bila email tidak ada, regenerasi sesi, lalu redirect; gagal selalu 401 dengan pesan sama</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="900" fill="#ffffff"/>
<text x="600" y="62" font-size="38" font-weight="800" text-anchor="middle" fill="#0f100d">POST /login: satu jalan berhasil, satu pesan gagal</text><rect x="70" y="110" width="520" height="92" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="330" y="148" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">loginLimiter</text><text x="330" y="182" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">hanya percobaan gagal yang dihitung</text><rect x="70" y="260" width="520" height="92" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="330" y="298" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">SELECT ... WHERE email = $1</text><text x="330" y="332" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">email dicari di tabel users</text><rect x="70" y="410" width="520" height="92" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="330" y="448" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">argon2.verify(hash, sandi)</text><text x="330" y="482" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">email tak ada: verifikasi DUMMY_HASH</text><rect x="70" y="560" width="520" height="92" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="330" y="598" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">req.session.regenerate()</text><text x="330" y="632" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">id sesi lama dibuang (session fixation)</text><rect x="70" y="710" width="520" height="92" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="330" y="748" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">303 ke /akun</text><text x="330" y="782" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">userId tersimpan di sesi baru</text><line x1="330" y1="204" x2="330" y2="254" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="330" y1="354" x2="330" y2="404" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="330" y1="504" x2="330" y2="554" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="346" y="538" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d">cocok</text><line x1="330" y1="654" x2="330" y2="704" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="740" y="110" width="420" height="92" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="950" y="148" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">429</text><text x="950" y="182" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">lebih dari 10 gagal dalam 15 menit</text><rect x="740" y="410" width="420" height="92" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="950" y="448" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">401</text><text x="950" y="482" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">"Email atau kata sandi salah."</text><line x1="594" y1="156" x2="732" y2="156" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="594" y1="456" x2="732" y2="456" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="663" y="440" font-size="22" font-weight="700" text-anchor="middle" fill="#0f100d">tidak</text><rect x="740" y="560" width="420" height="200" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="764" y="598" font-size="21" font-weight="800" text-anchor="start" fill="#0f100d">Kenapa DUMMY_HASH?</text><text x="764" y="632" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">argon2 sengaja lambat. Tanpa hash</text><text x="764" y="666" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">palsu, email tak terdaftar dijawab</text><text x="764" y="700" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">lebih cepat, dan selisih waktu itu</text><text x="764" y="734" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">membocorkan email mana yang ada.</text><text x="600" y="860" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Email salah dan sandi salah mendapat pesan, status, dan waktu respons yang sama.</text>
</svg>
