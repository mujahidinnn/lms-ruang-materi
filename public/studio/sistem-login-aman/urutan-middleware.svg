<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 890" width="1200" height="890" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Sembilan lapisan app.js berurutan: helmet, health, urlencoded, session, csrf, loadUser, rute, 404, dan penangan error</title>
<defs></defs>
<rect width="1200" height="890" fill="#ffffff"/>
<text x="600" y="62" font-size="36" font-weight="800" text-anchor="middle" fill="#0f100d">Urutan app.use() di app.js menentukan siapa diperiksa apa</text><rect x="110" y="110" width="1050" height="60" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><circle cx="70" cy="140" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="70" y="149" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">1</text><text x="134" y="149" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">helmet()</text><text x="460" y="149" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">header keamanan: CSP, X-Content-Type-Options, dan lainnya</text><line x1="70" y1="162" x2="70" y2="206" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><rect x="110" y="184" width="1050" height="60" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><circle cx="70" cy="214" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="70" y="223" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">2</text><text x="134" y="223" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">GET "/health"</text><text x="460" y="223" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">dijawab di sini, sebelum sesi: tanpa baris sesi baru</text><line x1="70" y1="236" x2="70" y2="280" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><rect x="110" y="258" width="1050" height="60" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><circle cx="70" cy="288" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="70" y="297" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">3</text><text x="134" y="297" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">express.urlencoded</text><text x="460" y="297" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">membaca body form, maksimal 10 KB</text><line x1="70" y1="310" x2="70" y2="354" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><rect x="110" y="332" width="1050" height="60" rx="12" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><circle cx="70" cy="362" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="70" y="371" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">4</text><text x="134" y="371" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">session(...)</text><text x="460" y="371" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">cookie sid: HttpOnly, SameSite Lax, Secure di produksi</text><line x1="70" y1="384" x2="70" y2="428" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><rect x="110" y="406" width="1050" height="60" rx="12" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><circle cx="70" cy="436" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="70" y="445" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">5</text><text x="134" y="445" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">csrf</text><text x="460" y="445" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">POST tanpa token yang cocok dengan sesi ditolak 403</text><line x1="70" y1="458" x2="70" y2="502" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><rect x="110" y="480" width="1050" height="60" rx="12" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><circle cx="70" cy="510" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="70" y="519" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">6</text><text x="134" y="519" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">loadUser</text><text x="460" y="519" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">res.locals.user dibaca ulang dari tabel users</text><line x1="70" y1="532" x2="70" y2="576" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><rect x="110" y="554" width="1050" height="60" rx="12" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><circle cx="70" cy="584" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="70" y="593" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">7</text><text x="134" y="593" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">auth, reset</text><text x="460" y="593" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">rute; pagar requireLogin dan requireRole</text><line x1="70" y1="606" x2="70" y2="650" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><rect x="110" y="628" width="1050" height="60" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><circle cx="70" cy="658" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="70" y="667" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">8</text><text x="134" y="667" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">404</text><text x="460" y="667" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">tidak ada rute yang cocok</text><line x1="70" y1="680" x2="70" y2="724" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><rect x="110" y="702" width="1050" height="60" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><circle cx="70" cy="732" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="70" y="741" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">9</text><text x="134" y="741" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">(err, req, res, next)</text><text x="460" y="741" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">error tak dikenal: dicatat di log, pengguna melihat pesan umum</text><text x="600" y="820" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Request masuk dari atas. csrf butuh sesi, jadi harus setelah session.</text><text x="600" y="854" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">loadUser setelah csrf; auth dan reset sebelum 404. Tukar urutannya dan pagar ikut bergeser.</text>
</svg>
