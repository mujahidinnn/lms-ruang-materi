<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1120" width="1200" height="1120" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Urutan atur ulang kata sandi: token acak dibuat, hash disimpan 30 menit, tautan dikirim, lalu token dihapus saat dipakai, sandi diganti, dan semua sesi lama dihapus</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="1120" fill="#ffffff"/>
<text x="600" y="62" font-size="38" font-weight="800" text-anchor="middle" fill="#0f100d">Atur ulang kata sandi dengan token sekali pakai</text><rect x="70" y="95" width="260" height="64" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="200" y="137" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Browser</text><rect x="470" y="95" width="260" height="64" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="600" y="137" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Server</text><rect x="870" y="95" width="260" height="64" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="1000" y="137" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Database</text><line x1="200" y1="159" x2="200" y2="1000" stroke="#0f100d" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12"/><line x1="600" y1="159" x2="600" y2="1000" stroke="#0f100d" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12"/><line x1="1000" y1="159" x2="1000" y2="1000" stroke="#0f100d" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12"/><line x1="208" y1="230" x2="588" y2="230" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="250" cy="200" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="250" y="207" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">1</text><text x="278" y="208" font-size="21" font-weight="700" text-anchor="start" fill="#0f100d">POST /lupa-sandi</text><text x="400" y="260" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">email=ani@contoh.com</text><rect x="435" y="285" width="330" height="50" rx="12" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="600" y="317" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">token = randomBytes(32)</text><line x1="608" y1="410" x2="988" y2="410" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="650" cy="380" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="650" y="387" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">2</text><text x="678" y="388" font-size="21" font-weight="700" text-anchor="start" fill="#0f100d">INSERT</text><text x="800" y="440" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">sha256(token), +30 menit</text><line x1="592" y1="500" x2="212" y2="500" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="250" cy="470" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="250" y="477" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">3</text><text x="278" y="478" font-size="21" font-weight="700" text-anchor="start" fill="#0f100d">jawaban selalu sama</text><text x="400" y="530" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">terdaftar atau tidak</text><rect x="30" y="555" width="340" height="78" rx="12" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="200" y="587" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">tautan ?token=... dikirim</text><text x="200" y="615" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">lewat email (di sini: log)</text><line x1="208" y1="700" x2="588" y2="700" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="250" cy="670" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="250" y="677" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">4</text><text x="278" y="678" font-size="21" font-weight="700" text-anchor="start" fill="#0f100d">POST /atur-ulang</text><text x="400" y="730" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">token + sandi baru</text><line x1="608" y1="790" x2="988" y2="790" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="650" cy="760" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="650" y="767" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">5</text><text x="678" y="768" font-size="21" font-weight="700" text-anchor="start" fill="#0f100d">DELETE ... RETURNING</text><text x="800" y="820" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">hash cocok, belum kedaluwarsa</text><line x1="608" y1="880" x2="988" y2="880" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="650" cy="850" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="650" y="857" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">6</text><text x="678" y="858" font-size="21" font-weight="700" text-anchor="start" fill="#0f100d">UPDATE, DELETE</text><text x="800" y="910" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">sandi baru, hapus semua sesi</text><line x1="592" y1="970" x2="212" y2="970" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="250" cy="940" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="250" y="947" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">7</text><text x="278" y="948" font-size="21" font-weight="700" text-anchor="start" fill="#0f100d">sandi diganti</text><text x="600" y="1050" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Database hanya menyimpan hash token, bukan tokennya.</text><text x="600" y="1084" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">DELETE ... RETURNING membuat tautan hangus begitu dipakai: hanya berlaku sekali.</text>
</svg>
