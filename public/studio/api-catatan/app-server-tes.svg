<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">app.js menyusun aplikasi dan diimpor oleh server.js yang membuka port, serta oleh tes supertest yang memanggil app tanpa port</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="800" fill="#ffffff"/>
<text x="600" y="62" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Kenapa app.js dan server.js dipisah</text><rect x="410" y="330" width="380" height="150" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="600" y="370" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">src/app.js</text><text x="600" y="406" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">menyusun rute dan middleware</text><text x="600" y="436" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">export const app</text><rect x="70" y="110" width="380" height="130" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="260" y="150" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">src/server.js</text><text x="260" y="186" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">app.listen(PORT)</text><rect x="750" y="110" width="380" height="130" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="940" y="150" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">test/notes.test.js</text><text x="940" y="186" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">request(app).get(...)</text><rect x="410" y="580" width="380" height="120" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="600" y="620" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">src/db.js</text><text x="600" y="656" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">pool ke PostgreSQL</text><line x1="380" y1="240" x2="500" y2="326" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="340" y="300" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">import { app }</text><line x1="820" y1="240" x2="700" y2="326" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="860" y="300" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">import { app }</text><line x1="600" y1="480" x2="600" y2="572" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="620" y="532" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">query</text><rect x="60" y="600" width="340" height="100" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="230" y="640" font-size="22" font-weight="700" text-anchor="middle" fill="#0f100d">Browser, curl,</text><text x="230" y="672" font-size="22" font-weight="700" text-anchor="middle" fill="#0f100d">Thunder Client</text><line x1="230" y1="594" x2="230" y2="248" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#ah)"/><text x="244" y="440" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">port 3000</text><rect x="800" y="600" width="340" height="100" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="970" y="640" font-size="22" font-weight="700" text-anchor="middle" fill="#0f100d">supertest memanggil app</text><text x="970" y="672" font-size="22" font-weight="700" text-anchor="middle" fill="#0f100d">langsung, tanpa port</text><line x1="970" y1="594" x2="970" y2="248" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#ah)"/><text x="600" y="760" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Hanya server.js yang membuka port. Tes mengimpor app tanpa menyalakan server sungguhan.</text>
</svg>
