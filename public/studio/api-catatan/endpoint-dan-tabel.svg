<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" width="1200" height="1010" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Kontrak API Catatan: enam endpoint dengan kode status sukses dan error, serta kolom tabel notes beserta aturannya</title>
<defs></defs>
<rect width="1200" height="1010" fill="#ffffff"/>
<text x="600" y="62" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Kontrak API Catatan: endpoint dan tabel</text><text x="60" y="120" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Metode</text><text x="210" y="120" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Path</text><text x="640" y="120" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Sukses</text><text x="900" y="120" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Error yang mungkin</text><rect x="40" y="140" width="1120" height="56" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><rect x="52" y="150" width="130" height="36" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="117" y="176" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">GET</text><text x="210" y="177" font-size="23" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/health</text><text x="640" y="177" font-size="23" font-weight="700" text-anchor="start" fill="#0f100d">200</text><text x="900" y="177" font-size="23" font-weight="500" text-anchor="start" fill="#0f100d">500</text><rect x="40" y="206" width="1120" height="56" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><rect x="52" y="216" width="130" height="36" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="117" y="242" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">GET</text><text x="210" y="243" font-size="23" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/api/notes?q=&amp;limit=</text><text x="640" y="243" font-size="23" font-weight="700" text-anchor="start" fill="#0f100d">200 (array)</text><text x="900" y="243" font-size="23" font-weight="500" text-anchor="start" fill="#0f100d">500</text><rect x="40" y="272" width="1120" height="56" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><rect x="52" y="282" width="130" height="36" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="117" y="308" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">GET</text><text x="210" y="309" font-size="23" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/api/notes/:id</text><text x="640" y="309" font-size="23" font-weight="700" text-anchor="start" fill="#0f100d">200</text><text x="900" y="309" font-size="23" font-weight="500" text-anchor="start" fill="#0f100d">400, 404</text><rect x="40" y="338" width="1120" height="56" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><rect x="52" y="348" width="130" height="36" rx="10" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="117" y="374" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">POST</text><text x="210" y="375" font-size="23" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/api/notes</text><text x="640" y="375" font-size="23" font-weight="700" text-anchor="start" fill="#0f100d">201 + Location</text><text x="900" y="375" font-size="23" font-weight="500" text-anchor="start" fill="#0f100d">400, 413, 422</text><rect x="40" y="404" width="1120" height="56" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><rect x="52" y="414" width="130" height="36" rx="10" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="117" y="440" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">PATCH</text><text x="210" y="441" font-size="23" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/api/notes/:id</text><text x="640" y="441" font-size="23" font-weight="700" text-anchor="start" fill="#0f100d">200</text><text x="900" y="441" font-size="23" font-weight="500" text-anchor="start" fill="#0f100d">400, 404, 413, 422</text><rect x="40" y="470" width="1120" height="56" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><rect x="52" y="480" width="130" height="36" rx="10" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="117" y="506" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">DELETE</text><text x="210" y="507" font-size="23" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/api/notes/:id</text><text x="640" y="507" font-size="23" font-weight="700" text-anchor="start" fill="#0f100d">204 tanpa body</text><text x="900" y="507" font-size="23" font-weight="500" text-anchor="start" fill="#0f100d">400, 404</text><text x="600" y="580" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Kata kerja ada di metode HTTP, path cukup kata benda jamak. Bentuk error selalu sama:</text><text x="600" y="616" font-size="23" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">{ "error": "...", "details": { ... } }</text><rect x="40" y="650" width="1120" height="330" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="70" y="694" font-size="28" font-weight="800" text-anchor="start" fill="#0f100d">Tabel notes</text><text x="1130" y="694" font-size="22" font-weight="500" text-anchor="end" fill="#0f100d">aturan penting juga dijaga database</text><text x="70" y="740" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">id</text><text x="260" y="740" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">INTEGER</text><text x="470" y="740" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">GENERATED ALWAYS AS IDENTITY, PRIMARY KEY</text><text x="70" y="780" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">title</text><text x="260" y="780" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">TEXT</text><text x="470" y="780" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">NOT NULL, CHECK panjang 1 sampai 120</text><text x="70" y="820" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">content</text><text x="260" y="820" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">TEXT</text><text x="470" y="820" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">NOT NULL DEFAULT ''</text><text x="70" y="860" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">pinned</text><text x="260" y="860" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">BOOLEAN</text><text x="470" y="860" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">NOT NULL DEFAULT false</text><text x="70" y="900" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">created_at</text><text x="260" y="900" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">TIMESTAMPTZ</text><text x="470" y="900" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">NOT NULL DEFAULT now()</text><text x="70" y="940" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">updated_at</text><text x="260" y="940" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">TIMESTAMPTZ</text><text x="470" y="940" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">NOT NULL DEFAULT now(), diisi ulang saat UPDATE</text>
</svg>
