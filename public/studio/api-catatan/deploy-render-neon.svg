<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810" width="1200" height="810" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Alur deploy: kode di-push ke GitHub, Render membangun dan menjalankan API, pemakai memanggil lewat HTTPS, dan API terhubung ke Neon Postgres dengan SSL</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="810" fill="#ffffff"/>
<text x="600" y="62" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">API Catatan di internet: Render dan Neon</text><rect x="40" y="130" width="260" height="120" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="170" y="170" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">GitHub</text><text x="170" y="206" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">repo api-catatan</text><rect x="40" y="360" width="260" height="150" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="170" y="400" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Pemakai API</text><text x="170" y="436" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">curl, browser,</text><text x="170" y="466" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">aplikasi lain</text><rect x="420" y="120" width="360" height="400" rx="20" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="600" y="166" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">Render Web Service</text><text x="450" y="222" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Build</text><text x="610" y="222" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">npm install</text><text x="450" y="280" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Start</text><text x="610" y="280" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">npm start</text><text x="450" y="338" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">PORT</text><text x="610" y="338" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">diisi Render</text><text x="450" y="396" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Health check</text><text x="610" y="396" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/health</text><text x="450" y="454" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Env</text><text x="610" y="454" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">DATABASE_URL</text><rect x="880" y="120" width="280" height="400" rx="20" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="1020" y="166" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">Neon Postgres</text><text x="1020" y="222" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">tabel notes</text><text x="1020" y="256" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">dibuat lewat</text><text x="1020" y="290" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">SQL Editor</text><text x="1020" y="324" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">(isi schema.sql)</text><text x="1020" y="392" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">region dekat</text><text x="1020" y="426" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">Render, misal</text><text x="1020" y="460" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">Singapore</text><line x1="304" y1="160" x2="412" y2="200" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="330" y="150" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d">push</text><line x1="304" y1="420" x2="412" y2="420" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="358" y="404" font-size="22" font-weight="700" text-anchor="middle" fill="#0f100d">HTTPS</text><line x1="786" y1="320" x2="872" y2="320" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="830" y="300" font-size="22" font-weight="700" text-anchor="middle" fill="#0f100d">SSL</text><rect x="40" y="570" width="1120" height="150" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="70" y="612" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Connection string Neon</text><text x="70" y="650" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">postgresql://USER:SANDI@HOST.neon.tech/DB?sslmode=require&amp;channel_binding=require</text><text x="70" y="694" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">Disimpan di Environment Render, tidak pernah di repo. sslmode wajib ada.</text><text x="600" y="770" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Paket gratis Render tidur saat sepi: request pertama setelahnya butuh sekitar satu menit.</text>
</svg>
