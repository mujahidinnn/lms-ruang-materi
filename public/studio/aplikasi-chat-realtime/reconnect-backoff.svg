<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Grafik jeda reconnect klien chat: percobaan 1 sampai 8 dengan jeda maksimum 0,5, 1, 2, 4, 8, 16, 30, 30 detik dan rentang acak setengah sampai penuh</title>
<defs></defs>
<rect width="1200" height="830" fill="#ffffff"/>
<text x="600" y="62" font-size="34" font-weight="800" text-anchor="middle" fill="#0f100d">Reconnect: jeda naik dua kali lipat, diacak 50 sampai 100 persen</text><line x1="250" y1="120" x2="250" y2="640" stroke="#0f100d" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 8"/><text x="250" y="672" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">0 s</text><line x1="375" y1="120" x2="375" y2="640" stroke="#0f100d" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 8"/><text x="375" y="672" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">5 s</text><line x1="500" y1="120" x2="500" y2="640" stroke="#0f100d" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 8"/><text x="500" y="672" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">10 s</text><line x1="625" y1="120" x2="625" y2="640" stroke="#0f100d" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 8"/><text x="625" y="672" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">15 s</text><line x1="750" y1="120" x2="750" y2="640" stroke="#0f100d" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 8"/><text x="750" y="672" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">20 s</text><line x1="875" y1="120" x2="875" y2="640" stroke="#0f100d" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 8"/><text x="875" y="672" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">25 s</text><line x1="1000" y1="120" x2="1000" y2="640" stroke="#0f100d" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 8"/><text x="1000" y="672" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">30 s</text><text x="60" y="162" font-size="21" font-weight="700" text-anchor="start" fill="#0f100d">percobaan 1</text><rect x="256.25" y="138" width="8" height="36" rx="8" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><rect x="270.5" y="142" width="127" height="28" fill="#ffffff"/><text x="276.5" y="163" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">0.25 - 0.5 s</text><text x="60" y="225" font-size="21" font-weight="700" text-anchor="start" fill="#0f100d">percobaan 2</text><rect x="262.5" y="201" width="12.5" height="36" rx="8" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><rect x="283" y="205" width="94" height="28" fill="#ffffff"/><text x="289" y="226" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">0.5 - 1 s</text><text x="60" y="288" font-size="21" font-weight="700" text-anchor="start" fill="#0f100d">percobaan 3</text><rect x="275" y="264" width="25" height="36" rx="8" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><rect x="308" y="268" width="72" height="28" fill="#ffffff"/><text x="314" y="289" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">1 - 2 s</text><text x="60" y="351" font-size="21" font-weight="700" text-anchor="start" fill="#0f100d">percobaan 4</text><rect x="300" y="327" width="50" height="36" rx="8" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><rect x="358" y="331" width="72" height="28" fill="#ffffff"/><text x="364" y="352" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">2 - 4 s</text><text x="60" y="414" font-size="21" font-weight="700" text-anchor="start" fill="#0f100d">percobaan 5</text><rect x="350" y="390" width="100" height="36" rx="8" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><rect x="458" y="394" width="72" height="28" fill="#ffffff"/><text x="464" y="415" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">4 - 8 s</text><text x="60" y="477" font-size="21" font-weight="700" text-anchor="start" fill="#0f100d">percobaan 6</text><rect x="450" y="453" width="200" height="36" rx="8" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><rect x="658" y="457" width="83" height="28" fill="#ffffff"/><text x="664" y="478" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">8 - 16 s</text><text x="60" y="540" font-size="21" font-weight="700" text-anchor="start" fill="#0f100d">percobaan 7</text><rect x="625" y="516" width="375" height="36" rx="8" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><rect x="1008" y="520" width="94" height="28" fill="#ffffff"/><text x="1014" y="541" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">15 - 30 s</text><text x="60" y="603" font-size="21" font-weight="700" text-anchor="start" fill="#0f100d">percobaan 8</text><rect x="625" y="579" width="375" height="36" rx="8" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><rect x="1008" y="583" width="94" height="28" fill="#ffffff"/><text x="1014" y="604" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">15 - 30 s</text><text x="600" y="720" font-size="21" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">Math.min(30_000, 500 * 2 ** attempt) * (0.5 + Math.random() / 2)</text><text x="600" y="762" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Tanpa acakan, 1000 klien yang putus bersamaan akan menyerbu server di milidetik yang sama.</text><text x="600" y="796" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Setelah tersambung: join dengan after = id terakhir, outbox dikirim ulang dengan cid sama.</text>
</svg>
