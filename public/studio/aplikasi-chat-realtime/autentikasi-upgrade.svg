<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Alur autentikasi WebSocket: ambil token lewat POST /token, kirim saat request upgrade, server menjawab 101 bila sah atau 401 lalu menutup socket</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="790" fill="#ffffff"/>
<text x="600" y="62" font-size="36" font-weight="800" text-anchor="middle" fill="#0f100d">Token diperiksa saat upgrade, sebelum WebSocket terbuka</text><rect x="80" y="95" width="340" height="64" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="250" y="137" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Browser</text><rect x="780" y="95" width="340" height="64" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="950" y="137" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Server (event upgrade)</text><line x1="250" y1="159" x2="250" y2="640" stroke="#0f100d" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12"/><line x1="950" y1="159" x2="950" y2="640" stroke="#0f100d" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12"/><line x1="258" y1="230" x2="938" y2="230" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="330" cy="200" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="330" y="207" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">1</text><text x="358" y="208" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d">POST /token</text><text x="600" y="262" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">{ "name": "ani" }</text><line x1="942" y1="320" x2="262" y2="320" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#ah)"/><circle cx="330" cy="290" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="330" y="297" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">2</text><text x="358" y="298" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d">token bertanda tangan HMAC, berlaku 1 jam</text><line x1="258" y1="420" x2="938" y2="420" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="330" cy="390" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="330" y="397" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">3</text><text x="358" y="398" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d">GET /ws?token=...  Upgrade: websocket</text><text x="600" y="452" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">header Origin ikut terkirim</text><rect x="730" y="470" width="440" height="60" rx="12" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="950" y="508" font-size="21" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">verifyToken + cek Origin</text><rect x="60" y="560" width="520" height="110" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="80" y="598" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Sah: 101 Switching Protocols</text><text x="80" y="632" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">handleUpgrade, koneksi WebSocket terbuka</text><rect x="620" y="560" width="520" height="110" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="640" y="598" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Tidak sah: 401 Unauthorized</text><text x="640" y="632" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">socket.destroy(), tanpa WebSocket</text><line x1="820" y1="534" x2="380" y2="554" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="950" y1="534" x2="950" y2="554" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="600" y="720" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Browser tidak bisa memasang header Authorization di WebSocket, jadi token lewat query string.</text><text x="600" y="754" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Token bisa tercatat di log akses, karena itu umurnya pendek.</text>
</svg>
