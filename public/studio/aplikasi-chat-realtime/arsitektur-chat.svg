<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810" width="1200" height="810" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Arsitektur chat: browser A di instance 1 dan browser B di instance 2; pesan disimpan di PostgreSQL lalu disiarkan lewat Redis pub/sub ke semua instance</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="810" fill="#ffffff"/>
<text x="600" y="62" font-size="36" font-weight="800" text-anchor="middle" fill="#0f100d">Satu pesan, dua instance: jalur kirim di aplikasi chat</text><rect x="80" y="100" width="300" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="230" y="140" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Browser A</text><text x="230" y="176" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">ani, room umum</text><rect x="820" y="100" width="300" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="970" y="140" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Browser B</text><text x="970" y="176" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">budi, room umum</text><rect x="80" y="300" width="300" height="110" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="230" y="340" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Instance 1</text><text x="230" y="376" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">Map room: socket A</text><rect x="820" y="300" width="300" height="110" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="970" y="340" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Instance 2</text><text x="970" y="376" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">Map room: socket B</text><rect x="480" y="300" width="240" height="110" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="600" y="340" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Redis</text><text x="600" y="376" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">pub/sub chat:events</text><rect x="80" y="520" width="300" height="110" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="230" y="560" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">PostgreSQL</text><text x="230" y="596" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">tabel messages</text><line x1="200" y1="194" x2="200" y2="292" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="170" cy="243" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="170" y="250" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">1</text><line x1="262" y1="292" x2="262" y2="198" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#ah)"/><circle cx="292" cy="243" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="292" y="250" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">3</text><line x1="230" y1="414" x2="230" y2="512" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="260" cy="463" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="260" y="470" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">2</text><line x1="384" y1="330" x2="476" y2="330" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="430" cy="300" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="430" y="307" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">4</text><line x1="724" y1="340" x2="816" y2="340" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="476" y1="380" x2="384" y2="380" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="770" cy="310" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="770" y="317" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">5</text><circle cx="430" cy="410" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="430" y="417" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">5</text><line x1="970" y1="292" x2="970" y2="198" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="1000" cy="243" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="1000" y="250" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">6</text><circle cx="440" cy="480" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="440" y="487" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">1</text><text x="470" y="487" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">send</text><text x="580" y="487" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">A mengirim send berisi room, cid, dan text</text><circle cx="440" cy="524" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="440" y="531" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">2</text><text x="470" y="531" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">INSERT</text><text x="580" y="531" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">pesan disimpan; cid yang sama tidak tersimpan dua kali</text><circle cx="440" cy="568" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="440" y="575" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">3</text><text x="470" y="575" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">ack</text><text x="580" y="575" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">pengirim mendapat id, pesan berhenti tampil pudar</text><circle cx="440" cy="612" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="440" y="619" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">4</text><text x="470" y="619" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">PUBLISH</text><text x="580" y="619" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">instance 1 menerbitkan event message ke Redis</text><circle cx="440" cy="656" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="440" y="663" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">5</text><text x="470" y="663" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">fan-out</text><text x="580" y="663" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">Redis meneruskan ke semua instance, termasuk instance 1</text><circle cx="440" cy="700" r="17" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="440" y="707" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">6</text><text x="470" y="707" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">deliver</text><text x="580" y="707" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">tiap instance mengirim ke socket lokal di room itu</text><text x="600" y="770" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Postgres adalah sumber kebenaran. Redis pub/sub tidak menyimpan apa pun: hanya pengantar cepat.</text>
</svg>
