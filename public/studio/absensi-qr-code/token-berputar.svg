<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Waktu dibagi jendela 30 detik, tiap jendela punya token idSesi.jendela.tandaTangan HMAC; server menerima jendela sekarang dan satu sebelumnya</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="750" fill="#ffffff"/>
<text x="600" y="58" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">QR berganti tiap 30 detik</text><rect x="40" y="100" width="265" height="170" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4" stroke-dasharray="10 8"/><text x="172" y="140" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">jendela 59012343</text><text x="172" y="176" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">09:59:30 - 10:00:00</text><text x="172" y="214" font-size="17" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">12.59012343.k9P…</text><text x="172" y="252" font-size="19" font-weight="800" text-anchor="middle" fill="#b42318">ditolak: kedaluwarsa</text><rect x="325" y="100" width="265" height="170" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="457" y="140" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">jendela 59012344</text><text x="457" y="176" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">10:00:00 - 10:00:30</text><text x="457" y="214" font-size="17" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">12.59012344.xQ7…</text><text x="457" y="252" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">diterima</text><rect x="610" y="100" width="265" height="170" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="742" y="140" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">jendela 59012345</text><text x="742" y="176" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">10:00:30 - 10:01:00</text><text x="742" y="214" font-size="17" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">12.59012345.Q2x…</text><text x="742" y="252" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">di layar sekarang</text><rect x="895" y="100" width="265" height="170" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4" stroke-dasharray="10 8"/><text x="1027" y="140" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">jendela 59012346</text><text x="1027" y="176" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">10:01:00 - 10:01:30</text><text x="1027" y="214" font-size="17" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">belum dibuat</text><text x="1027" y="252" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">belum ada</text><line x1="325" y1="296" x2="875" y2="296" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="325" y1="284" x2="325" y2="296" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="875" y1="284" x2="875" y2="296" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><text x="600" y="330" font-size="20" font-weight="700" text-anchor="middle" fill="#0f100d">diterima server: jendela sekarang + 1 sebelumnya, jadi umur token 30 sampai 60 detik</text><line x1="40" y1="372" x2="1150" y2="372" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="1150" y="402" font-size="19" font-weight="500" text-anchor="end" fill="#0f100d">waktu</text><rect x="40" y="430" width="540" height="240" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="64" y="472" font-size="23" font-weight="800" text-anchor="start" fill="#0f100d">Membuat (layar meminta QR)</text><text x="64" y="516" font-size="18" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">jendela = floor(waktuMs / 30000)</text><text x="64" y="552" font-size="18" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">ttd = HMAC-SHA256(QR_SECRET,</text><text x="64" y="588" font-size="18" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">            "12.59012345")</text><text x="64" y="624" font-size="18" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">isi QR = 12.59012345.ttd</text><rect x="620" y="430" width="540" height="240" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="644" y="472" font-size="23" font-weight="800" text-anchor="start" fill="#0f100d">Memeriksa (peserta absen)</text><text x="644" y="516" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">1. hitung ulang ttd dari id + jendela,</text><text x="644" y="550" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">   bandingkan dengan timingSafeEqual</text><text x="644" y="584" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">2. jendela harus sekarang atau</text><text x="644" y="618" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">   sekarang - 1</text><text x="600" y="712" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">Tanpa QR_SECRET tidak ada yang bisa membuat ttd yang cocok, dan server tidak perlu menyimpan token.</text>
</svg>
