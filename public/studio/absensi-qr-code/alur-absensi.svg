<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Alur absensi: layar menampilkan QR, HP memindai dan mengirim token, server memeriksa tanda tangan, jendela waktu, sesi, data, lalu INSERT dengan UNIQUE, dan SSE mengabari layar</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="760" fill="#ffffff"/>
<text x="600" y="58" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Perjalanan satu absen</text><rect x="30" y="110" width="250" height="190" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="155" y="160" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Layar panitia</text><text x="155" y="200" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">laptop + proyektor</text><text x="155" y="240" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">QR + daftar hadir</text><rect x="30" y="440" width="250" height="190" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="155" y="488" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">HP peserta</text><text x="155" y="524" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/scan</text><text x="155" y="560" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">BarcodeDetector</text><text x="155" y="596" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">atau jsQR</text><line x1="155" y1="302" x2="155" y2="432" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="170" y="362" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">kamera</text><text x="170" y="386" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">memindai QR</text><rect x="440" y="96" width="380" height="500" rx="20" fill="#ffffff" stroke="#0f100d" stroke-width="3" stroke-dasharray="12 8"/><text x="630" y="132" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Server Express</text><rect x="460" y="150" width="340" height="74" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="476" y="181" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">1. Tanda tangan HMAC cocok?</text><text x="476" y="210" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">tidak: 400 QR tidak sah</text><rect x="460" y="238" width="340" height="74" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="476" y="269" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">2. Masih 2 jendela terakhir?</text><text x="476" y="298" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">tidak: 400 kedaluwarsa</text><rect x="460" y="326" width="340" height="74" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="476" y="357" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">3. Sesi ada dan dibuka?</text><text x="476" y="386" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">tidak: 404 / 409</text><rect x="460" y="414" width="340" height="74" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="476" y="445" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">4. NIM dan nama wajar?</text><text x="476" y="474" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">tidak: 422 + details</text><rect x="460" y="502" width="340" height="74" rx="12" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="476" y="533" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">5. INSERT ke checkins</text><text x="476" y="562" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">ganda: 409   berhasil: 201</text><line x1="438" y1="165" x2="288" y2="165" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="363" y="152" font-size="16" font-weight="700" text-anchor="middle" fill="#0f100d">QR baru /30 dtk</text><line x1="438" y1="250" x2="288" y2="250" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="363" y="237" font-size="16" font-weight="700" text-anchor="middle" fill="#0f100d">SSE: hadir</text><line x1="282" y1="535" x2="432" y2="535" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="357" y="520" font-size="16" font-weight="700" text-anchor="middle" fill="#0f100d">POST token</text><text x="357" y="562" font-size="16" font-weight="500" text-anchor="middle" fill="#0f100d">+ NIM, nama</text><line x1="802" y1="539" x2="868" y2="539" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="874" y="470" width="296" height="150" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="1022" y="510" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">SQLite: checkins</text><text x="1022" y="548" font-size="17" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">UNIQUE (sesi, nim)</text><text x="1022" y="586" font-size="17" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">UNIQUE (sesi, perangkat)</text><rect x="874" y="150" width="296" height="250" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="3" stroke-dasharray="10 8"/><text x="1022" y="192" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d">Gagal di langkah</text><text x="1022" y="226" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d">mana pun:</text><text x="1022" y="260" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">tidak ada yang</text><text x="1022" y="294" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">tersimpan, HP</text><text x="1022" y="328" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">menampilkan</text><text x="1022" y="362" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">pesan errornya</text><text x="600" y="684" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">Setelah INSERT berhasil, kabarkan() mengirim event "hadir" ke semua layar yang menonton sesi itu.</text><text x="600" y="720" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">Jam yang dipakai hanya jam server, saat membuat maupun memeriksa token.</text>
</svg>
