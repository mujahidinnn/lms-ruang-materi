<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Tumpukan observabilitas: Prometheus menarik metrik dari layanan, mengevaluasi aturan SLO dan mengirim alert ke Alertmanager lalu ke penerima; log stdout dibaca Alloy dari Docker dan dikirim ke Loki; Grafana membaca Prometheus dan Loki</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="600" y="56" font-size="34" font-weight="800" text-anchor="middle" fill="#0f100d">Tumpukan observabilitas layanan-toko</text><text x="40" y="100" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Metrik</text><text x="40" y="470" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Log</text><rect x="35" y="110" width="270" height="156" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="170" y="150" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">layanan-toko</text><text x="170" y="186" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">Node.js :3000</text><text x="170" y="216" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">GET /metrics</text><text x="170" y="246" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">log JSON ke stdout</text><rect x="380" y="120" width="260" height="120" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="510" y="160" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Prometheus</text><text x="510" y="196" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">scrape tiap 15 dtk</text><text x="510" y="226" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">rules/slo.yml</text><rect x="720" y="120" width="240" height="120" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="840" y="160" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Alertmanager</text><text x="840" y="196" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">group, route,</text><text x="840" y="226" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">inhibit</text><rect x="1015" y="120" width="150" height="120" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1090" y="160" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">penerima</text><text x="1090" y="196" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">webhook,</text><text x="1090" y="226" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">Telegram</text><line x1="378" y1="180" x2="306" y2="180" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="342" y="166" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">tarik</text><line x1="642" y1="180" x2="714" y2="180" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="678" y="166" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">alert</text><line x1="962" y1="180" x2="1009" y2="180" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="360" y="320" width="300" height="100" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="510" y="360" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Grafana :3001</text><text x="510" y="396" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">dasbor dari kode</text><line x1="510" y1="242" x2="510" y2="314" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="524" y="286" font-size="18" font-weight="700" text-anchor="start" fill="#0f100d">PromQL</text><rect x="40" y="490" width="260" height="100" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="170" y="530" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Docker</text><text x="170" y="566" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">log kontainer</text><rect x="380" y="490" width="260" height="100" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="510" y="530" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Alloy</text><text x="510" y="566" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">docker.sock :ro</text><rect x="720" y="490" width="240" height="100" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="840" y="530" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Loki</text><text x="840" y="566" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">label: service, level</text><line x1="170" y1="268" x2="170" y2="484" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="184" y="380" font-size="18" font-weight="700" text-anchor="start" fill="#0f100d">stdout</text><line x1="302" y1="540" x2="374" y2="540" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="642" y1="540" x2="714" y2="540" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="800" y1="486" x2="666" y2="400" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="752" y="440" font-size="18" font-weight="700" text-anchor="start" fill="#0f100d">LogQL</text><text x="600" y="650" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">Prometheus memutuskan apakah alert menyala. Alertmanager memutuskan siapa diberi tahu dan kapan.</text><text x="600" y="684" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">Semua port terikat ke 127.0.0.1; dari luar, lihat lewat terowongan SSH.</text>
</svg>
