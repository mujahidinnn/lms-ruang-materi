<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Histogram kumulatif dari 100 request: bucket 0.05 berisi 30, 0.1 berisi 62, 0.2 berisi 88, 0.3 berisi 95, sampai +Inf berisi 100; rasio lambat 5 persen</title>
<defs></defs>
<rect width="1200" height="850" fill="#ffffff"/>
<text x="600" y="56" font-size="34" font-weight="800" text-anchor="middle" fill="#0f100d">Bucket histogram bersifat kumulatif</text><text x="600" y="96" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">Contoh: 100 request /api, http_request_duration_seconds_bucket</text><line x1="100" y1="540" x2="1128" y2="540" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><rect x="134" y="432" width="84" height="108" rx="8" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="176" y="418" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">30</text><text x="176" y="574" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">le="0.05"</text><rect x="246" y="316.8" width="84" height="223.2" rx="8" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="288" y="302.8" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">62</text><text x="288" y="574" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">le="0.1"</text><rect x="358" y="223.2" width="84" height="316.8" rx="8" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="400" y="209.2" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">88</text><text x="400" y="574" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">le="0.2"</text><rect x="470" y="198" width="84" height="342" rx="8" fill="#b5d36f" stroke="#0f100d" stroke-width="5"/><text x="512" y="184" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">95</text><text x="512" y="574" font-size="18" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">le="0.3"</text><rect x="582" y="187.2" width="84" height="352.8" rx="8" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="624" y="173.2" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">98</text><text x="624" y="574" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">le="0.5"</text><rect x="694" y="183.60000000000002" width="84" height="356.4" rx="8" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="736" y="169.60000000000002" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">99</text><text x="736" y="574" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">le="1"</text><rect x="806" y="180" width="84" height="360" rx="8" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="848" y="166" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">100</text><text x="848" y="574" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">le="2"</text><rect x="918" y="180" width="84" height="360" rx="8" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="960" y="166" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">100</text><text x="960" y="574" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">le="5"</text><rect x="1030" y="180" width="84" height="360" rx="8" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="1072" y="166" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">100</text><text x="1072" y="574" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">le="+Inf"</text><text x="512" y="612" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">batas SLO 300 ms</text><rect x="40" y="650" width="1120" height="170" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="64" y="690" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">Bucket le="0.3" berisi semua request yang selesai dalam 300 ms atau kurang, termasuk isi le="0.1".</text><text x="64" y="724" font-size="18" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">Rasio lambat = 1 - bucket{le="0.3"} / _count = 1 - 95/100 = 5%: anggaran latensi pas habis.</text><text x="64" y="758" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">Tanpa bucket 0.3, Prometheus hanya tahu angka di le="0.2" dan le="0.5" dan harus menebak di antaranya.</text><text x="64" y="792" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">Bucket +Inf selalu sama dengan _count: jumlah semua request.</text>
</svg>
