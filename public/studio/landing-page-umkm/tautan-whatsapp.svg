<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" width="1200" height="710" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Tautan wa.me dipecah: alamat resmi, nomor dengan kode negara 62, parameter text, dan pesan yang sudah di-encode</title>
<defs></defs>
<rect width="1200" height="710" fill="#ffffff"/>
<text x="600" y="58" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Membaca tautan WhatsApp</text><rect x="116" y="110" width="219" height="60" rx="8" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="124" y="148" font-size="24" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">https://wa.me/</text><rect x="341" y="110" width="204.5" height="60" rx="8" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="349" y="148" font-size="24" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">6281234567890</text><rect x="551.5" y="110" width="103" height="60" rx="8" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="559.5" y="148" font-size="24" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">?text=</text><rect x="660.5" y="110" width="436.5" height="60" rx="8" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="668.5" y="148" font-size="24" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">Halo%20Kedai%20Teras%2C%20...</text><line x1="225.5" y1="172" x2="195" y2="238" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><rect x="70" y="240" width="250" height="94" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="195" y="278" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Alamat resmi</text><text x="195" y="314" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">selalu sama</text><line x1="443.25" y1="172" x2="465" y2="238" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><rect x="340" y="240" width="250" height="162" rx="14" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="465" y="278" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Nomor WhatsApp</text><text x="465" y="314" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">kode negara 62,</text><text x="465" y="348" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">tanpa +, spasi, strip,</text><text x="465" y="382" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">dan tanpa 0 di depan</text><line x1="603" y1="172" x2="735" y2="238" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><rect x="610" y="240" width="250" height="94" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="735" y="278" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Pesan pembuka</text><text x="735" y="314" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">parameter text</text><line x1="878.75" y1="172" x2="1005" y2="238" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><rect x="880" y="240" width="250" height="162" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="1005" y="278" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Pesan ter-encode</text><text x="1005" y="314" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">%20 = spasi</text><text x="1005" y="348" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">%2C = koma</text><text x="1005" y="382" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">%3A = titik dua</text><rect x="70" y="480" width="1060" height="150" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="100" y="525" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Dari nomor biasa:</text><text x="420" y="525" font-size="24" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">0812-3456-7890  →  6281234567890</text><text x="100" y="590" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Dari kalimat biasa:</text><text x="420" y="590" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">encodeURIComponent("Halo Kedai Teras, ...")</text><text x="600" y="680" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Tanpa encode, spasi dan tanda baca bisa memotong pesan di tengah jalan.</text>
</svg>
