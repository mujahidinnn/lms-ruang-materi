<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Pratinjau tautan di WhatsApp: gambar dari og:image, judul dari og:title, deskripsi dari og:description, alamat dari og:url</title>
<defs></defs>
<rect width="1200" height="790" fill="#ffffff"/>
<text x="600" y="58" font-size="38" font-weight="800" text-anchor="middle" fill="#0f100d">Pratinjau tautan dibangun dari tag Open Graph</text><rect x="70" y="110" width="470" height="560" rx="26" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="305" y="150" font-size="20" font-weight="700" text-anchor="middle" fill="#0f100d">Chat WhatsApp</text><rect x="110" y="175" width="400" height="470" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><rect x="126" y="191" width="368" height="193" rx="10" fill="#e9d8c4" stroke="#0f100d" stroke-width="2"/><text x="310" y="280" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">og.jpg</text><text x="310" y="312" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">1200 x 630</text><text x="130" y="420" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">Kedai Teras | Kopi Susu Aren</text><text x="130" y="444" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">di Sleman</text><text x="130" y="480" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">Kopi susu aren dan roti bakar</text><text x="130" y="504" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">mulai Rp8.000. Pesan lewat...</text><text x="130" y="538" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d">kedai-teras.netlify.app</text><line x1="126" y1="560" x2="494" y2="560" stroke="#0f100d" stroke-width="2" stroke-linecap="round"/><text x="130" y="600" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">Cek menunya di sini ya</text><rect x="640" y="256" width="500" height="52" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="658" y="290" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">og:image (alamat https://)</text><line x1="500" y1="290" x2="636" y2="282" stroke="#0f100d" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/><rect x="640" y="386" width="500" height="52" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="658" y="420" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">og:title</text><line x1="500" y1="430" x2="636" y2="412" stroke="#0f100d" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/><rect x="640" y="462" width="500" height="52" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="658" y="496" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">og:description</text><line x1="500" y1="492" x2="636" y2="488" stroke="#0f100d" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/><rect x="640" y="526" width="500" height="52" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="658" y="560" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">og:url</text><line x1="500" y1="534" x2="636" y2="552" stroke="#0f100d" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/><text x="600" y="720" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Tanpa tag ini, aplikasi chat menebak sendiri atau hanya menampilkan alamat polos.</text><text x="600" y="758" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">og:image wajib alamat lengkap; setelah diubah, cek ulang dengan Sharing Debugger.</text>
</svg>
