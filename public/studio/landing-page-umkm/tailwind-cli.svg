<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Tailwind CLI membaca kelas di index.html dan tema di src/input.css, lalu menulis public/style.css yang hanya berisi kelas terpakai</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="700" fill="#ffffff"/>
<text x="600" y="58" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Tailwind CLI: dari kelas di HTML ke style.css</text><rect x="60" y="120" width="340" height="150" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="230" y="165" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">public/index.html</text><text x="230" y="205" font-size="19" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">class="bg-krem</text><text x="230" y="235" font-size="19" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">text-kopi md:grid"</text><rect x="60" y="300" width="340" height="150" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="230" y="345" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">src/input.css</text><text x="230" y="385" font-size="18" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">@import "tailwindcss";</text><text x="230" y="415" font-size="18" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">@theme { --color-... }</text><rect x="470" y="220" width="280" height="140" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="610" y="275" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">tailwindcss</text><text x="610" y="315" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">memindai kelas</text><line x1="402" y1="195" x2="464" y2="260" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="402" y1="375" x2="464" y2="320" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="820" y="220" width="320" height="140" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="980" y="270" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">public/style.css</text><text x="980" y="308" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">hanya kelas yang dipakai</text><text x="980" y="336" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">jangan diedit tangan</text><line x1="752" y1="290" x2="814" y2="290" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="490" width="1080" height="130" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="100" y="540" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">npm run dev</text><text x="470" y="540" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">--watch: tulis ulang style.css tiap kamu menyimpan berkas</text><text x="100" y="590" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">npm run build</text><text x="470" y="590" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">--minify: versi ringkas untuk tayang (dijalankan Netlify)</text><text x="600" y="668" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">style.css masuk .gitignore karena berkas hasil. Ubah warna di input.css saja.</text>
</svg>
