<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 625" width="1200" height="625" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Alur deploy Netlify: git push ke GitHub, Netlify menjalankan npm run build sesuai netlify.toml, lalu menayangkan folder public</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="625" fill="#ffffff"/>
<text x="600" y="58" font-size="38" font-weight="800" text-anchor="middle" fill="#0f100d">Setiap push: Netlify membangun lalu menayangkan</text><rect x="40" y="120" width="250" height="210" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="165" y="166" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">Laptop</text><text x="165" y="210" font-size="19" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">index.html</text><text x="165" y="242" font-size="19" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">src/input.css</text><text x="165" y="274" font-size="19" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">netlify.toml</text><rect x="340" y="120" width="230" height="210" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="455" y="166" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">GitHub</text><text x="455" y="210" font-size="19" font-weight="600" text-anchor="middle" fill="#0f100d">repositori</text><text x="455" y="242" font-size="19" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">tanpa style.css</text><rect x="620" y="120" width="270" height="210" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="755" y="166" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">Netlify build</text><text x="755" y="210" font-size="19" font-weight="600" text-anchor="middle" fill="#0f100d">npm install</text><text x="755" y="242" font-size="19" font-weight="600" text-anchor="middle" fill="#0f100d">npm run build</text><text x="755" y="274" font-size="19" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">→ public/style.css</text><rect x="940" y="120" width="220" height="210" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1050" y="166" font-size="25" font-weight="800" text-anchor="middle" fill="#0f100d">Tayang</text><text x="1050" y="210" font-size="19" font-weight="600" text-anchor="middle" fill="#0f100d">isi folder</text><text x="1050" y="242" font-size="19" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">public/</text><line x1="292" y1="225" x2="334" y2="225" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="572" y1="225" x2="614" y2="225" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="892" y1="225" x2="934" y2="225" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="313" y="365" font-size="20" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">git push</text><rect x="150" y="395" width="420" height="150" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="170" y="432" font-size="21" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">netlify.toml</text><text x="170" y="466" font-size="18" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">[build]</text><text x="196" y="494" font-size="18" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">command = "npm run build"</text><text x="196" y="522" font-size="18" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">publish = "public"</text><rect x="640" y="420" width="480" height="70" rx="35" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="880" y="464" font-size="22" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">https://kedai-teras.netlify.app</text><text x="600" y="590" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Kalau build gagal, situs lama tetap tayang. Buka log deploy di Netlify untuk melihat sebabnya.</text>
</svg>
