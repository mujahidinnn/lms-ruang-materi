<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 910" width="1200" height="910" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Sketsa landing page UMKM di HP dan layar lebar: pembuka dengan tombol WhatsApp, menu dan harga, testimoni, lokasi, dan tombol melayang di HP</title>
<defs></defs>
<rect width="1200" height="910" fill="#ffffff"/>
<text x="600" y="58" font-size="38" font-weight="800" text-anchor="middle" fill="#0f100d">Urutan halaman UMKM: HP dulu, lalu layar lebar</text><rect x="70" y="100" width="300" height="760" rx="34" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="220" y="895" font-size="24" font-weight="700" text-anchor="middle" fill="#0f100d">HP (360px)</text><rect x="84" y="122" width="272" height="44" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="98" y="150" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">Kedai Teras</text><text x="342" y="150" font-size="15" font-weight="500" text-anchor="end" fill="#0f100d">Menu Lokasi</text><rect x="84" y="176" width="272" height="250" rx="10" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="98" y="204" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">Kopi susu aren yang</text><text x="98" y="228" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">bikin balik lagi.</text><rect x="98" y="246" width="200" height="12" rx="6" fill="#0f100d" opacity="0.18"/><rect x="98" y="272" width="220" height="38" rx="19" fill="#18733e"/><text x="208" y="297.12" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">Pesan lewat WhatsApp</text><rect x="98" y="322" width="244" height="90" rx="8" fill="#ffffff" stroke="#0f100d" stroke-width="2" stroke-dasharray="8 6"/><text x="220" y="373" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">foto produk andalan</text><rect x="84" y="438" width="272" height="150" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="98" y="466" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">Menu</text><text x="98" y="500" font-size="15" font-weight="500" text-anchor="start" fill="#0f100d">Es Kopi Susu Aren</text><text x="340" y="500" font-size="17" font-weight="700" text-anchor="end" fill="#0f100d">Rp15.000</text><text x="98" y="530" font-size="15" font-weight="500" text-anchor="start" fill="#0f100d">Kopi Tubruk</text><text x="340" y="530" font-size="17" font-weight="700" text-anchor="end" fill="#0f100d">Rp8.000</text><text x="98" y="560" font-size="15" font-weight="500" text-anchor="start" fill="#0f100d">Pisang Goreng Madu</text><text x="340" y="560" font-size="17" font-weight="700" text-anchor="end" fill="#0f100d">Rp12.000</text><rect x="84" y="600" width="272" height="70" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="98" y="628" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">Testimoni x3</text><rect x="84" y="682" width="272" height="100" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="98" y="710" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">Alamat, jam, peta</text><rect x="202" y="790" width="150" height="44" rx="22" fill="#18733e"/><text x="277" y="818.12" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">Pesan via WA</text><path d="M380 812 L430 812" stroke="#0f100d" stroke-width="3"/><text x="438" y="805" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">tombol melayang,</text><text x="438" y="831" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">hanya di HP (md:hidden)</text><rect x="520" y="100" width="620" height="520" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><line x1="520" y1="140" x2="1140" y2="140" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><circle cx="544" cy="120" r="7" fill="#0f100d" opacity="0.25"/><circle cx="566" cy="120" r="7" fill="#0f100d" opacity="0.25"/><circle cx="588" cy="120" r="7" fill="#0f100d" opacity="0.25"/><text x="830" y="655" font-size="24" font-weight="700" text-anchor="middle" fill="#0f100d">Layar lebar (768px ke atas)</text><rect x="536" y="154" width="588" height="44" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="550" y="182" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">Kedai Teras</text><text x="1110" y="182" font-size="16" font-weight="500" text-anchor="end" fill="#0f100d">Menu   Lokasi</text><rect x="536" y="212" width="280" height="200" rx="10" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="550" y="240" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">Kopi susu aren yang</text><text x="550" y="266" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">bikin balik lagi.</text><rect x="550" y="286" width="220" height="12" rx="6" fill="#0f100d" opacity="0.18"/><rect x="550" y="316" width="220" height="38" rx="19" fill="#18733e"/><text x="660" y="341.12" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">Pesan lewat WhatsApp</text><rect x="832" y="212" width="292" height="200" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="2" stroke-dasharray="8 6"/><text x="978" y="318" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">foto produk andalan</text><rect x="536" y="426" width="588" height="52" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="550" y="454" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">Menu dan harga (2 kolom)</text><rect x="536" y="488" width="188" height="46" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="630" y="518" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">testimoni 1</text><rect x="736" y="488" width="188" height="46" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="830" y="518" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">testimoni 2</text><rect x="936" y="488" width="188" height="46" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="1030" y="518" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">testimoni 3</text><rect x="536" y="544" width="280" height="62" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="550" y="572" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">Alamat dan jam</text><rect x="832" y="544" width="292" height="62" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="978" y="582" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">peta Google Maps</text><text x="830" y="710" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">Tanpa prefiks = gaya HP. Kelas md: berlaku mulai 768px:</text><text x="830" y="740" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">pembuka jadi dua kolom, tombol melayang disembunyikan.</text>
