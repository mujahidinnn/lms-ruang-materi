<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Arsitektur server: internet hanya bisa ke sshd port 22 dan caddy port 80 dan 443; caddy meneruskan ke app port 3000 dan app ke db port 5432 lewat jaringan internal; volume caddy_data dan pgdata; backup malam</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="880" fill="#ffffff"/>
<text x="600" y="56" font-size="32" font-weight="800" text-anchor="middle" fill="#0f100d">Satu VPS, tiga container, hanya caddy yang menghadap internet</text><rect x="40" y="170" width="160" height="290" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="120" y="322" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Internet</text><rect x="250" y="90" width="920" height="680" rx="22" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="274" y="130" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d">VPS Ubuntu LTS</text><text x="1146" y="130" font-size="19" font-weight="700" text-anchor="end" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">ufw: hanya 22, 80, 443</text><rect x="300" y="160" width="290" height="100" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="445" y="200" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">sshd :22</text><text x="445" y="236" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">user deploy, hanya kunci</text><line x1="204" y1="210" x2="294" y2="210" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="212" y="196" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">22</text><rect x="280" y="290" width="860" height="330" rx="18" fill="none" stroke="#0f100d" stroke-width="3" stroke-dasharray="12 9"/><text x="304" y="326" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">docker compose  (~/app/compose.yaml)</text><rect x="310" y="350" width="230" height="130" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="425" y="390" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">caddy</text><text x="425" y="426" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">80, 443</text><text x="425" y="456" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">HTTPS otomatis</text><rect x="600" y="350" width="240" height="130" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="720" y="390" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">app</text><text x="720" y="426" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">image sha-...</text><text x="720" y="456" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">127.0.0.1:3000</text><rect x="900" y="350" width="220" height="130" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="1010" y="390" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">db</text><text x="1010" y="426" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">postgres:18</text><text x="1010" y="456" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">tanpa port</text><line x1="204" y1="415" x2="304" y2="415" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="206" y="401" font-size="17" font-weight="800" text-anchor="start" fill="#0f100d">80/443</text><line x1="540" y1="415" x2="594" y2="415" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="840" y1="415" x2="894" y2="415" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="567" y="506" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">app:3000</text><text x="867" y="506" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">db:5432</text><line x1="425" y1="480" x2="425" y2="530" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><rect x="310" y="530" width="230" height="70" rx="35" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="425" y="560" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">caddy_data</text><text x="425" y="586" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">sertifikat TLS</text><line x1="1010" y1="480" x2="1010" y2="530" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><rect x="895" y="530" width="230" height="70" rx="35" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="1010" y="560" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">pgdata</text><text x="1010" y="586" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">/var/lib/postgresql</text><rect x="300" y="650" width="260" height="96" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="430" y="690" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">.env</text><text x="430" y="726" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">chmod 600, tidak di Git</text><rect x="600" y="650" width="520" height="96" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="860" y="690" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">backup.sh  (cron tiap malam)</text><text x="860" y="726" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">pg_dump -&gt; backups/*.sql.gz, simpan 7 hari</text><line x1="1010" y1="604" x2="1010" y2="644" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#ah)"/><text x="600" y="812" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Port yang dipublikasikan Docker melewati ufw. Karena itu app hanya di 127.0.0.1 dan db tanpa port.</text><text x="600" y="846" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Volume bertahan saat container dibuang; deploy hanya mengganti container app.</text>
</svg>
