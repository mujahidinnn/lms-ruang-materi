<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="1200" height="940" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Alur rilis: git push memicu job build yang mendorong image bertag sha ke GHCR, job deploy menjalankan deploy.sh lewat SSH; kalau healthcheck tidak lolos dalam 90 detik, tag lama dikembalikan dan job gagal</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="940" fill="#ffffff"/>
<text x="600" y="56" font-size="34" font-weight="800" text-anchor="middle" fill="#0f100d">Rilis otomatis: dari git push sampai rollback sendiri</text><rect x="40" y="96" width="250" height="130" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="70" cy="126" r="18" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="70" y="134" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">1</text><text x="98" y="136" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">git push</text><text x="60" y="172" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">ke main</text><text x="60" y="198" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">(laptop)</text><rect x="330" y="96" width="250" height="130" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><circle cx="360" cy="126" r="18" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="360" y="134" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">2</text><text x="388" y="136" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">job build</text><text x="350" y="172" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">tag sha-1a2b3c4</text><text x="350" y="198" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">dan latest</text><rect x="620" y="96" width="250" height="130" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><circle cx="650" cy="126" r="18" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="650" y="134" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">3</text><text x="678" y="136" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">GHCR</text><text x="640" y="172" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">ghcr.io/user/</text><text x="640" y="198" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">pengunjung</text><rect x="910" y="96" width="250" height="130" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><circle cx="940" cy="126" r="18" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="940" y="134" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">4</text><text x="968" y="136" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">job deploy</text><text x="930" y="172" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">kunci SSH dari</text><text x="930" y="198" font-size="17" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">Secrets</text><line x1="294" y1="161" x2="324" y2="161" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="584" y1="161" x2="614" y2="161" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="874" y1="161" x2="904" y2="161" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="1035" y1="226" x2="1035" y2="262" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="1035" y1="262" x2="300" y2="262" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="300" y1="262" x2="300" y2="292" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="668" y="290" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">ssh deploy@server app/deploy.sh sha-1a2b3c4</text><rect x="60" y="300" width="480" height="66" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="92" cy="333" r="18" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="92" y="341" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d">a</text><text x="124" y="341" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">sebelumnya = APP_TAG di .env</text><rect x="60" y="390" width="480" height="66" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="92" cy="423" r="18" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="92" y="431" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d">b</text><text x="124" y="431" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">APP_TAG=sha-1a2b3c4 ke .env</text><rect x="60" y="480" width="480" height="66" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="92" cy="513" r="18" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="92" y="521" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d">c</text><text x="124" y="521" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">docker compose pull app</text><rect x="60" y="570" width="480" height="66" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="92" cy="603" r="18" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="92" y="611" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d">d</text><text x="124" y="611" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">up -d --wait --wait-timeout 90</text><line x1="300" y1="366" x2="300" y2="386" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="300" y1="456" x2="300" y2="476" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="300" y1="546" x2="300" y2="566" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><polygon points="820,548 940,603 820,658 700,603" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="820" y="598" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">healthcheck</text><text x="820" y="622" font-size="19" font-weight="800" text-anchor="middle" fill="#0f100d">lolos?</text><line x1="540" y1="603" x2="694" y2="603" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="620" y="300" width="540" height="130" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="644" y="340" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Ya: rilis selesai</text><text x="644" y="374" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">catat "tag lama -&gt; tag baru" di rilis.log</text><text x="644" y="402" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">image prune, job deploy hijau</text><line x1="820" y1="544" x2="820" y2="436" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="834" y="500" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">ya</text><rect x="620" y="700" width="540" height="150" rx="16" fill="#f4b6c2" stroke="#0f100d" stroke-width="4"/><text x="644" y="740" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Tidak: rollback otomatis</text><text x="644" y="774" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">APP_TAG dikembalikan ke tag lama, up -d --wait</text><text x="644" y="802" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">exit 1: job deploy merah</text><text x="644" y="830" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">versi lama tetap melayani pengunjung</text><line x1="820" y1="662" x2="820" y2="694" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="834" y="686" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">tidak</text><rect x="60" y="700" width="480" height="150" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="84" y="740" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Rollback manual</text><text x="84" y="776" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">cat ~/app/rilis.log</text><text x="84" y="804" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">~/app/deploy.sh sha-&lt;tag lama&gt;</text><text x="84" y="834" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d">tag lama masih ada di GHCR</text><text x="600" y="900" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Tag latest hanya penunjuk. Deploy selalu memakai tag sha-..., jadi setiap versi bisa dipanggil lagi.</text>
</svg>
