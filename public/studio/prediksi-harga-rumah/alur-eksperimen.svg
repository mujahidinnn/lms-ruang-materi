<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1110" width="1200" height="1110" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Alur eksperimen: aturan domain, split 80/20, data uji dikunci, cross-validation di data latih untuk memilih model, evaluasi sekali di data uji, simpan dengan joblib, sajikan lewat FastAPI</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="1110" fill="#ffffff"/>
<text x="600" y="58" font-size="38" font-weight="800" text-anchor="middle" fill="#0f100d">Alur eksperimen: data uji dikunci sampai akhir</text><rect x="380" y="96" width="440" height="84" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="600" y="134" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">data/rumah.csv</text><text x="600" y="164" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">420 baris, 73 sel kosong</text><line x1="600" y1="180" x2="600" y2="212" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="300" y="216" width="600" height="84" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="600" y="254" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Aturan domain: harga &lt; 50 juta dibuang</text><text x="600" y="284" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">4 salah ketik → 416 baris</text><line x1="600" y1="300" x2="600" y2="326" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="340" y1="326" x2="950" y2="326" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="340" y1="326" x2="340" y2="368" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="950" y1="326" x2="950" y2="368" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="645" y="356" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">train_test_split 80/20</text><rect x="60" y="372" width="560" height="76" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="340" y="406" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Data latih: 332 rumah</text><text x="340" y="436" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">semua keputusan diambil di sini</text><line x1="340" y1="448" x2="340" y2="474" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="478" width="560" height="84" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="340" y="516" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">5-fold cross-validation</text><text x="340" y="546" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">baseline · linear · random forest · HGB</text><line x1="340" y1="562" x2="340" y2="588" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="592" width="560" height="84" rx="14" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="340" y="630" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Pilih: regresi linear, target log</text><text x="340" y="660" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">MAE CV Rp296 jt (baseline Rp966 jt)</text><line x1="340" y1="676" x2="340" y2="702" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="706" width="560" height="70" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="340" y="737" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">fit ulang di 332 rumah latih</text><text x="340" y="767" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">Pipeline: praproses + model</text><rect x="760" y="372" width="380" height="404" rx="14" fill="#f4b6c2" stroke="#0f100d" stroke-width="4" stroke-dasharray="12 8"/><text x="950" y="418" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Data uji: 84 rumah</text><rect x="922" y="470" width="56" height="44" rx="8" fill="#0f100d"/><path d="M932 470 v-14 a18 18 0 0 1 36 0 v14" fill="none" stroke="#0f100d" stroke-width="7"/><text x="950" y="562" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">DIKUNCI</text><text x="950" y="610" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">tidak dipakai untuk memilih</text><text x="950" y="642" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">model, praproses, atau</text><text x="950" y="674" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">parameter apa pun</text><line x1="340" y1="776" x2="340" y2="812" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="950" y1="776" x2="950" y2="812" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="200" y="816" width="800" height="88" rx="14" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="600" y="856" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Evaluasi SEKALI di data uji</text><text x="600" y="886" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">MAE Rp325 jt · R² 0,84 · 80% rumah meleset ≤ 20%</text><line x1="390" y1="904" x2="390" y2="940" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="200" y="944" width="380" height="84" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="390" y="982" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">joblib.dump</text><text x="390" y="1012" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">model/model.joblib + info.json</text><line x1="580" y1="986" x2="616" y2="986" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="620" y="944" width="380" height="84" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="810" y="982" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">FastAPI</text><text x="810" y="1012" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">POST /prediksi</text><text x="600" y="1076" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Angka uji mirip angka CV (325 vs 296 juta): tanda tidak ada kebocoran.</text>
</svg>
