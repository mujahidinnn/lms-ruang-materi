<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="1200" height="950" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Pipeline praproses: luas diisi median, diambil log, dan diskala; angka lain diisi median dan diskala; kota di-one-hot; total 14 kolom masuk ke regresi linear dengan target log</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="950" fill="#ffffff"/>
<text x="600" y="58" font-size="38" font-weight="800" text-anchor="middle" fill="#0f100d">Pipeline: praproses + model dalam satu objek</text><rect x="40" y="100" width="330" height="110" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="60" y="148" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">luas_tanah</text><text x="60" y="176" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">luas_bangunan</text><line x1="370" y1="155" x2="395" y2="155" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="399" y="120" width="150" height="70" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="474" y="163" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">isi median</text><rect x="585" y="120" width="150" height="70" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="660" y="163" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">log</text><line x1="549" y1="155" x2="581" y2="155" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="771" y="120" width="150" height="70" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="846" y="163" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">skala</text><line x1="735" y1="155" x2="767" y2="155" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="921" y1="155" x2="946" y2="155" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="950" y="120" width="210" height="70" rx="30" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1055" y="163" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">2 kolom</text><rect x="40" y="240" width="330" height="110" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="60" y="274" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">kamar_tidur, kamar_mandi</text><text x="60" y="302" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">jarak_pusat_km</text><text x="60" y="330" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">tahun_dibangun</text><line x1="370" y1="295" x2="488" y2="295" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="492" y="260" width="150" height="70" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="567" y="303" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">isi median</text><rect x="678" y="260" width="150" height="70" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="753" y="303" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">skala</text><line x1="642" y1="295" x2="674" y2="295" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="828" y1="295" x2="946" y2="295" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="950" y="260" width="210" height="70" rx="30" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1055" y="303" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">4 kolom</text><rect x="40" y="380" width="330" height="110" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="60" y="442" font-size="19" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">kota</text><line x1="370" y1="435" x2="581" y2="435" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="585" y="400" width="150" height="70" rx="14" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="660" y="443" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">one-hot</text><line x1="735" y1="435" x2="946" y2="435" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="950" y="400" width="210" height="70" rx="30" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1055" y="443" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">8 kolom</text><text x="1055" y="92" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">ColumnTransformer</text><line x1="1160" y1="155" x2="1180" y2="155" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="1160" y1="295" x2="1180" y2="295" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="1160" y1="435" x2="1180" y2="435" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="1180" y1="155" x2="1180" y2="520" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="1180" y1="520" x2="600" y2="520" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="600" y1="520" x2="600" y2="556" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="250" y="560" width="700" height="80" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="600" y="596" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">2 + 4 + 8 = 14 kolom angka</text><text x="600" y="626" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">satu tabel siap untuk model</text><line x1="600" y1="640" x2="600" y2="676" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="40" y="680" width="1120" height="150" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="3" stroke-dasharray="10 8"/><text x="64" y="714" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">TransformedTargetRegressor</text><rect x="80" y="730" width="320" height="84" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="240" y="768" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">harga → log1p</text><text x="240" y="798" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">dilatih di skala log</text><rect x="440" y="730" width="320" height="84" rx="14" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="600" y="768" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">LinearRegression</text><text x="600" y="798" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">koefisien per kolom</text><line x1="400" y1="772" x2="436" y2="772" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="800" y="730" width="320" height="84" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="960" y="768" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">expm1 → rupiah</text><text x="960" y="798" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">hasil kembali ke rupiah</text><line x1="760" y1="772" x2="796" y2="772" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="600" y="878" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">fit() hanya di data latih: median, rata-rata dan simpangan skala, daftar kota,</text><text x="600" y="912" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">dan koefisien model semuanya dipelajari dari 332 rumah latih, lalu dipakai apa adanya.</text>
</svg>
