<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Urutan pemeriksaan di Pengambil.ambil: cache, robots.txt, jeda, permintaan dengan User-Agent dan timeout, lalu 200 disimpan, 429/5xx/timeout dicoba lagi dengan backoff, dan 4xx lain langsung gagal</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="900" fill="#ffffff"/>
<text x="600" y="50" font-size="36" font-weight="800" text-anchor="middle" fill="#0f100d">Di dalam Pengambil.ambil(url)</text><rect x="40" y="100" width="300" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="190" y="154" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">ambil(url)</text><rect x="420" y="100" width="340" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="590" y="138" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">ada di cache?</text><text x="590" y="168" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">hanya dengan --cache</text><rect x="840" y="100" width="320" height="90" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="1000" y="138" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">baca berkas cache</text><text x="1000" y="168" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">server tidak dihubungi</text><line x1="342" y1="145" x2="412" y2="145" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="762" y1="145" x2="832" y2="145" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="797" y="132" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">ya</text><rect x="420" y="250" width="340" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="590" y="288" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">robots.txt mengizinkan?</text><text x="590" y="318" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">dibaca sekali per situs</text><rect x="840" y="250" width="320" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1000" y="288" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">DilarangRobots</text><text x="1000" y="318" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">crawl berhenti, kode 2</text><line x1="590" y1="192" x2="590" y2="242" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="602" y="224" font-size="18" font-weight="700" text-anchor="start" fill="#0f100d">tidak</text><line x1="762" y1="295" x2="832" y2="295" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="797" y="282" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">tidak</text><rect x="420" y="400" width="340" height="90" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="590" y="438" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">_tunggu_giliran()</text><text x="590" y="468" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">jeda sejak permintaan terakhir</text><rect x="840" y="400" width="320" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1000" y="438" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">GET + User-Agent</text><text x="1000" y="468" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">timeout 10 dtk, connect 5</text><line x1="590" y1="342" x2="590" y2="392" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="602" y="374" font-size="18" font-weight="700" text-anchor="start" fill="#0f100d">ya</text><line x1="762" y1="445" x2="832" y2="445" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="420" y="550" width="340" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="590" y="604" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">jawaban?</text><path d="M1000 492 L1000 595 L768 595" fill="none" stroke="#0f100d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="40" y="720" width="300" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="190" y="758" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">404, 4xx lain</text><text x="190" y="788" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">langsung raise, tanpa retry</text><rect x="420" y="720" width="340" height="90" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="590" y="758" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">429, 5xx, timeout</text><text x="590" y="788" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">tunggu 1, 2 dtk / Retry-After</text><rect x="840" y="720" width="320" height="90" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="1000" y="758" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">200 OK</text><text x="1000" y="788" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">simpan cache, kembalikan HTML</text><path d="M500 642 L190 712" fill="none" stroke="#0f100d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M590 642 L590 712" fill="none" stroke="#0f100d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M680 642 L1000 712" fill="none" stroke="#0f100d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M418 765 L380 765 L380 445 L412 445" fill="none" stroke="#0f100d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="366" y="600" font-size="18" font-weight="700" text-anchor="end" fill="#0f100d">coba lagi</text><text x="366" y="624" font-size="18" font-weight="700" text-anchor="end" fill="#0f100d">maks 3x</text><text x="600" y="860" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Percobaan ketiga tetap gagal: galatnya dilempar, buku itu dicatat sebagai buku_gagal.</text>
</svg>
