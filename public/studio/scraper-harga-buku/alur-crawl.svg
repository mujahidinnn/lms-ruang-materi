<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Alur crawl: halaman katalog memberi 20 URL detail dan URL next; setiap detail di-parse lalu di-upsert berdasarkan UPC, dan riwayat_harga hanya bertambah untuk buku baru atau harga yang berubah</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="600" y="50" font-size="36" font-weight="800" text-anchor="middle" fill="#0f100d">Alur crawl: katalog, detail, simpan</text><rect x="40" y="130" width="260" height="90" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="170" y="168" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">ambil(katalog)</text><text x="170" y="198" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">page-1 ... page-50.html</text><rect x="360" y="130" width="260" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="490" y="168" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">parse_daftar()</text><text x="490" y="198" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">20 URL detail + next</text><rect x="680" y="130" width="220" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="790" y="184" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">next ada?</text><rect x="960" y="130" width="200" height="90" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="1060" y="168" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">selesai</text><text x="1060" y="198" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">log: selesai</text><line x1="302" y1="175" x2="352" y2="175" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="622" y1="175" x2="672" y2="175" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="902" y1="175" x2="952" y2="175" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="930" y="162" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">tidak</text><path d="M790 128 L790 96 L170 96 L170 122" fill="none" stroke="#0f100d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="480" y="88" font-size="18" font-weight="700" text-anchor="middle" fill="#0f100d">ya: halaman berikutnya</text><path d="M490 222 L490 270 L170 270 L170 322" fill="none" stroke="#0f100d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="500" y="256" font-size="18" font-weight="600" text-anchor="start" fill="#0f100d">untuk setiap URL detail (20x)</text><rect x="40" y="330" width="260" height="90" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="170" y="368" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">ambil(detail)</text><text x="170" y="398" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">a-light-in-the-attic...</text><rect x="340" y="330" width="240" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="460" y="368" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">parse_buku()</text><text x="460" y="398" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">upc, judul, harga, ...</text><rect x="620" y="330" width="250" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="745" y="368" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">simpan_buku()</text><text x="745" y="398" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">upsert per UPC</text><rect x="910" y="330" width="250" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1035" y="384" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">baru / harga beda?</text><line x1="302" y1="375" x2="332" y2="375" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="582" y1="375" x2="612" y2="375" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="872" y1="375" x2="902" y2="375" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="960" y="500" width="200" height="90" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="1060" y="538" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">+1 baris</text><text x="1060" y="568" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">riwayat_harga</text><rect x="620" y="500" width="250" height="90" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="745" y="538" font-size="21" font-weight="800" text-anchor="middle" fill="#0f100d">tidak dicatat</text><text x="745" y="568" font-size="17" font-weight="500" text-anchor="middle" fill="#0f100d">harga sama</text><line x1="1060" y1="422" x2="1060" y2="492" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="1072" y="466" font-size="18" font-weight="700" text-anchor="start" fill="#0f100d">ya</text><path d="M935 422 L935 545 L878 545" fill="none" stroke="#0f100d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="947" y="466" font-size="18" font-weight="700" text-anchor="start" fill="#0f100d">tidak</text><rect x="40" y="500" width="540" height="90" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="3" stroke-dasharray="10 8"/><text x="64" y="538" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d">Semua ambil() lewat Pengambil:</text><text x="64" y="570" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">robots.txt, jeda, User-Agent, timeout, retry, cache</text><text x="600" y="648" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Satu detail gagal: dicatat sebagai buku_gagal, crawl lanjut ke buku berikutnya.</text><text x="600" y="684" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Setiap buku disimpan dalam transaksinya sendiri, jadi crawl yang terputus tidak merusak data.</text>
</svg>
