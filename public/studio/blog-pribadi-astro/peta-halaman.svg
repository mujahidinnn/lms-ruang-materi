<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Alur konten blog: Markdown di src/content/blog diperiksa skema Zod, ambilTulisan membuang draf dan mengurutkan, lalu dipakai beranda, halaman tulisan, halaman tag, RSS, dan sitemap</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="760" fill="#ffffff"/>
<text x="600" y="58" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Satu folder Markdown, banyak halaman</text><rect x="40" y="110" width="300" height="250" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="190" y="150" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">src/content/blog</text><rect x="60" y="172" width="260" height="46" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="72" y="201" font-size="15.5" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">halo-dunia.md</text><rect x="60" y="232" width="260" height="46" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="72" y="261" font-size="15.5" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">css-grid-untuk-pemula.md</text><rect x="60" y="292" width="260" height="46" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3" stroke-dasharray="8 6"/><text x="72" y="321" font-size="15.5" font-weight="600" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">rencana-belajar-git.md</text><text x="190" y="390" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">draft: true (garis putus)</text><line x1="342" y1="235" x2="392" y2="235" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="398" y="140" width="300" height="190" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="548" y="182" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Skema Zod</text><text x="548" y="222" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">title, date,</text><text x="548" y="252" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">description,</text><text x="548" y="282" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">tags, draft</text><text x="548" y="372" font-size="19" font-weight="700" text-anchor="middle" fill="#0f100d">salah ketik = build gagal</text><line x1="700" y1="235" x2="750" y2="235" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="756" y="140" width="400" height="190" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="956" y="182" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">ambilTulisan()</text><text x="956" y="228" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">buang draf (kecuali dev)</text><text x="956" y="262" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">urutkan: terbaru di atas</text><line x1="956" y1="332" x2="956" y2="420" stroke="#0f100d" stroke-width="5" stroke-linecap="round"/><line x1="150" y1="420" x2="1050" y2="420" stroke="#0f100d" stroke-width="5" stroke-linecap="round"/><line x1="145" y1="420" x2="145" y2="462" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="40" y="468" width="210" height="160" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="145" y="512" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/</text><text x="145" y="552" font-size="16" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">index.astro</text><text x="145" y="592" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">daftar tulisan</text><line x1="371" y1="420" x2="371" y2="462" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="266" y="468" width="210" height="160" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="371" y="512" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/blog/[id]/</text><text x="371" y="552" font-size="16" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">blog/[id].astro</text><text x="371" y="592" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">1 halaman per tulisan</text><line x1="597" y1="420" x2="597" y2="462" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="492" y="468" width="210" height="160" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="597" y="512" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/tag/[tag]/</text><text x="597" y="552" font-size="16" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">tag/[tag].astro</text><text x="597" y="592" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">1 halaman per tag</text><line x1="823" y1="420" x2="823" y2="462" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="718" y="468" width="210" height="160" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="823" y="512" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/rss.xml</text><text x="823" y="552" font-size="16" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">rss.xml.ts</text><text x="823" y="592" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">feed RSS</text><line x1="1049" y1="420" x2="1049" y2="462" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 8"/><rect x="944" y="468" width="210" height="160" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4" stroke-dasharray="10 8"/><text x="1049" y="512" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/sitemap-*.xml</text><text x="1049" y="552" font-size="16" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">@astrojs/sitemap</text><text x="1049" y="592" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d">semua halaman</text><text x="600" y="682" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Berkas bernama [kurung siku] memakai getStaticPaths(): satu berkas .astro, banyak halaman.</text><text x="600" y="718" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Sitemap (garis putus) dibuat dari halaman hasil build, jadi draf otomatis tidak ikut.</text>
</svg>
