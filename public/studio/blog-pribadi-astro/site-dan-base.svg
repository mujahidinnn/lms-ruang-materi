<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" width="1200" height="710" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Alamat GitHub Pages terdiri dari site (domain) dan base (nama repositori). Tautan tanpa base berakhir 404, tautan lewat url() terbuka</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="710" fill="#ffffff"/>
<text x="600" y="58" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">site + base = alamat blogmu</text><rect x="60" y="120" width="470" height="80" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="295" y="170" font-size="24" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">https://USERNAME.github.io</text><rect x="530" y="120" width="250" height="80" rx="14" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="655" y="170" font-size="24" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/blog-astro</text><rect x="780" y="120" width="360" height="80" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="960" y="170" font-size="24" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/blog/halo-dunia/</text><text x="295" y="240" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">site</text><text x="295" y="272" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">domain GitHub Pages</text><text x="655" y="240" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">base</text><text x="655" y="272" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">= nama repositori</text><text x="960" y="240" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">halaman</text><text x="960" y="272" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">dari src/pages</text><rect x="60" y="330" width="520" height="230" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="320" y="372" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Tautan ditulis biasa</text><text x="320" y="420" font-size="22" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">href="/tentang/"</text><line x1="320" y1="440" x2="320" y2="478" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="320" y="512" font-size="19" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">USERNAME.github.io/tentang/</text><text x="320" y="546" font-size="22" font-weight="800" text-anchor="middle" fill="#b42318">404: base hilang</text><rect x="620" y="330" width="520" height="230" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="880" y="372" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Tautan lewat url()</text><text x="880" y="420" font-size="22" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">href={url('/tentang/')}</text><line x1="880" y1="440" x2="880" y2="478" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="880" y="512" font-size="19" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">…github.io/blog-astro/tentang/</text><text x="880" y="546" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">terbuka</text><text x="600" y="606" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">CSS, JavaScript, dan gambar hasil build otomatis diberi base oleh Astro.</text><text x="600" y="640" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Tautan yang kamu tulis sendiri tidak, jadi selalu lewat url().</text><text x="600" y="674" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Repositori bernama USERNAME.github.io atau domain sendiri? base tidak diperlukan.</text>
</svg>
