<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Perbandingan: tanpa skrip inline di head layar sempat tergambar terang lalu berganti gelap; dengan skrip inline data-tema dipasang sebelum layar digambar</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="600" y="58" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Kenapa tema bisa berkedip putih</text><text x="40" y="122" font-size="24" font-weight="800" text-anchor="start" fill="#0f100d">Tanpa skrip di head</text><rect x="40" y="140" width="200" height="96" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="140" y="182" font-size="20" font-weight="700" text-anchor="middle" fill="#0f100d">HTML + CSS</text><text x="140" y="210" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">dimuat</text><line x1="244" y1="188" x2="270" y2="188" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="276" y="140" width="210" height="96" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="381" y="182" font-size="20" font-weight="700" text-anchor="middle" fill="#0f100d">Layar digambar</text><text x="381" y="210" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">TERANG</text><line x1="490" y1="188" x2="516" y2="188" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="522" y="140" width="210" height="96" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="627" y="182" font-size="20" font-weight="700" text-anchor="middle" fill="#0f100d">JS di akhir</text><text x="627" y="210" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">halaman jalan</text><line x1="736" y1="188" x2="762" y2="188" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="768" y="140" width="180" height="96" rx="14" fill="#0f100d" stroke="#0f100d" stroke-width="3"/><text x="858" y="182" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">Ganti ke</text><text x="858" y="210" font-size="20" font-weight="500" text-anchor="middle" fill="#ffffff">gelap</text><text x="1160" y="198" font-size="24" font-weight="800" text-anchor="end" fill="#b42318">KEDIP</text><text x="40" y="352" font-size="24" font-weight="800" text-anchor="start" fill="#0f100d">Dengan &lt;script is:inline&gt; di &lt;head&gt;</text><rect x="40" y="370" width="230" height="96" rx="14" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="155" y="412" font-size="20" font-weight="700" text-anchor="middle" fill="#0f100d">Skrip kecil</text><text x="155" y="440" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">baca localStorage</text><line x1="274" y1="418" x2="300" y2="418" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="306" y="370" width="220" height="96" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="416" y="412" font-size="20" font-weight="700" text-anchor="middle" fill="#0f100d">&lt;html data-tema=</text><text x="416" y="440" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">"gelap"&gt;</text><line x1="530" y1="418" x2="556" y2="418" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="562" y="370" width="230" height="96" rx="14" fill="#0f100d" stroke="#0f100d" stroke-width="3"/><text x="677" y="412" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">Layar langsung</text><text x="677" y="440" font-size="20" font-weight="500" text-anchor="middle" fill="#ffffff">digambar GELAP</text><text x="1160" y="428" font-size="24" font-weight="800" text-anchor="end" fill="#0f100d">tanpa kedip</text><rect x="40" y="540" width="1120" height="150" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="64" y="582" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Urutan pilihan tema:</text><text x="64" y="620" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">1. tersimpan di localStorage ('tema')   2. kalau belum ada: prefers-color-scheme sistem</text><text x="64" y="656" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">Tombol tema (skrip biasa, boleh berjalan belakangan) hanya membalik dan menyimpan pilihan.</text>
</svg>
