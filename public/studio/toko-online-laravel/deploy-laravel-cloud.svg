<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Deploy Laravel Cloud: GitHub memicu build, app tersambung ke Laravel MySQL dan bucket object storage, pembeli datang lewat HTTPS</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="860" fill="#ffffff"/>
<text x="600" y="62" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Toko Sore di Laravel Cloud</text><rect x="50" y="110" width="280" height="130" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="190" y="150" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">GitHub</text><text x="190" y="186" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">git push ke main</text><rect x="410" y="110" width="380" height="130" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="600" y="150" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Build</text><text x="600" y="186" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">composer, npm run build,</text><text x="600" y="216" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">artisan optimize</text><line x1="332" y1="175" x2="404" y2="175" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="600" y1="242" x2="600" y2="300" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="616" y="280" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">deploy: migrate --force</text><rect x="330" y="306" width="540" height="170" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="600" y="350" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">App (Flex, scale to zero)</text><text x="600" y="386" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">PHP 8.5, Laravel 13</text><text x="600" y="418" font-size="22" font-weight="700" text-anchor="middle" fill="#0f100d">disk aplikasi TIDAK permanen</text><text x="600" y="450" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">region Singapore</text><rect x="40" y="560" width="300" height="130" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="190" y="600" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Laravel MySQL</text><text x="190" y="636" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">DB_* diisi otomatis</text><rect x="860" y="560" width="300" height="130" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="1010" y="600" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Bucket (R2)</text><text x="1010" y="636" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">default disk, publik</text><text x="1010" y="666" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">foto produk</text><line x1="420" y1="478" x2="260" y2="552" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="780" y1="478" x2="940" y2="552" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="860" y="110" width="300" height="130" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1010" y="150" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Pembeli</text><text x="1010" y="186" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">https://NAMA.laravel.cloud</text><line x1="1010" y1="242" x2="872" y2="330" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="1000" y="300" font-size="22" font-weight="700" text-anchor="start" fill="#0f100d">HTTPS</text><text x="1010" y="728" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">browser membuka foto</text><text x="1010" y="756" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">langsung dari URL bucket</text><text x="600" y="820" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d">Kode tetap sama: store('products') dan Storage::url() mengikuti FILESYSTEM_DISK.</text>
</svg>
