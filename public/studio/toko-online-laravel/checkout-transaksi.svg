<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Urutan checkout: begin, kunci baris produk, buat order, cek dan kurangi stok tiap item, isi total, commit; stok kurang memicu rollback, pembeli kedua menunggu kunci</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="740" fill="#ffffff"/>
<text x="600" y="62" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Checkout dalam satu transaksi</text><rect x="60" y="110" width="700" height="72" rx="14" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="84" y="142" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">BEGIN</text><text x="84" y="170" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">DB::transaction(function () { ... })</text><line x1="410" y1="184" x2="410" y2="198" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="202" width="700" height="72" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="84" y="234" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">SELECT ... FOR UPDATE</text><text x="84" y="262" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">lockForUpdate(): baris produk dikunci</text><line x1="410" y1="276" x2="410" y2="290" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="294" width="700" height="72" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="84" y="326" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">INSERT orders</text><text x="84" y="354" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">total sementara 0</text><line x1="410" y1="368" x2="410" y2="382" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="386" width="700" height="72" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="84" y="418" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">untuk tiap item:</text><text x="84" y="446" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">stok cukup? decrement + INSERT order_items</text><line x1="410" y1="460" x2="410" y2="474" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="478" width="700" height="72" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="84" y="510" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">UPDATE orders SET total</text><text x="84" y="538" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">jumlah dari harga x kuantitas</text><line x1="410" y1="552" x2="410" y2="566" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="60" y="570" width="700" height="72" rx="14" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="84" y="602" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">COMMIT</text><text x="84" y="630" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">kunci dilepas, lalu keranjang dikosongkan</text><rect x="820" y="380" width="330" height="170" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="985" y="420" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Stok kurang?</text><text x="985" y="456" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">throw ValidationException</text><text x="985" y="490" font-size="22" font-weight="700" text-anchor="middle" fill="#0f100d">ROLLBACK semua</text><text x="985" y="522" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">stok kembali utuh</text><line x1="762" y1="412" x2="814" y2="440" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#ah)"/><rect x="820" y="120" width="330" height="200" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="985" y="160" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Pembeli kedua</text><text x="985" y="196" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">membeli produk yang sama</text><text x="985" y="226" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">di saat bersamaan:</text><text x="985" y="256" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">MENUNGGU sampai selesai,</text><text x="985" y="286" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">lalu membaca stok terbaru</text><line x1="814" y1="220" x2="764" y2="236" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#ah)"/><text x="600" y="700" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Harga diambil dari tabel products di dalam transaksi, bukan dari form atau session.</text>
</svg>
