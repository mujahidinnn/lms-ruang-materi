<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 910" width="1200" height="910" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Topologi retry: pesan yang gagal masuk antrean retry 1 detik, 5 detik, lalu 25 detik yang mengembalikannya ke antrean utama, dan setelah gagal keempat masuk DLQ</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="910" fill="#ffffff"/>
<text x="600" y="62" font-size="32" font-weight="800" text-anchor="middle" fill="#0f100d">Retry dengan backoff, lalu DLQ: perjalanan pesan yang selalu gagal</text><rect x="60" y="110" width="400" height="76" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="260" y="144" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">antrean inventory</text><text x="260" y="172" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">percobaan 1: handler gagal</text><rect x="700" y="180" width="440" height="76" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="920" y="214" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">inventory.retry.1000</text><text x="920" y="242" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">TTL 1 detik</text><line x1="464" y1="148" x2="692" y2="210" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="490" y="210" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">x-attempt 1</text><line x1="696" y1="236" x2="468" y2="270" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#ah)"/><text x="620" y="276" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">TTL habis</text><rect x="60" y="250" width="400" height="76" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="260" y="284" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">antrean inventory</text><text x="260" y="312" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">percobaan 2: handler gagal</text><rect x="700" y="320" width="440" height="76" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="920" y="354" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">inventory.retry.5000</text><text x="920" y="382" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">TTL 5 detik</text><line x1="464" y1="288" x2="692" y2="350" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="490" y="350" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">x-attempt 2</text><line x1="696" y1="376" x2="468" y2="410" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#ah)"/><text x="620" y="416" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">TTL habis</text><rect x="60" y="390" width="400" height="76" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="260" y="424" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">antrean inventory</text><text x="260" y="452" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">percobaan 3: handler gagal</text><rect x="700" y="460" width="440" height="76" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="920" y="494" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">inventory.retry.25000</text><text x="920" y="522" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">TTL 25 detik</text><line x1="464" y1="428" x2="692" y2="490" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="490" y="490" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">x-attempt 3</text><line x1="696" y1="516" x2="468" y2="550" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#ah)"/><text x="620" y="556" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">TTL habis</text><rect x="60" y="530" width="400" height="76" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="260" y="564" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">antrean inventory</text><text x="260" y="592" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">percobaan 4: handler gagal</text><rect x="700" y="600" width="440" height="76" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="920" y="634" font-size="20" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">inventory.dlq</text><text x="920" y="662" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">x-attempt = 4, x-last-error</text><line x1="464" y1="568" x2="692" y2="630" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="520" y="640" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">gagal ke-4 atau</text><text x="520" y="664" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d">PermanentError</text><rect x="40" y="720" width="1120" height="110" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="64" y="760" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Waktu total sebelum menyerah: 1 + 5 + 25 = sekitar 31 detik.</text><text x="64" y="796" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">Satu antrean per jeda, karena RabbitMQ hanya membuang pesan kedaluwarsa dari kepala antrean.</text><text x="600" y="876" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Handler dipilih dari type di amplop: setelah retry, routing key berubah jadi nama antrean.</text>
</svg>
