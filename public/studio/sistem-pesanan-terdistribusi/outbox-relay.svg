<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Transactional outbox: pesanan dan baris outbox ditulis dalam satu transaksi, lalu relay membaca dengan SKIP LOCKED, menerbitkan ke RabbitMQ, menunggu konfirmasi, dan menandai baris</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="760" fill="#ffffff"/>
<text x="600" y="62" font-size="34" font-weight="800" text-anchor="middle" fill="#0f100d">Transactional outbox: data dan pesan dalam satu transaksi</text><rect x="40" y="110" width="520" height="330" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="300" y="150" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Satu transaksi di order_db</text><rect x="70" y="175" width="460" height="60" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="300" y="213" font-size="21" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">BEGIN</text><rect x="70" y="250" width="460" height="60" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="300" y="288" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">INSERT INTO orders ...</text><rect x="70" y="325" width="460" height="60" rx="12" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="300" y="363" font-size="21" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">INSERT INTO outbox ...</text><text x="300" y="420" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">COMMIT: keduanya ada, atau tidak sama sekali</text><rect x="660" y="110" width="500" height="330" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="910" y="150" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Relay (loop terpisah)</text><text x="690" y="200" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">1</text><text x="722" y="200" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">SELECT ... FOR UPDATE</text><text x="690" y="238" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace"></text><text x="722" y="238" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">SKIP LOCKED</text><text x="690" y="276" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">2</text><text x="722" y="276" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">publish ke exchange</text><text x="690" y="314" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">3</text><text x="722" y="314" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">waitForConfirms()</text><text x="690" y="352" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">4</text><text x="722" y="352" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">UPDATE outbox</text><text x="690" y="390" font-size="20" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace"></text><text x="722" y="390" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">SET published_at = now()</text><line x1="564" y1="290" x2="652" y2="290" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="608" y="278" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">baca</text><rect x="660" y="520" width="500" height="100" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="910" y="560" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">RabbitMQ</text><text x="910" y="596" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">menyimpan pesan, lalu konfirmasi</text><line x1="860" y1="446" x2="860" y2="512" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="960" y1="512" x2="960" y2="446" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#ah)"/><text x="1000" y="486" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">confirm</text><rect x="40" y="500" width="580" height="160" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="64" y="540" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Kalau proses mati di tengah jalan:</text><text x="64" y="576" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">sebelum COMMIT: pesanan dan pesan sama-sama batal</text><text x="64" y="608" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">setelah publish, sebelum UPDATE: pesan terbit lagi</text><text x="64" y="640" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">nanti, jadi konsumen wajib idempoten</text><text x="600" y="720" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Pesan bisa terkirim lebih dari sekali, tetapi tidak pernah hilang (at-least-once).</text>
</svg>
