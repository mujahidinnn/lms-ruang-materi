<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Peta konteks sistem pesanan: layanan Order mengorkestrasi Inventory, Payment, dan Notification lewat exchange RabbitMQ, dengan perintah dan event yang didengar serta diterbitkan tiap layanan</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="900" fill="#ffffff"/>
<text x="600" y="62" font-size="34" font-weight="800" text-anchor="middle" fill="#0f100d">Peta konteks: empat layanan, satu broker, database masing-masing</text><rect x="40" y="96" width="300" height="100" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="190" y="136" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Pembeli</text><text x="190" y="172" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">POST /orders</text><line x1="190" y1="198" x2="190" y2="236" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="206" y="224" font-size="19" font-weight="500" text-anchor="start" fill="#0f100d">Idempotency-Key</text><rect x="40" y="240" width="320" height="430" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="200" y="282" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">Order</text><text x="200" y="310" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">orkestrator saga</text><text x="62" y="352" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">mengirim perintah</text><text x="62" y="378" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">inventory.reserve</text><text x="62" y="404" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">inventory.release</text><text x="62" y="430" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">payment.charge</text><text x="62" y="456" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">payment.refund</text><text x="62" y="500" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">menerbitkan</text><text x="62" y="526" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">order.confirmed</text><text x="62" y="552" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">order.cancelled</text><rect x="70" y="590" width="260" height="56" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="200" y="626" font-size="20" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">order_db</text><rect x="450" y="240" width="300" height="430" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="600" y="282" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">RabbitMQ</text><text x="600" y="312" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d">exchange topic flashsale</text><text x="600" y="380" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">routing key =</text><text x="600" y="408" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">type.vN</text><text x="600" y="470" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">satu antrean per</text><text x="600" y="498" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">layanan, plus retry</text><text x="600" y="526" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">dan DLQ</text><line x1="364" y1="400" x2="442" y2="400" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="442" y1="470" x2="364" y2="470" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="850" y="100" width="310" height="270" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1005" y="136" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Inventory</text><text x="870" y="170" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">mendengar</text><text x="870" y="196" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">inventory.reserve</text><text x="870" y="222" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">inventory.release</text><text x="870" y="248" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">order.confirmed</text><text x="870" y="278" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">menerbitkan</text><text x="870" y="304" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">stock.reserved</text><text x="870" y="330" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">stock.rejected</text><text x="870" y="356" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">stock.released</text><text x="1140" y="136" font-size="17" font-weight="700" text-anchor="end" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace"></text><line x1="758" y1="235" x2="842" y2="235" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="842" y1="265" x2="758" y2="265" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="850" y="390" width="310" height="240" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1005" y="426" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Payment</text><text x="870" y="460" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">mendengar</text><text x="870" y="486" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">payment.charge</text><text x="870" y="512" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">payment.refund</text><text x="870" y="542" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">menerbitkan</text><text x="870" y="568" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">payment.succeeded</text><text x="870" y="594" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">payment.failed</text><text x="870" y="620" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">payment.refunded</text><text x="1140" y="426" font-size="17" font-weight="700" text-anchor="end" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace"></text><line x1="758" y1="510" x2="842" y2="510" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="842" y1="540" x2="758" y2="540" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="850" y="650" width="310" height="140" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1005" y="686" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Notification</text><text x="870" y="720" font-size="19" font-weight="800" text-anchor="start" fill="#0f100d">mendengar</text><text x="870" y="746" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">order.confirmed</text><text x="870" y="772" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">order.cancelled</text><text x="1140" y="686" font-size="17" font-weight="700" text-anchor="end" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace"></text><line x1="758" y1="720" x2="842" y2="720" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="600" y="830" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Tiap layanan punya database sendiri dan tidak pernah membaca tabel layanan lain.</text><text x="600" y="864" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Perintah boleh ditolak (stock.rejected). Event adalah fakta yang sudah terjadi.</text>
</svg>
