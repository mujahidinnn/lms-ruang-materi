<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Mesin status pesanan: PENDING, AWAITING_PAYMENT, CONFIRMED, COMPENSATING, CANCELLED, dengan event pemicu dan perintah yang ditulis ke outbox di tiap transisi</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="860" fill="#ffffff"/>
<text x="600" y="62" font-size="34" font-weight="800" text-anchor="middle" fill="#0f100d">Mesin status pesanan dan perintah yang dikirim tiap transisi</text><rect x="60" y="130" width="240" height="70" rx="35" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="180" y="174" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">PENDING</text><rect x="420" y="130" width="360" height="70" rx="35" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="600" y="174" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">AWAITING_PAYMENT</text><rect x="895" y="130" width="250" height="70" rx="35" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="1020" y="174" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">CONFIRMED</text><rect x="440" y="420" width="320" height="70" rx="35" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="600" y="464" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">COMPENSATING</text><rect x="55" y="420" width="250" height="70" rx="35" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="180" y="464" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">CANCELLED</text><line x1="304" y1="165" x2="412" y2="165" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="358" y="240" font-size="19" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">stock.reserved</text><text x="358" y="266" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">-&gt; payment.charge</text><line x1="784" y1="165" x2="888" y2="165" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="836" y="240" font-size="19" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">payment.succeeded</text><text x="836" y="266" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">-&gt; order.confirmed</text><line x1="600" y1="204" x2="600" y2="412" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="730" y="300" font-size="19" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">payment.failed</text><text x="730" y="326" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">atau tenggat lewat</text><text x="730" y="352" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">-&gt; inventory.release</text><line x1="432" y1="455" x2="312" y2="455" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="372" y="530" font-size="19" font-weight="700" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">stock.released</text><text x="372" y="556" font-size="18" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">-&gt; order.cancelled</text><line x1="180" y1="204" x2="180" y2="412" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="196" y="300" font-size="19" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">stock.rejected</text><text x="196" y="326" font-size="18" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">-&gt; order.cancelled</text><rect x="700" y="510" width="460" height="130" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="720" y="546" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Pembayaran telat</text><text x="720" y="580" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">payment.succeeded saat pesanan</text><text x="720" y="610" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">sudah menyerah: kirim payment.refund</text><rect x="40" y="670" width="1120" height="110" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="70" y="710" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Guarded transition: semua perubahan lewat satu fungsi</text><text x="70" y="748" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">UPDATE orders SET status = $to WHERE id = $id AND status = $from</text><text x="600" y="826" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Event ganda atau basi tidak cocok dengan status asal, jadi tidak memundurkan saga.</text>
</svg>
