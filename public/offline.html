<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offline · Ruang Materi</title>
<!-- Plain HTML on purpose: the service worker serves it when offline, when
     no Next.js chunks may be cached. Colors mirror globals.css. -->
<style>
  :root { color-scheme: dark; --bg: #09090b; --fg: #fafafa; --muted: #a1a1aa; --line: #3f3f46; --accent: #00d3bd; --warm: #ff8904; }
  @media (prefers-color-scheme: light) {
    :root { color-scheme: light; --bg: #fafafa; --fg: #18181b; --muted: #52525b; --line: #d4d4d8; --accent: #009689; --warm: #f54900; }
  }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 1.5rem; margin: 24px 0 8px; letter-spacing: -0.01em; }
  p { color: var(--muted); max-width: 24rem; margin: 0 auto; }
  a { color: var(--accent); display: inline-block; margin-top: 24px; padding: 10px 4px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 96 96" width="112" height="112" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M60 9H24A15 15 0 0 0 9 24v48a15 15 0 0 0 15 15h48a15 15 0 0 0 15-15V36" stroke="var(--line)" stroke-width="6"/>
    <circle cx="82" cy="15" r="5" fill="var(--warm)"/>
    <rect x="25" y="33" width="46" height="32" rx="6" stroke="var(--line)" stroke-width="4"/>
    <path d="M34 45h20M34 53h12" stroke="var(--line)" stroke-width="4"/>
    <path d="M22 74L74 22" stroke="var(--muted)" stroke-width="5"/>
  </svg>
  <h1>Kamu sedang offline</h1>
  <p>Halaman ini belum tersimpan di perangkatmu. Materi dan roadmap yang pernah kamu buka tetap bisa dibaca.</p>
  <a href="/">Ke beranda</a>
</main>
</body>
</html>
