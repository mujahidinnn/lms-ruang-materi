<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 885" width="1200" height="885" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Empat langkah DHCP: Discover, Offer, Request, Acknowledge antara klien dan server</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="885" fill="#ffffff"/>
<text x="600" y="62" font-size="42" font-weight="800" text-anchor="middle" fill="#0f100d">Proses DHCP: DORA</text><rect x="130" y="90" width="260" height="70" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="260" y="135" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">Klien (laptop)</text><rect x="810" y="90" width="260" height="70" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="940" y="135" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">Server DHCP</text><line x1="260" y1="160" x2="260" y2="720" stroke="#0f100d" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 14"/><line x1="940" y1="160" x2="940" y2="720" stroke="#0f100d" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 14"/><line x1="268" y1="265" x2="928" y2="265" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="600" cy="213" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="600" y="223" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">1</text><text x="640" y="223" font-size="30" font-weight="800" text-anchor="start" fill="#0f100d">Discover</text><text x="600" y="301" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Ada server DHCP di sini? (broadcast)</text><line x1="932" y1="395" x2="272" y2="395" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="600" cy="343" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="600" y="353" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">2</text><text x="640" y="353" font-size="30" font-weight="800" text-anchor="start" fill="#0f100d">Offer</text><text x="600" y="431" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Pakai 192.168.1.50, sewa 24 jam</text><line x1="268" y1="525" x2="928" y2="525" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="600" cy="473" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="600" y="483" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">3</text><text x="640" y="483" font-size="30" font-weight="800" text-anchor="start" fill="#0f100d">Request</text><text x="600" y="561" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Baik, saya ambil 192.168.1.50</text><line x1="932" y1="655" x2="272" y2="655" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><circle cx="600" cy="603" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="600" y="613" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">4</text><text x="640" y="613" font-size="30" font-weight="800" text-anchor="start" fill="#0f100d">Acknowledge</text><text x="600" y="691" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Disetujui. Alamat sudah milikmu</text><text x="600" y="775" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">DORA = Discover, Offer, Request, Acknowledge.</text><text x="600" y="813" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Pesan memakai UDP: klien di port 68, server di port 67.</text><text x="600" y="847" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Discover berupa broadcast karena klien belum punya alamat IP.</text>
</svg>
