<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Konektor RJ45 dilihat dari sisi kontak, dengan nomor pin 1 sampai 8 dan fungsinya</title>
<defs><pattern id="s-oranye" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="28" height="28" fill="#ffffff"/><rect width="14" height="28" fill="#f0861a"/></pattern><pattern id="s-hijau" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="28" height="28" fill="#ffffff"/><rect width="14" height="28" fill="#2e9e4f"/></pattern><pattern id="s-biru" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="28" height="28" fill="#ffffff"/><rect width="14" height="28" fill="#2a6fdb"/></pattern><pattern id="s-cokelat" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="28" height="28" fill="#ffffff"/><rect width="14" height="28" fill="#8b5a2b"/></pattern></defs>
<rect width="1200" height="730" fill="#ffffff"/>
<text x="600" y="70" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Konektor RJ45 dan fungsi tiap pin</text><rect x="70" y="130" width="440" height="300" rx="24" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><rect x="120" y="150" width="340" height="120" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><rect x="138" y="170" width="18" height="80" rx="4" fill="#e9c46a" stroke="#0f100d" stroke-width="3"/><text x="147" y="310" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">1</text><rect x="180" y="170" width="18" height="80" rx="4" fill="#e9c46a" stroke="#0f100d" stroke-width="3"/><text x="189" y="310" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">2</text><rect x="222" y="170" width="18" height="80" rx="4" fill="#e9c46a" stroke="#0f100d" stroke-width="3"/><text x="231" y="310" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">3</text><rect x="264" y="170" width="18" height="80" rx="4" fill="#e9c46a" stroke="#0f100d" stroke-width="3"/><text x="273" y="310" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">4</text><rect x="306" y="170" width="18" height="80" rx="4" fill="#e9c46a" stroke="#0f100d" stroke-width="3"/><text x="315" y="310" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">5</text><rect x="348" y="170" width="18" height="80" rx="4" fill="#e9c46a" stroke="#0f100d" stroke-width="3"/><text x="357" y="310" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">6</text><rect x="390" y="170" width="18" height="80" rx="4" fill="#e9c46a" stroke="#0f100d" stroke-width="3"/><text x="399" y="310" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">7</text><rect x="432" y="170" width="18" height="80" rx="4" fill="#e9c46a" stroke="#0f100d" stroke-width="3"/><text x="441" y="310" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">8</text><text x="140" y="360" font-size="26" font-weight="600" text-anchor="start" fill="#0f100d">pin 1</text><text x="460" y="360" font-size="26" font-weight="600" text-anchor="end" fill="#0f100d">pin 8</text><text x="290" y="465" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Kontak emas menghadap kamu,</text><text x="290" y="497" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">klip di sisi yang menjauh.</text><text x="620" y="150" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d">Pin</text><text x="720" y="150" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d">Fungsi 10/100</text><text x="980" y="150" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d">T568B</text><text x="630" y="195" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d">1</text><text x="720" y="195" font-size="26" font-weight="500" text-anchor="start" fill="#0f100d">TX+</text><rect x="960" y="169" width="44" height="34" rx="8" fill="url(#s-oranye)" stroke="#0f100d" stroke-width="3"/><text x="1016" y="195" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">putih-oranye</text><text x="630" y="251" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d">2</text><text x="720" y="251" font-size="26" font-weight="500" text-anchor="start" fill="#0f100d">TX-</text><rect x="960" y="225" width="44" height="34" rx="8" fill="#f0861a" stroke="#0f100d" stroke-width="3"/><text x="1016" y="251" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">oranye</text><text x="630" y="307" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d">3</text><text x="720" y="307" font-size="26" font-weight="500" text-anchor="start" fill="#0f100d">RX+</text><rect x="960" y="281" width="44" height="34" rx="8" fill="url(#s-hijau)" stroke="#0f100d" stroke-width="3"/><text x="1016" y="307" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">putih-hijau</text><text x="630" y="363" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d">4</text><text x="720" y="363" font-size="26" font-weight="500" text-anchor="start" fill="#0f100d">tak dipakai</text><rect x="960" y="337" width="44" height="34" rx="8" fill="#2a6fdb" stroke="#0f100d" stroke-width="3"/><text x="1016" y="363" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">biru</text><text x="630" y="419" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d">5</text><text x="720" y="419" font-size="26" font-weight="500" text-anchor="start" fill="#0f100d">tak dipakai</text><rect x="960" y="393" width="44" height="34" rx="8" fill="url(#s-biru)" stroke="#0f100d" stroke-width="3"/><text x="1016" y="419" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">putih-biru</text><text x="630" y="475" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d">6</text><text x="720" y="475" font-size="26" font-weight="500" text-anchor="start" fill="#0f100d">RX-</text><rect x="960" y="449" width="44" height="34" rx="8" fill="#2e9e4f" stroke="#0f100d" stroke-width="3"/><text x="1016" y="475" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">hijau</text><text x="630" y="531" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d">7</text><text x="720" y="531" font-size="26" font-weight="500" text-anchor="start" fill="#0f100d">tak dipakai</text><rect x="960" y="505" width="44" height="34" rx="8" fill="url(#s-cokelat)" stroke="#0f100d" stroke-width="3"/><text x="1016" y="531" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">putih-cokelat</text><text x="630" y="587" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d">8</text><text x="720" y="587" font-size="26" font-weight="500" text-anchor="start" fill="#0f100d">tak dipakai</text><rect x="960" y="561" width="44" height="34" rx="8" fill="#8b5a2b" stroke="#0f100d" stroke-width="3"/><text x="1016" y="587" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">cokelat</text><text x="600" y="690" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Pada 10/100 Mbps hanya pin 1, 2, 3, 6 yang membawa data. Gigabit memakai keempat pasang.</text>
</svg>
