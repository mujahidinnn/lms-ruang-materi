0" text-anchor="middle" fill="#0f100d">8</text><text x="600" y="595" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Pin sama ke pin sama. Untuk perangkat yang berbeda jenis, misalnya PC ke switch.</text><text x="60" y="710" font-size="34" font-weight="800" text-anchor="start" fill="#0f100d">Crossover</text><text x="300" y="755" font-size="26" font-weight="600" text-anchor="middle" fill="#0f100d">Ujung A: T568A</text><text x="900" y="755" font-size="26" font-weight="600" text-anchor="middle" fill="#0f100d">Ujung B: T568B</text><line x1="322" y1="810" x2="878" y2="914" stroke="#b5d36f" stroke-width="9" stroke-linecap="round"/><line x1="322" y1="862" x2="878" y2="1070" stroke="#b5d36f" stroke-width="9" stroke-linecap="round"/><line x1="322" y1="914" x2="878" y2="810" stroke="#b5d36f" stroke-width="9" stroke-linecap="round"/><line x1="322" y1="966" x2="878" y2="966" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="322" y1="1018" x2="878" y2="1018" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="322" y1="1070" x2="878" y2="862" stroke="#b5d36f" stroke-width="9" stroke-linecap="round"/><line x1="322" y1="1122" x2="878" y2="1122" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="322" y1="1174" x2="878" y2="1174" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><circle cx="300" cy="810" r="20" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="300" y="819" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">1</text><circle cx="900" cy="810" r="20" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="900" y="819" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">1</text><circle cx="300" cy="862" r="20" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="300" y="871" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">2</text><circle cx="900" cy="862" r="20" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="900" y="871" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">2</text><circle cx="300" cy="914" r="20" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="300" y="923" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">3</text><circle cx="900" cy="914" r="20" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="900" y="923" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">3</text><circle cx="300" cy="966" r="20" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="300" y="975" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">4</text><circle cx="900" cy="966" r="20" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="900" y="975" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">4</text><circle cx="300" cy="1018" r="20" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="300" y="1027" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">5</text><circle cx="900" cy="1018" r="20" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="900" y="1027" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">5</text><circle cx="300" cy="1070" r="20" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="300" y="1079" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">6</text><circle cx="900" cy="1070" r="20" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="900" y="1079" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">6</text><circle cx="300" cy="1122" r="20" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="300" y="1131" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">7</text><circle cx="900" cy="1122" r="20" fill="#e3edc8" stroke="#0f100d" stroke-width="3"/><text x="900" y="1131" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">7</text><circle cx="300" cy="1174" r="20" fill="#e3edc8" stroke="#0f100d" stroke-width