<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" width="1200" height="710" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Image terdiri dari layer hanya baca, container menambah satu lapisan tulis</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="710" fill="#ffffff"/>
<text x="600" y="64" font-size="38" font-weight="800" text-anchor="middle" fill="#0f100d">Image berlapis dan container di atasnya</text><text x="60" y="130" font-size="30" font-weight="800" text-anchor="start" fill="#0f100d">Image (hanya baca)</text><rect x="60" y="160" width="560" height="68" rx="14" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="340" y="202" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">COPY . .  (kode aplikasimu)</text><rect x="60" y="238" width="560" height="68" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="340" y="280" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">RUN npm ci  (node_modules)</text><rect x="60" y="316" width="560" height="68" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="340" y="358" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">COPY package*.json ./</text><rect x="60" y="394" width="560" height="68" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="340" y="436" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">WORKDIR /app</text><rect x="60" y="472" width="560" height="68" rx="14" fill="#eef0ea" stroke="#0f100d" stroke-width="4"/><text x="340" y="514" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">FROM node:24-alpine  (base image)</text><text x="700" y="130" font-size="30" font-weight="800" text-anchor="start" fill="#0f100d">Container (hasil docker run)</text><rect x="700" y="160" width="440" height="68" rx="14" fill="#f4b6c2" stroke="#0f100d" stroke-width="4"/><text x="920" y="187.33333333333334" font-size="22" font-weight="600" text-anchor="middle" fill="#0f100d">Lapisan tulis container</text><text x="920" y="215.33333333333334" font-size="22" font-weight="600" text-anchor="middle" fill="#0f100d">log, file sementara</text><rect x="700" y="238" width="440" height="230" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4" stroke-dasharray="10 8"/><text x="920" y="346.3333333333333" font-size="22" font-weight="600" text-anchor="middle" fill="#0f100d">Lapisan image dipakai bersama</text><text x="920" y="374.3333333333333" font-size="22" font-weight="600" text-anchor="middle" fill="#0f100d">oleh semua container dari image ini</text><line x1="625" y1="300" x2="695" y2="300" stroke="#0f100d" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><text x="600" y="590" font-size="23" font-weight="500" text-anchor="middle" fill="#0f100d">Layer yang tidak berubah dipakai ulang dari cache. Ubah satu baris,</text><text x="600" y="624" font-size="23" font-weight="500" text-anchor="middle" fill="#0f100d">layer sesudahnya ikut dibuild ulang.</text><text x="600" y="668" font-size="23" font-weight="500" text-anchor="middle" fill="#0f100d">Container dihapus: lapisan tulisnya hilang. Data awet disimpan di volume.</text>
</svg>
