<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 975" width="1200" height="975" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Topologi kantor kecil: internet, modem ISP, router MikroTik, switch, PC, printer, access point, laptop dan HP, dengan rencana alamat IP</title>
<defs></defs>
<rect x="3" y="3" width="1194" height="969" rx="28" fill="#ffffff" stroke="#0f100d" stroke-width="4"/>
<text x="600" y="62" font-size="42" font-weight="800" text-anchor="middle" fill="#0f100d">Jaringan kantor kecil dengan MikroTik</text><path d="M240 178 C195 178 195 126 240 126 C240 84 300 78 322 110 C345 78 412 94 410 132 C456 132 456 178 410 178 Z" fill="#ffffff" stroke="#0f100d" stroke-width="4" stroke-linejoin="round"/><text x="330" y="160" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">Internet</text><line x1="330" y1="180" x2="330" y2="215" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="200" y="215" width="260" height="80" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="330" y="264" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Modem ISP</text><line x1="330" y1="295" x2="330" y2="340" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><text x="348" y="325" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">ether1 (WAN)</text><rect x="160" y="340" width="340" height="100" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="330" y="374" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Router MikroTik</text><text x="330" y="403" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">WAN 203.0.113.5</text><line x1="330" y1="440" x2="330" y2="505" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><text x="348" y="480" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">ether2: 192.168.88.1</text><rect x="170" y="505" width="320" height="80" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="330" y="554" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Switch</text><line x1="330" y1="585" x2="100" y2="650" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="20" y="650" width="160" height="80" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="100" y="684" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">PC 1</text><text x="100" y="713" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">192.168.88.10</text><line x1="330" y1="585" x2="275" y2="650" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="195" y="650" width="160" height="80" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="275" y="684" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">PC 2</text><text x="275" y="713" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">192.168.88.11</text><line x1="330" y1="585" x2="450" y2="650" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="370" y="650" width="160" height="80" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="450" y="684" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Printer</text><text x="450" y="713" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">192.168.88.20</text><line x1="330" y1="585" x2="625" y2="650" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="545" y="650" width="160" height="80" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="625" y="699" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">AP Wi-Fi</text><line x1="625" y1="730" x2="625" y2="790" stroke="#0f100d" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 10"/><path d="M590 768q35-34 70 0M603 756q22-22 44 0" fill="none" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="515" y="790" width="220" height="70" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="625" y="834" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Laptop dan HP</text><rect x="760" y="110" width="400" height="470" rx="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="960" y="160" font-size="30" font-weight="800" text-anchor="middle" fill="#0f100d">Rencana alamat</text><text x="790" y="215" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Jaringan LAN</text><text x="790" y="247" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">192.168.88.0/24</text><text x="790" y="293" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Gateway (ether2)</text><text x="790" y="325" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">192.168.88.1</text><text x="790" y="371" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">Pool DHCP</text><text x="790" y="403" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">192.168.88.100-200</text><text x="790" y="449" font-size="22" font-weight="800" text-anchor="start" fill="#0f100d">IP WAN (ether1)</text><text x="790" y="481" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">203.0.113.5</text><text x="960" y="545" font-size="21" font-weight="500" text-anchor="middle" fill="#0f100d">Proyek: atur IP, DHCP, NAT, uji ping</text><text x="600" y="905" font-size="23" font-weight="500" text-anchor="middle" fill="#0f100d">ether1 ke modem (WAN), ether2 ke switch (LAN).</text><text x="600" y="938" font-size="23" font-weight="500" text-anchor="middle" fill="#0f100d">Semua perangkat kantor memakai router sebagai gateway.</text>
</svg>
