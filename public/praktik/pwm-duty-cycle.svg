<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Tiga gelombang PWM dengan duty cycle 25, 50, dan 75 persen pada 5 volt, tegangan rata-rata 1,25, 2,5, dan 3,75 volt</title>
<defs></defs>
<rect width="1200" height="830" fill="#ffffff"/>
<text x="600" y="62" font-size="42" font-weight="800" text-anchor="middle" fill="#0f100d">PWM: duty cycle dan tegangan rata-rata</text><text x="60" y="188" font-size="32" font-weight="800" text-anchor="start" fill="#0f100d">Duty 25%</text><text x="60" y="228" font-size="24" font-weight="500" text-anchor="start" fill="#0f100d">rata-rata 1,25 V</text><path d="M420 230 L420 150 L485 150 L485 230 L680 230 L680 150 L745 150 L745 230 L940 230 L940 150 L1005 150 L1005 230 L1200 230" fill="none" stroke="#0f100d" stroke-width="5" stroke-linejoin="round"/><line x1="420" y1="270" x2="680" y2="270" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><text x="550" y="300" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">1 periode</text><text x="400" y="158" font-size="20" font-weight="500" text-anchor="end" fill="#0f100d">5 V</text><text x="400" y="238" font-size="20" font-weight="500" text-anchor="end" fill="#0f100d">0 V</text><text x="60" y="378" font-size="32" font-weight="800" text-anchor="start" fill="#0f100d">Duty 50%</text><text x="60" y="418" font-size="24" font-weight="500" text-anchor="start" fill="#0f100d">rata-rata 2,5 V</text><path d="M420 420 L420 340 L550 340 L550 420 L680 420 L680 340 L810 340 L810 420 L940 420 L940 340 L1070 340 L1070 420 L1200 420" fill="none" stroke="#0f100d" stroke-width="5" stroke-linejoin="round"/><line x1="420" y1="460" x2="680" y2="460" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><text x="550" y="490" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">1 periode</text><text x="400" y="348" font-size="20" font-weight="500" text-anchor="end" fill="#0f100d">5 V</text><text x="400" y="428" font-size="20" font-weight="500" text-anchor="end" fill="#0f100d">0 V</text><text x="60" y="568" font-size="32" font-weight="800" text-anchor="start" fill="#0f100d">Duty 75%</text><text x="60" y="608" font-size="24" font-weight="500" text-anchor="start" fill="#0f100d">rata-rata 3,75 V</text><path d="M420 610 L420 530 L615 530 L615 610 L680 610 L680 530 L875 530 L875 610 L940 610 L940 530 L1135 530 L1135 610 L1200 610" fill="none" stroke="#0f100d" stroke-width="5" stroke-linejoin="round"/><line x1="420" y1="650" x2="680" y2="650" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><text x="550" y="680" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">1 periode</text><text x="400" y="538" font-size="20" font-weight="500" text-anchor="end" fill="#0f100d">5 V</text><text x="400" y="618" font-size="20" font-weight="500" text-anchor="end" fill="#0f100d">0 V</text><text x="600" y="750" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Duty cycle = waktu HIGH ÷ periode. Tegangan rata-rata = duty × 5 V.</text><text x="600" y="788" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">analogWrite(0..255): 64 sekitar 25%, 128 sekitar 50%, 191 sekitar 75%.</text>
</svg>
