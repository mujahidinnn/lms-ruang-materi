<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810" width="1200" height="810" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Lima lapisan arsitektur IoT dari perangkat, edge atau gateway, jaringan, platform, sampai aplikasi</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="810" fill="#ffffff"/>
<text x="600" y="62" font-size="42" font-weight="800" text-anchor="middle" fill="#0f100d">Lima lapisan arsitektur IoT</text><rect x="80" y="110" width="1040" height="92" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><circle cx="135" cy="156" r="26" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="135" y="166" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">1</text><text x="190" y="166" font-size="30" font-weight="800" text-anchor="start" fill="#0f100d">Perangkat</text><text x="500" y="166" font-size="24" font-weight="500" text-anchor="start" fill="#0f100d">Sensor, aktuator, mikrokontroler</text><line x1="1152" y1="170" x2="1152" y2="280" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10" marker-end="url(#ah)"/><rect x="80" y="230" width="1040" height="92" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="135" cy="276" r="26" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="135" y="286" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">2</text><text x="190" y="286" font-size="30" font-weight="800" text-anchor="start" fill="#0f100d">Edge / gateway</text><text x="500" y="286" font-size="24" font-weight="500" text-anchor="start" fill="#0f100d">Agregasi, penyaringan, logika lokal</text><line x1="1152" y1="290" x2="1152" y2="400" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10" marker-end="url(#ah)"/><rect x="80" y="350" width="1040" height="92" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><circle cx="135" cy="396" r="26" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="135" y="406" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">3</text><text x="190" y="406" font-size="30" font-weight="800" text-anchor="start" fill="#0f100d">Jaringan</text><text x="500" y="406" font-size="24" font-weight="500" text-anchor="start" fill="#0f100d">Wi-Fi, BLE, Zigbee, LoRaWAN, seluler</text><line x1="1152" y1="410" x2="1152" y2="520" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10" marker-end="url(#ah)"/><rect x="80" y="470" width="1040" height="92" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="135" cy="516" r="26" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="135" y="526" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">4</text><text x="190" y="526" font-size="30" font-weight="800" text-anchor="start" fill="#0f100d">Platform</text><text x="500" y="526" font-size="24" font-weight="500" text-anchor="start" fill="#0f100d">Broker, registry, penyimpanan, rules engine</text><line x1="1152" y1="530" x2="1152" y2="640" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10" marker-end="url(#ah)"/><rect x="80" y="590" width="1040" height="92" rx="16" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><circle cx="135" cy="636" r="26" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="135" y="646" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">5</text><text x="190" y="646" font-size="30" font-weight="800" text-anchor="start" fill="#0f100d">Aplikasi</text><text x="500" y="646" font-size="24" font-weight="500" text-anchor="start" fill="#0f100d">Dashboard, notifikasi, analitik</text><text x="600" y="730" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Data mengalir dari perangkat ke aplikasi (atas ke bawah); perintah naik lewat jalur yang sama.</text><text x="600" y="768" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Keamanan, pembaruan, dan pemantauan melintasi semua lapisan, bukan satu lapisan saja.</text>
</svg>
