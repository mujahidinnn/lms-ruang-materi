<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Sensor dan aplikasi kontrol mempublikasikan topik ke broker MQTT, dashboard dan kipas berlangganan dengan filter</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="690" fill="#ffffff"/>
<text x="600" y="62" font-size="42" font-weight="800" text-anchor="middle" fill="#0f100d">MQTT: publish dan subscribe lewat broker</text><rect x="435" y="250" width="330" height="250" rx="24" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="600" y="345" font-size="36" font-weight="800" text-anchor="middle" fill="#0f100d">Broker</text><text x="600" y="392" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">mencocokkan topik</text><text x="600" y="424" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">dengan filter</text><rect x="30" y="150" width="330" height="150" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="195" y="195" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">Sensor suhu</text><text x="195" y="235" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">publish ke</text><text x="195" y="270" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">gh/01/sensor/temp</text><rect x="30" y="400" width="330" height="150" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="195" y="445" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">Aplikasi kontrol</text><text x="195" y="485" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">publish ke</text><text x="195" y="520" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">gh/01/actuator/fan/set</text><rect x="840" y="150" width="330" height="150" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1005" y="195" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">Dashboard</text><text x="1005" y="235" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">subscribe ke</text><text x="1005" y="270" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">gh/+/sensor/#</text><rect x="840" y="400" width="330" height="150" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1005" y="445" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">Kipas (ESP32)</text><text x="1005" y="485" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">subscribe ke</text><text x="1005" y="520" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">gh/01/actuator/fan/set</text><line x1="364" y1="225" x2="431" y2="300" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="364" y1="475" x2="431" y2="440" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="769" y1="300" x2="836" y2="225" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="769" y1="440" x2="836" y2="475" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="600" y="610" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Pengirim dan penerima tidak saling kenal; semuanya lewat broker.</text><text x="600" y="648" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Topik hierarkis dipisah garis miring. + cocok satu tingkat, # cocok semua tingkat di bawahnya.</text>
</svg>
