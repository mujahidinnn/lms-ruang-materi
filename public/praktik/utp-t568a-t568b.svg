ont-weight="500" text-anchor="middle" fill="#0f100d">putih</text><text x="730" y="801" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">biru</text><circle cx="850" cy="484" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="850" y="494" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">6</text><rect x="810" y="520" width="80" height="220" rx="16" fill="#f0861a" stroke="#0f100d" stroke-width="4"/><text x="850" y="786" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">oranye</text><circle cx="970" cy="484" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="970" y="494" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">7</text><rect x="930" y="520" width="80" height="220" rx="16" fill="url(#s-cokelat)" stroke="#0f100d" stroke-width="4"/><text x="970" y="775" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">putih</text><text x="970" y="801" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">cokelat</text><circle cx="1090" cy="484" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="1090" y="494" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">8</text><rect x="1050" y="520" width="80" height="220" rx="16" fill="#8b5a2b" stroke="#0f100d" stroke-width="4"/><text x="1090" y="786" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">cokelat</text><text x="600" y="880" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Pin dihitung dari kiri ke kanan, kontak emas menghadap kamu dan klip di sisi yang menjauh.</text><text x="600" y="918" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Beda T568A dan T568B hanya pasangan hijau dan oranye yang bertukar: pin 1-2 dengan 3-6.</text>
