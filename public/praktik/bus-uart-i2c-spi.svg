<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810" width="1200" height="810" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Perbandingan UART dengan jalur TX dan RX, I2C dengan SDA dan SCL, dan SPI dengan SCK, MOSI, MISO, dan CS</title>
<defs></defs>
<rect width="1200" height="810" fill="#ffffff"/>
<text x="600" y="62" font-size="42" font-weight="800" text-anchor="middle" fill="#0f100d">UART, I2C, dan SPI</text><rect x="30" y="110" width="350" height="590" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="205" y="160" font-size="34" font-weight="800" text-anchor="middle" fill="#0f100d">UART</text><rect x="45" y="200" width="80" height="190" rx="12" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="85" y="235" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">MCU</text><rect x="285" y="200" width="80" height="190" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="325" y="235" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Modul</text><line x1="125" y1="270" x2="285" y2="270" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><text x="205" y="262" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">TX → RX</text><line x1="125" y1="310" x2="285" y2="310" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><text x="205" y="302" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">RX ← TX</text><line x1="125" y1="350" x2="285" y2="350" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><text x="205" y="342" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">GND</text><text x="50" y="510" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">2 jalur data, tanpa clock</text><text x="50" y="544" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">Kedua sisi sepakat baud rate</text><text x="50" y="578" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">Satu ke satu, saling silang</text><text x="50" y="612" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">Cocok untuk serial monitor,</text><text x="50" y="646" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">GPS, modul Bluetooth</text><rect x="425" y="110" width="350" height="590" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="600" y="160" font-size="34" font-weight="800" text-anchor="middle" fill="#0f100d">I2C</text><rect x="440" y="200" width="80" height="190" rx="12" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="480" y="235" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">MCU</text><rect x="680" y="200" width="80" height="190" rx="12" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="720" y="235" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Sensor</text><line x1="520" y1="270" x2="680" y2="270" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><text x="600" y="262" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">SDA data</text><line x1="520" y1="310" x2="680" y2="310" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><text x="600" y="302" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">SCL clock</text><line x1="520" y1="350" x2="680" y2="350" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><text x="600" y="342" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">GND</text><text x="445" y="510" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">2 jalur untuk banyak perangkat</text><text x="445" y="544" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">Tiap perangkat punya alamat</text><text x="445" y="578" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">Butuh resistor pull-up</text><text x="445" y="612" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">Dua perangkat beralamat sama</text><text x="445" y="646" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">bentrok</text><rect x="820" y="110" width="350" height="590" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="995" y="160" font-size="34" font-weight="800" text-anchor="middle" fill="#0f100d">SPI</text><rect x="835" y="200" width="80" height="230" rx="12" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="875" y="235" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">MCU</text><rect x="1075" y="200" width="80" height="230" rx="12" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1115" y="235" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">Modul</text><line x1="915" y1="270" x2="1075" y2="270" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><text x="995" y="262" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">SCK clock</text><line x1="915" y1="310" x2="1075" y2="310" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><text x="995" y="302" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">MOSI data</text><line x1="915" y1="350" x2="1075" y2="350" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><text x="995" y="342" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">MISO data</text><line x1="915" y1="390" x2="1075" y2="390" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><text x="995" y="382" font-size="19" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">CS pilih</text><text x="840" y="510" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">4 jalur, paling cepat</text><text x="840" y="544" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">CS terpisah tiap perangkat</text><text x="840" y="578" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">Satu master, banyak slave</text><text x="840" y="612" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">Cocok untuk kartu SD,</text><text x="840" y="646" font-size="21" font-weight="500" text-anchor="start" fill="#0f100d">layar, flash</text><text x="600" y="760" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Pilih UART untuk satu modul sederhana, I2C untuk banyak sensor, SPI untuk data besar dan cepat.</text>
</svg>
