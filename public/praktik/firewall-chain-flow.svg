<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 985" width="1200" height="985" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Jalur paket di firewall MikroTik: prerouting, keputusan tujuan router, input atau forward, output, postrouting, dan status koneksi</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="985" fill="#ffffff"/>
<text x="600" y="62" font-size="42" font-weight="800" text-anchor="middle" fill="#0f100d">Jalur paket di firewall MikroTik</text><rect x="40" y="235" width="150" height="80" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="115" y="268" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Paket</text><text x="115" y="298" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">masuk</text><rect x="225" y="235" width="190" height="80" rx="14" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="320" y="271" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">prerouting</text><text x="320" y="299" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">dst-nat</text><line x1="194" y1="275" x2="221" y2="275" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="419" y1="275" x2="436" y2="275" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><polygon points="540,195 645,275 540,355 435,275" fill="#ffffff" stroke="#0f100d" stroke-width="4" stroke-linejoin="round"/><text x="540" y="268" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Tujuan:</text><text x="540" y="298" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">router?</text><line x1="540" y1="195" x2="540" y2="180" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="540" y1="180" x2="636" y2="180" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="560" y="166" font-size="24" font-weight="800" text-anchor="start" fill="#0f100d">Ya</text><rect x="640" y="140" width="140" height="80" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="710" y="176" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">input</text><text x="710" y="204" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">ke router</text><line x1="784" y1="180" x2="811" y2="180" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="815" y="140" width="170" height="80" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="900" y="175" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Proses di</text><text x="900" y="205" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">router</text><line x1="989" y1="180" x2="1016" y2="180" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="1020" y="140" width="140" height="80" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1090" y="176" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">output</text><text x="1090" y="204" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">dari router</text><line x1="540" y1="355" x2="540" y2="370" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="540" y1="370" x2="636" y2="370" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="560" y="410" font-size="24" font-weight="800" text-anchor="start" fill="#0f100d">Tidak</text><rect x="640" y="330" width="180" height="80" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="730" y="366" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">forward</text><text x="730" y="394" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">melewati router</text><line x1="824" y1="370" x2="1090" y2="370" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="1090" y1="224" x2="1090" y2="466" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="960" y="470" width="200" height="80" rx="14" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="1060" y="506" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">postrouting</text><text x="1060" y="534" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">src-nat</text><line x1="956" y1="510" x2="884" y2="510" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="640" y="470" width="240" height="80" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="760" y="520" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Paket keluar</text><text x="40" y="480" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">Dst-nat dikerjakan sebelum</text><text x="40" y="508" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">keputusan routing, src-nat</text><text x="40" y="536" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">sesudahnya.</text><text x="40" y="625" font-size="30" font-weight="800" text-anchor="start" fill="#0f100d">Status koneksi (connection tracking)</text><rect x="40" y="650" width="550" height="90" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="64" y="688" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">established</text><text x="64" y="720" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">bagian dari koneksi yang sudah berjalan</text><rect x="610" y="650" width="550" height="90" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="634" y="688" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">related</text><text x="634" y="720" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">terkait koneksi lain, mis. error ICMP</text><rect x="40" y="755" width="550" height="90" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="64" y="793" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">new</text><text x="64" y="825" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">paket pertama yang memulai koneksi</text><rect x="610" y="755" width="550" height="90" rx="14" fill="#f4b6c2" stroke="#0f100d" stroke-width="4"/><text x="634" y="793" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">invalid</text><text x="634" y="825" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">tidak dikenali, biasanya di-drop</text><text x="600" y="905" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Paket tujuan router lewat input. Paket yang melewati router lewat forward.</text><text x="600" y="941" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Paket buatan router sendiri keluar lewat output.</text>
</svg>
