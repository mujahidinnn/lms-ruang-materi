<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Terowongan PPP: klien di rumah menyambung ke server di kantor lewat PPTP atau SSTP, dengan PPP secret, PPP profile, dan pool alamat</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="960" fill="#ffffff"/>
<text x="600" y="62" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Terowongan PPP antara klien dan server</text><rect x="40" y="150" width="270" height="160" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="175" y="200" font-size="32" font-weight="800" text-anchor="middle" fill="#0f100d">Klien</text><text x="175" y="240" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">laptop di rumah</text><text x="175" y="276" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">10.10.10.2</text><rect x="890" y="150" width="270" height="160" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="1025" y="200" font-size="32" font-weight="800" text-anchor="middle" fill="#0f100d">Server</text><text x="1025" y="240" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">router kantor</text><text x="1025" y="276" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">10.10.10.1</text><rect x="330" y="180" width="540" height="100" rx="50" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="600" y="242" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">PPTP / SSTP (lewat internet)</text><line x1="310" y1="230" x2="330" y2="230" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="870" y1="230" x2="890" y2="230" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><text x="600" y="162" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">terowongan lewat jaringan</text><rect x="40" y="360" width="340" height="240" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="64" y="406" font-size="30" font-weight="800" text-anchor="start" fill="#0f100d">PPPoE</text><text x="64" y="446" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">Lapis 2, di atas ethernet.</text><text x="64" y="476" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">Butuh interface dan</text><text x="64" y="506" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">service-name.</text><text x="64" y="536" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">Hanya dalam satu ethernet,</text><text x="64" y="566" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">bukan lewat internet.</text><rect x="430" y="360" width="340" height="240" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="454" y="406" font-size="30" font-weight="800" text-anchor="start" fill="#0f100d">PPTP</text><text x="454" y="446" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">Di atas IP.</text><text x="454" y="476" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">Sudah tua, keamanannya</text><text x="454" y="506" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">lemah.</text><rect x="820" y="360" width="340" height="240" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="844" y="406" font-size="30" font-weight="800" text-anchor="start" fill="#0f100d">SSTP</text><text x="844" y="446" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">Di atas IP, dibungkus</text><text x="844" y="476" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">TLS (SSL).</text><text x="40" y="665" font-size="30" font-weight="800" text-anchor="start" fill="#0f100d">Di sisi server</text><rect x="40" y="695" width="340" height="130" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="64" y="739" font-size="28" font-weight="800" text-anchor="start" fill="#0f100d">PPP secret</text><text x="64" y="774" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">Nama user dan password</text><text x="64" y="804" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">untuk tiap klien.</text><line x1="384" y1="760" x2="426" y2="760" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="430" y="695" width="340" height="130" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="454" y="739" font-size="28" font-weight="800" text-anchor="start" fill="#0f100d">PPP profile</text><text x="454" y="774" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">Aturan sesi: alamat lokal,</text><text x="454" y="804" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">pool, dan batas.</text><line x1="774" y1="760" x2="816" y2="760" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><rect x="820" y="695" width="340" height="130" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="844" y="739" font-size="28" font-weight="800" text-anchor="start" fill="#0f100d">Pool alamat</text><text x="844" y="774" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">Daftar IP yang dibagikan</text><text x="844" y="804" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">ke klien.</text><text x="600" y="885" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Klien masuk dengan user dan password dari PPP secret.</text><text x="600" y="921" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Server memberi klien alamat dari pool lewat PPP profile.</text>
</svg>
