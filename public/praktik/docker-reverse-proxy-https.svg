<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Browser terhubung lewat HTTPS ke reverse proxy yang meneruskan HTTP ke aplikasi</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="650" fill="#ffffff"/>
<text x="600" y="64" font-size="38" font-weight="800" text-anchor="middle" fill="#0f100d">Reverse proxy dan HTTPS</text><rect x="30" y="200" width="200" height="120" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="130" y="269.3333333333333" font-size="28" font-weight="600" text-anchor="middle" fill="#0f100d">Browser</text><rect x="360" y="150" width="330" height="220" rx="14" fill="#f4b6c2" stroke="#0f100d" stroke-width="4"/><text x="525" y="223" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d">Reverse proxy</text><text x="525" y="253" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d">(Caddy atau Nginx)</text><text x="525" y="283" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d">sertifikat TLS</text><text x="525" y="313" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d">port 80 dan 443</text><rect x="820" y="200" width="340" height="120" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="990" y="252.66666666666666" font-size="26" font-weight="600" text-anchor="middle" fill="#0f100d">Aplikasi Node</text><text x="990" y="284.66666666666663" font-size="26" font-weight="600" text-anchor="middle" fill="#0f100d">http://api:3000</text><line x1="235" y1="260" x2="355" y2="260" stroke="#0f100d" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><text x="295" y="235" font-size="22" font-weight="700" text-anchor="middle" fill="#0f100d">HTTPS</text><line x1="695" y1="260" x2="815" y2="260" stroke="#0f100d" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><text x="755" y="235" font-size="22" font-weight="700" text-anchor="middle" fill="#0f100d">HTTP</text><text x="130" y="370" font-size="22" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">app.contoh.id</text><rect x="360" y="450" width="330" height="90" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="525" y="503.6666666666667" font-size="26" font-weight="600" text-anchor="middle" fill="#0f100d">Let's Encrypt</text><line x1="525" y1="445" x2="525" y2="375" stroke="#0f100d" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="560" y="420" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">sertifikat otomatis</text><text x="600" y="600" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Enkripsi berakhir di proxy; lalu lintas ke aplikasi berjalan di network internal.</text>
</svg>
