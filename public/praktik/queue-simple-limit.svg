<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Simple queue dengan target 192.168.88.0/24 dan max-limit unggah 5M, unduh 10M, serta opsi limit-at dan burst</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="860" fill="#ffffff"/>
<text x="600" y="62" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">Simple queue: batas kecepatan per target</text><rect x="380" y="120" width="440" height="350" rx="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="600" y="170" font-size="30" font-weight="800" text-anchor="middle" fill="#0f100d">Simple queue</text><rect x="40" y="190" width="260" height="220" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="170" y="245" font-size="30" font-weight="800" text-anchor="middle" fill="#0f100d">Target</text><text x="170" y="288" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">192.168.88.0/24</text><text x="170" y="326" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">PC, laptop, HP</text><rect x="900" y="190" width="260" height="220" rx="18" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1030" y="245" font-size="30" font-weight="800" text-anchor="middle" fill="#0f100d">Internet</text><line x1="304" y1="270" x2="896" y2="270" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="600" y="238" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Unggah: max-limit 5M</text><text x="600" y="306" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">dari target ke internet</text><line x1="896" y1="390" x2="304" y2="390" stroke="#0f100d" stroke-width="10" stroke-linecap="round" marker-end="url(#ah)"/><text x="600" y="358" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Unduh: max-limit 10M</text><text x="600" y="436" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">dari internet ke target</text><rect x="40" y="510" width="340" height="150" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="64" y="554" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">max-limit</text><text x="64" y="598" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">Batas atas kecepatan,</text><text x="64" y="628" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">format unggah/unduh.</text><rect x="430" y="510" width="340" height="150" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="454" y="554" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">limit-at (opsi)</text><text x="454" y="598" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">Kecepatan yang dijamin</text><text x="454" y="628" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">untuk target.</text><rect x="820" y="510" width="340" height="150" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="844" y="554" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">burst (opsi)</text><text x="844" y="598" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">Boleh melewati max-limit</text><text x="844" y="628" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">untuk waktu singkat.</text><text x="60" y="725" font-size="24" font-weight="800" text-anchor="start" fill="#0f100d">Di MikroTik:</text><text x="240" y="725" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/queue simple add name=kantor \</text><text x="240" y="757" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">    target=192.168.88.0/24 max-limit=5M/10M</text><text x="600" y="815" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Angka pertama pada max-limit adalah unggah, angka kedua unduh.</text>
</svg>
