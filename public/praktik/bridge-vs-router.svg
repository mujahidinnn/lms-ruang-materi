<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 990" width="1200" height="990" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Bridge bekerja di lapis 2 dengan alamat MAC dalam satu segmen, router bekerja di lapis 3 antar jaringan dengan alamat IP dan rute</title>
<defs></defs>
<rect width="1200" height="990" fill="#ffffff"/>
<text x="600" y="62" font-size="42" font-weight="800" text-anchor="middle" fill="#0f100d">Bridge dan router: apa bedanya</text><rect x="40" y="100" width="540" height="770" rx="22" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="310" y="160" font-size="36" font-weight="800" text-anchor="middle" fill="#0f100d">Bridge</text><text x="310" y="198" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Lapis 2 (Data Link)</text><rect x="170" y="250" width="280" height="130" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="310" y="292" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">bridge1</text><rect x="185" y="314" width="110" height="44" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="240" y="345" font-size="22" font-weight="700" text-anchor="middle" fill="#0f100d">ether2</text><rect x="325" y="314" width="110" height="44" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="380" y="345" font-size="22" font-weight="700" text-anchor="middle" fill="#0f100d">ether3</text><line x1="240" y1="380" x2="180" y2="480" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="70" y="480" width="220" height="100" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="180" y="520" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">PC A</text><text x="180" y="556" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">MAC A</text><line x1="380" y1="380" x2="440" y2="480" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="330" y="480" width="220" height="100" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="440" y="520" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">PC B</text><text x="440" y="556" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">MAC B</text><circle cx="76" cy="632" r="8" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="100" y="640" font-size="23" font-weight="500" text-anchor="start" fill="#0f100d">Meneruskan frame lewat alamat MAC</text><circle cx="76" cy="684" r="8" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="100" y="692" font-size="23" font-weight="500" text-anchor="start" fill="#0f100d">Satu segmen, satu subnet IP</text><circle cx="76" cy="736" r="8" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="100" y="744" font-size="23" font-weight="500" text-anchor="start" fill="#0f100d">Port ether2 dan ether3 jadi satu</text><circle cx="76" cy="788" r="8" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="100" y="796" font-size="23" font-weight="500" text-anchor="start" fill="#0f100d">Cara kerjanya mirip switch</text><rect x="620" y="100" width="540" height="770" rx="22" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="890" y="160" font-size="36" font-weight="800" text-anchor="middle" fill="#0f100d">Router</text><text x="890" y="198" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Lapis 3 (Network)</text><rect x="750" y="250" width="280" height="130" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="890" y="292" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">Router</text><rect x="765" y="314" width="110" height="44" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="820" y="345" font-size="22" font-weight="700" text-anchor="middle" fill="#0f100d">ether2</text><rect x="905" y="314" width="110" height="44" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="960" y="345" font-size="22" font-weight="700" text-anchor="middle" fill="#0f100d">ether3</text><line x1="820" y1="380" x2="760" y2="480" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="650" y="480" width="220" height="100" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="760" y="520" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Jaringan A</text><text x="760" y="556" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">192.168.88.0/24</text><line x1="960" y1="380" x2="1020" y2="480" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="910" y="480" width="220" height="100" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="1020" y="520" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Jaringan B</text><text x="1020" y="556" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">192.168.99.0/24</text><circle cx="656" cy="632" r="8" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="680" y="640" font-size="23" font-weight="500" text-anchor="start" fill="#0f100d">Meneruskan paket lewat alamat IP</text><circle cx="656" cy="684" r="8" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="680" y="692" font-size="23" font-weight="500" text-anchor="start" fill="#0f100d">Menghubungkan dua jaringan</text><circle cx="656" cy="736" r="8" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="680" y="744" font-size="23" font-weight="500" text-anchor="start" fill="#0f100d">Tiap port punya IP dan subnet sendiri</text><circle cx="656" cy="788" r="8" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><text x="680" y="796" font-size="23" font-weight="500" text-anchor="start" fill="#0f100d">Memilih jalur dari tabel rute</text><text x="60" y="915" font-size="24" font-weight="800" text-anchor="start" fill="#0f100d">Di MikroTik:</text><text x="240" y="915" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/interface bridge add name=bridge1</text><text x="240" y="950" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/interface bridge port add bridge=bridge1 interface=ether2</text>
</svg>
