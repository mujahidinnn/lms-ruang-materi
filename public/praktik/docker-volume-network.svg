<rect width="1200" height="660" fill="#ffffff"/>
<text x="600" y="64" font-size="38" font-weight="800" text-anchor="middle" fill="#0f100d">Volume, network, dan port</text><rect x="30" y="200" width="200" height="110" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="130" y="248" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d">Host</text><text x="130" y="278" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d">localhost:8080</text><line x1="235" y1="255" x2="345" y2="255" stroke="#0f100d" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><text x="130" y="345" font-size="22" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">-p 8080:3000</text><rect x="300" y="110" width="870" height="420" rx="14" fill="#eef0ea" stroke="#0f100d" stroke-width="4" stroke-dasharray="12 8"/><text x="320" y="150" font-size="24" font-weight="700" text-anchor="start" fill="#0f100d">Network app-net (bridge buatan sendiri)</text><rect x="350" y="200" width="250" height="110" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="475" y="247.66666666666666" font-size="26" font-weight="600" text-anchor="middle" fill="#0f100d">api</text><text x="475" y="279.66666666666663" font-size="26" font-weight="600" text-anchor="middle" fill="#0f100d">port 3000</text><rect x="860" y="200" width="250" height="110" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="985" y="247.66666666666666" font-size="26" font-weight="600" text-anchor="middle" fill="#0f100d">db</text><text x="985" y="279.66666666666663" font-size="26" font-weight="600" text-anchor="middle" fill="#0f100d">port 5432</text><line x1="605" y1="255" x2="855" y2="255" stroke="#0f100d" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="730" y="240" font-size="22" font-weight="600" text-anchor="middle" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">db:5432</text><rect x="860" y="