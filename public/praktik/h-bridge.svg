or="middle" fill="#0f100d">S3</text><line x1="770" y1="460" x2="770" y2="520" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="1030" y1="190" x2="1030" y2="240" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="995" y="240" width="70" height="60" rx="10" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="1030" y="278" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">S2</text><line x1="1030" y1="300" x2="1030" y2="355" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="1030" y1="355" x2="1030" y2="400" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="995" y="400" width="70" height="60" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="1030" y="438" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">S4</text><line x1="1030" y1="460" x2="1030" y2="520" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="770" y1="355" x2="865" y2="355" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="935" y1="355" x2="1030" y2="355" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><circle cx="900" cy="355" r="38" fill="#f4b6c2" stroke="#0f100d" stroke-width="4"/><text x="900" y="365" font-size="30" font-weight="800" text-anchor="middle" fill="#0f100d">M</text><path d="M1030 190 L1030 355 L770 355 L770 520" fill="none" stroke="#7aa12a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/><text x="600" y="610" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Arus melewati motor dari kiri ke kanan, atau sebaliknya. Itu yang membalik putaran.</text><text x="600" y="648" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Jalur hijau menunjukkan arah arus. PWM pada saklar yang aktif mengatur kecepatan.</text><rect x="180" y="680" width="840" height="70" rx="14" fill="#f4b6c2" stroke="#0f100d" stroke-width="4"/><text x="600" y="725" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Jangan nyalakan S1 + S3 atau S2 + S4 bersamaan: korsleting.</text>
