<rect width="1200" height="790" fill="#ffffff"/>
<text x="600" y="62" font-size="42" font-weight="800" text-anchor="middle" fill="#0f100d">H-bridge: membalik arah putaran motor</text><text x="300" y="140" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">S1 + S4 ON: motor maju</text><text x="300" y="178" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">+V</text><line x1="170" y1="190" x2="430" y2="190" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="170" y1="520" x2="430" y2="520" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><text x="300" y="556" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">GND</text><line x1="170" y1="190" x2="170" y2="240" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="135" y="240" width="70" height="60" rx="10" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="170" y="278" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">S1</text><line x1="170" y1="300" x2="170" y2="355" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="170" y1="355" x2="170" y2="400" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="135" y="400" width="70" height="60" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="170" y="438" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">S3</text><line x1="170" y1="460" x2="170" y2="520" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="430" y1="190" x2="430" y2="240" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="395" y="240" width="70" height="60" rx="10" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="430" y="278" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">S2</text><line x1="430" y1="300" x2="430" y2="355" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="430" y1="355" x2="430" y2="400" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="395" y="400" width="70" hei