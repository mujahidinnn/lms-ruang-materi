<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Robot diferensial dilihat dari atas dengan dua roda, kecepatan vL dan vR, jarak antar roda L, rumus v dan omega</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="820" fill="#ffffff"/>
<text x="600" y="62" font-size="42" font-weight="800" text-anchor="middle" fill="#0f100d">Robot diferensial dari atas</text><rect x="450" y="230" width="300" height="250" rx="24" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="600" y="360" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">badan robot</text><rect x="405" y="260" width="45" height="190" rx="8" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><rect x="750" y="260" width="45" height="190" rx="8" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><line x1="427" y1="255" x2="427" y2="190" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="427" y="170" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">vL</text><line x1="772" y1="255" x2="772" y2="120" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="772" y="100" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">vR</text><text x="310" y="345" font-size="22" font-weight="500" text-anchor="end" fill="#0f100d">roda kiri</text><text x="890" y="345" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">roda kanan</text><line x1="427" y1="510" x2="772" y2="510" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><line x1="427" y1="498" x2="427" y2="522" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><line x1="772" y1="498" x2="772" y2="522" stroke="#0f100d" stroke-width="3" stroke-linecap="round"/><text x="600" y="548" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">L = jarak antar roda</text><text x="600" y="205" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">depan</text><rect x="60" y="600" width="520" height="120" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="85" y="648" font-size="28" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">v = (vR + vL) ÷ 2</text><text x="85" y="692" font-size="28" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">ω = (vR − vL) ÷ L</text><text x="640" y="635" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">vR = vL</text><text x="820" y="635" font-size="24" font-weight="500" text-anchor="start" fill="#0f100d">lurus</text><text x="640" y="675" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">vR &gt; vL</text><text x="820" y="675" font-size="24" font-weight="500" text-anchor="start" fill="#0f100d">belok kiri</text><text x="640" y="715" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">vR = −vL</text><text x="820" y="715" font-size="24" font-weight="500" text-anchor="start" fill="#0f100d">berputar di tempat</text><text x="600" y="775" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">v adalah kecepatan maju robot (m/s), ω kecepatan putar (rad/s, positif berlawanan arah jarum jam).</text>
</svg>
