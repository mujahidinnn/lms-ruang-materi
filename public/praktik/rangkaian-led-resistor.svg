<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">LED merah seri dengan resistor 150 ohm pada sumber 5 volt, arus 20 miliampere</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="750" fill="#ffffff"/>
<text x="600" y="62" font-size="42" font-weight="800" text-anchor="middle" fill="#0f100d">Rangkaian LED pertama</text><rect x="60" y="210" width="130" height="180" rx="16" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="125" y="270" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">Sumber</text><text x="125" y="315" font-size="40" font-weight="800" text-anchor="middle" fill="#0f100d">5 V</text><text x="125" y="360" font-size="20" font-weight="500" text-anchor="middle" fill="#0f100d">+ di atas</text><line x1="125" y1="210" x2="125" y2="150" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="125" y1="150" x2="380" y2="150" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="380" y="115" width="220" height="70" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="490" y="146" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">R</text><text x="490" y="176" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">150 Ω</text><line x1="600" y1="150" x2="900" y2="150" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="640" y1="150" x2="760" y2="150" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><text x="700" y="128" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">arus</text><line x1="900" y1="150" x2="900" y2="215" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="830" y="215" width="140" height="120" rx="18" fill="#f4b6c2" stroke="#0f100d" stroke-width="4"/><text x="900" y="265" font-size="32" font-weight="800" text-anchor="middle" fill="#0f100d">LED</text><text x="900" y="305" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">merah</text><line x1="900" y1="335" x2="900" y2="440" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="900" y1="440" x2="125" y2="440" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="125" y1="440" x2="125" y2="390" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><text x="990" y="245" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">anoda (+)</text><text x="990" y="272" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">kaki panjang</text><text x="990" y="315" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">katoda (−)</text><text x="990" y="342" font-size="20" font-weight="500" text-anchor="start" fill="#0f100d">kaki pendek</text><rect x="60" y="500" width="1080" height="150" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="90" y="552" font-size="30" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">R = (V sumber − V LED) ÷ I</text><text x="90" y="600" font-size="30" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">R = (5 − 2) ÷ 0,02 = 150 Ω</text><text x="90" y="636" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d">V LED sekitar 2 V dan arus 20 mA; pakai nilai standar yang tidak lebih kecil dari hasil hitung.</text><text x="600" y="705" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Tanpa resistor, LED cepat rusak. Matikan sumber sebelum mengubah rangkaian.</text>
</svg>
