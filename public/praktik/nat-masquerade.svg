<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">NAT mengganti alamat dan port sumber paket dari jaringan lokal menjadi alamat publik router</title>
<defs><marker id="ah" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="860" fill="#ffffff"/>
<text x="600" y="62" font-size="38" font-weight="800" text-anchor="middle" fill="#0f100d">NAT: satu alamat publik untuk banyak perangkat</text><rect x="40" y="110" width="290" height="140" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="185" y="160" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">Laptop</text><text x="185" y="200" font-size="26" font-weight="500" text-anchor="middle" fill="#0f100d">192.168.1.10</text><text x="185" y="232" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">port 5000</text><rect x="455" y="110" width="290" height="140" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="600" y="160" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">Router NAT</text><text x="600" y="198" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">LAN 192.168.1.1</text><text x="600" y="230" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">WAN 203.0.113.5</text><rect x="870" y="110" width="290" height="140" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="1015" y="160" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">Server web</text><text x="1015" y="200" font-size="26" font-weight="500" text-anchor="middle" fill="#0f100d">198.51.100.20</text><text x="1015" y="232" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">port 443</text><line x1="334" y1="150" x2="450" y2="150" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="749" y1="150" x2="865" y2="150" stroke="#0f100d" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><line x1="865" y1="215" x2="749" y2="215" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#ah)"/><line x1="450" y1="215" x2="334" y2="215" stroke="#0f100d" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#ah)"/><circle cx="392" cy="126" r="17" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="392" y="134" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">1</text><circle cx="807" cy="126" r="17" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="807" y="134" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">2</text><circle cx="807" cy="191" r="17" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="807" y="199" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">3</text><circle cx="392" cy="191" r="17" fill="#ffffff" stroke="#0f100d" stroke-width="3"/><text x="392" y="199" font-size="22" font-weight="800" text-anchor="middle" fill="#0f100d">4</text><rect x="40" y="300" width="1120" height="66" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="80" cy="333" r="20" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="80" y="342" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">1</text><text x="120" y="343" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d">Keluar dari laptop</text><text x="430" y="343" font-size="25" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">sumber 192.168.1.10:5000  ke  198.51.100.20:443</text><rect x="40" y="382" width="1120" height="66" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="80" cy="415" r="20" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="80" y="424" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">2</text><text x="120" y="425" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d">Setelah NAT</text><text x="430" y="425" font-size="25" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">sumber 203.0.113.5:40000  ke  198.51.100.20:443</text><rect x="40" y="464" width="1120" height="66" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="80" cy="497" r="20" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="80" y="506" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">3</text><text x="120" y="507" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d">Balasan server</text><text x="430" y="507" font-size="25" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">dari 198.51.100.20:443  ke  203.0.113.5:40000</text><rect x="40" y="546" width="1120" height="66" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="80" cy="579" r="20" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="80" y="588" font-size="24" font-weight="800" text-anchor="middle" fill="#0f100d">4</text><text x="120" y="589" font-size="26" font-weight="800" text-anchor="start" fill="#0f100d">Diterjemahkan balik</text><text x="430" y="589" font-size="25" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">dari 198.51.100.20:443  ke  192.168.1.10:5000</text><rect x="40" y="640" width="1120" height="90" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="70" y="678" font-size="24" font-weight="800" text-anchor="start" fill="#0f100d">Tabel terjemahan di router</text><text x="70" y="712" font-size="26" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">192.168.1.10:5000  &lt;-&gt;  203.0.113.5:40000</text><text x="60" y="785" font-size="24" font-weight="800" text-anchor="start" fill="#0f100d">Di MikroTik:</text><text x="240" y="785" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">/ip firewall nat add chain=srcnat \</text><text x="240" y="817" font-size="22" font-weight="500" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">    out-interface=ether1 action=masquerade</text>
</svg>
