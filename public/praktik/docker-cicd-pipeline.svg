<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Dari git push sampai deploy: test, build, push image, lalu deploy ke server</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="570" fill="#ffffff"/>
<text x="600" y="64" font-size="38" font-weight="800" text-anchor="middle" fill="#0f100d">Pipeline CI/CD sederhana</text><rect x="30" y="200" width="190" height="130" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="125" y="258.1666666666667" font-size="23" font-weight="600" text-anchor="middle" fill="#0f100d">git push</text><text x="125" y="287.1666666666667" font-size="23" font-weight="600" text-anchor="middle" fill="#0f100d">ke main</text><line x1="225" y1="265" x2="257" y2="265" stroke="#0f100d" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="262" y="200" width="190" height="130" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="357" y="258.1666666666667" font-size="23" font-weight="600" text-anchor="middle" fill="#0f100d">Test</text><text x="357" y="287.1666666666667" font-size="23" font-weight="600" text-anchor="middle" fill="#0f100d">npm test</text><line x1="457" y1="265" x2="489" y2="265" stroke="#0f100d" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="494" y="200" width="190" height="130" rx="14" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="589" y="258.1666666666667" font-size="23" font-weight="600" text-anchor="middle" fill="#0f100d">Build</text><text x="589" y="287.1666666666667" font-size="23" font-weight="600" text-anchor="middle" fill="#0f100d">docker build</text><line x1="689" y1="265" x2="721" y2="265" stroke="#0f100d" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="726" y="200" width="190" height="130" rx="14" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="821" y="258.1666666666667" font-size="23" font-weight="600" text-anchor="middle" fill="#0f100d">Push</text><text x="821" y="287.1666666666667" font-size="23" font-weight="600" text-anchor="middle" fill="#0f100d">ke GHCR</text><line x1="921" y1="265" x2="953" y2="265" stroke="#0f100d" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="958" y="200" width="190" height="130" rx="14" fill="#f4b6c2" stroke="#0f100d" stroke-width="4"/><text x="1053" y="258.1666666666667" font-size="23" font-weight="600" text-anchor="middle" fill="#0f100d">Deploy</text><text x="1053" y="287.1666666666667" font-size="23" font-weight="600" text-anchor="middle" fill="#0f100d">ssh + compose</text><text x="125" y="400" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">CI</text><text x="357" y="400" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">CI</text><text x="589" y="400" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">CI</text><text x="821" y="400" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">CI</text><text x="1053" y="400" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">CD</text><text x="600" y="480" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Test gagal: pipeline berhenti di situ dan tidak ada yang sampai ke server.</text><text x="600" y="520" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Rahasia (kunci SSH, token) disimpan di GitHub Secrets, bukan di repo.</text>
