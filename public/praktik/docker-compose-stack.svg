<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Compose menjalankan proxy, api, dan db di satu network</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="620" fill="#ffffff"/>
<text x="600" y="64" font-size="38" font-weight="800" text-anchor="middle" fill="#0f100d">Satu compose.yaml, tiga service</text><rect x="40" y="110" width="1120" height="410" rx="14" fill="#eef0ea" stroke="#0f100d" stroke-width="4" stroke-dasharray="12 8"/><text x="60" y="150" font-size="24" font-weight="700" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">compose.yaml  (docker compose up -d)</text><rect x="80" y="200" width="280" height="150" rx="14" fill="#f4b6c2" stroke="#0f100d" stroke-width="4"/><text x="220" y="253" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d">proxy</text><text x="220" y="283" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d">caddy:2</text><text x="220" y="313" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d">80, 443 terbuka</text><rect x="460" y="200" width="280" height="150" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="600" y="253" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d">api</text><text x="600" y="283" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d">image buatanmu</text><text x="600" y="313" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d">port 3000 internal</text><rect x="840" y="200" width="280" height="150" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="980" y="253" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d">db</text><text x="980" y="283" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d">postgres:17-alpine</text><text x="980" y="313" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d">port 5432 internal</text><line x1="365" y1="275" x2="455" y2="275" stroke="#0f100d" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><line x1="745" y1="275" x2="835" y2="275" stroke="#0f100d" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="840" y="400" width="280" height="90" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="980" y="453" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d">volume pgdata</text><line x1="980" y1="355" x2="980" y2="395" stroke="#0f100d" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="460" y="400" width="280" height="90" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="600" y="453" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d">.env / secrets</text><line x1="600" y1="395" x2="600" y2="355" stroke="#0f100d" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><text x="600" y="575" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Internet hanya mengenal proxy. api dan db tidak punya port publik.</text>
</svg>
