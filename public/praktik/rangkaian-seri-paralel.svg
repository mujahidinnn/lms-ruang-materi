<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Rangkaian seri dengan R1 100 ohm dan R2 220 ohm menjadi 320 ohm, rangkaian paralel dua resistor 100 ohm menjadi 50 ohm</title>
<defs></defs>
<rect width="1200" height="790" fill="#ffffff"/>
<text x="600" y="62" font-size="42" font-weight="800" text-anchor="middle" fill="#0f100d">Rangkaian seri dan paralel</text><text x="60" y="130" font-size="34" font-weight="800" text-anchor="start" fill="#0f100d">Seri</text><text x="660" y="130" font-size="34" font-weight="800" text-anchor="start" fill="#0f100d">Paralel</text><line x1="60" y1="260" x2="100" y2="260" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="100" y="225" width="160" height="70" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="180" y="256" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">R1</text><text x="180" y="286" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">100 Ω</text><line x1="260" y1="260" x2="340" y2="260" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="340" y="225" width="160" height="70" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="420" y="256" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">R2</text><text x="420" y="286" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">220 Ω</text><line x1="500" y1="260" x2="540" y2="260" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="260" r="10" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><circle cx="540" cy="260" r="10" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><line x1="680" y1="220" x2="680" y2="340" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="1140" y1="220" x2="1140" y2="340" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="680" y1="220" x2="760" y2="220" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="760" y="185" width="160" height="70" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="840" y="216" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">R1</text><text x="840" y="246" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">100 Ω</text><line x1="920" y1="220" x2="1140" y2="220" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="680" y1="340" x2="760" y2="340" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><rect x="760" y="305" width="160" height="70" rx="10" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="840" y="336" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">R2</text><text x="840" y="366" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">100 Ω</text><line x1="920" y1="340" x2="1140" y2="340" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="640" y1="280" x2="680" y2="280" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><line x1="1140" y1="280" x2="1180" y2="280" stroke="#0f100d" stroke-width="4" stroke-linecap="round"/><circle cx="640" cy="280" r="10" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><circle cx="1180" cy="280" r="10" fill="#b5d36f" stroke="#0f100d" stroke-width="3"/><rect x="40" y="420" width="540" height="270" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="60" y="470" font-size="28" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">R total = R1 + R2</text><text x="60" y="510" font-size="26" font-weight="800" text-anchor="start" fill="#3d5a0a" font-family="ui-monospace, Menlo, Consolas, monospace">100 + 220 = 320 Ω</text><text x="60" y="565" font-size="24" font-weight="500" text-anchor="start" fill="#0f100d">Arus sama di semua komponen</text><text x="60" y="603" font-size="24" font-weight="500" text-anchor="start" fill="#0f100d">Tegangan terbagi ke tiap komponen</text><text x="60" y="641" font-size="24" font-weight="500" text-anchor="start" fill="#0f100d">Satu putus, seluruh rangkaian mati</text><rect x="620" y="420" width="540" height="270" rx="16" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><text x="640" y="470" font-size="28" font-weight="800" text-anchor="start" fill="#0f100d" font-family="ui-monospace, Menlo, Consolas, monospace">1/R total = 1/R1 + 1/R2</text><text x="640" y="510" font-size="26" font-weight="800" text-anchor="start" fill="#3d5a0a" font-family="ui-monospace, Menlo, Consolas, monospace">100 Ω ∥ 100 Ω = 50 Ω</text><text x="640" y="565" font-size="24" font-weight="500" text-anchor="start" fill="#0f100d">Tegangan sama di tiap cabang</text><text x="640" y="603" font-size="24" font-weight="500" text-anchor="start" fill="#0f100d">Arus terbagi ke tiap cabang</text><text x="640" y="641" font-size="24" font-weight="500" text-anchor="start" fill="#0f100d">Satu cabang putus, cabang lain jalan</text><text x="600" y="740" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Hambatan seri selalu lebih besar dari tiap resistor; paralel selalu lebih kecil dari yang terkecil.</text>
</svg>
