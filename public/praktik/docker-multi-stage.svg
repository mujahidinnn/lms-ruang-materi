<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Stage build dibuang, hanya hasilnya yang disalin ke image final</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f100d"/></marker></defs>
<rect width="1200" height="650" fill="#ffffff"/>
<text x="600" y="64" font-size="38" font-weight="800" text-anchor="middle" fill="#0f100d">Multi-stage build</text><rect x="40" y="140" width="400" height="360" rx="14" fill="#eef0ea" stroke="#0f100d" stroke-width="4"/><text x="240" y="180" font-size="30" font-weight="800" text-anchor="middle" fill="#0f100d">Stage build</text><text x="240" y="286.3333333333333" font-size="22" font-weight="600" text-anchor="middle" fill="#0f100d">FROM node:24 AS build</text><text x="240" y="314.3333333333333" font-size="22" font-weight="600" text-anchor="middle" fill="#0f100d">npm ci (semua dependency)</text><text x="240" y="342.3333333333333" font-size="22" font-weight="600" text-anchor="middle" fill="#0f100d">npm run build</text><text x="240" y="370.3333333333333" font-size="22" font-weight="600" text-anchor="middle" fill="#0f100d">kompiler, devDependencies,</text><text x="240" y="398.3333333333333" font-size="22" font-weight="600" text-anchor="middle" fill="#0f100d">kode sumber</text><rect x="760" y="140" width="400" height="360" rx="14" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="960" y="180" font-size="30" font-weight="800" text-anchor="middle" fill="#0f100d">Stage final</text><text x="960" y="286.3333333333333" font-size="22" font-weight="600" text-anchor="middle" fill="#0f100d">FROM node:24-alpine</text><text x="960" y="314.3333333333333" font-size="22" font-weight="600" text-anchor="middle" fill="#0f100d">npm ci --omit=dev</text><text x="960" y="342.3333333333333" font-size="22" font-weight="600" text-anchor="middle" fill="#0f100d">COPY --from=build /app/dist</text><text x="960" y="370.3333333333333" font-size="22" font-weight="600" text-anchor="middle" fill="#0f100d">USER node</text><text x="960" y="398.3333333333333" font-size="22" font-weight="600" text-anchor="middle" fill="#0f100d">CMD node dist/server.js</text><line x1="445" y1="330" x2="755" y2="330" stroke="#0f100d" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><text x="600" y="305" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">hanya hasil build</text><text x="240" y="540" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d">dibuang, tidak ikut image</text><text x="960" y="540" font-size="24" font-weight="600" text-anchor="middle" fill="#0f100d">image yang dikirim ke server</text><text x="600" y="610" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Image akhir hanya berisi yang dibutuhkan untuk menjalankan aplikasi.</text>
</svg>
