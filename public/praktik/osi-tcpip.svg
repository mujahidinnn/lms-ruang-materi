<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" role="img" aria-labelledby="t" font-family="system-ui, 'Segoe UI', Roboto, sans-serif">
<title id="t">Tujuh lapisan model OSI dipetakan ke empat lapisan TCP/IP, dengan unit data dan contoh tiap lapisan</title>
<defs></defs>
<rect width="1200" height="960" fill="#ffffff"/>
<text x="600" y="62" font-size="42" font-weight="800" text-anchor="middle" fill="#0f100d">Model OSI dan TCP/IP</text><text x="170" y="112" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">TCP/IP</text><text x="495" y="112" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">OSI</text><text x="765" y="112" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Unit data</text><text x="1020" y="112" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">Contoh</text><rect x="40" y="130" width="260" height="288" rx="18" fill="#b5d36f" stroke="#0f100d" stroke-width="4"/><text x="170" y="284" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">Application</text><rect x="40" y="430" width="260" height="88" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="170" y="484" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">Transport</text><rect x="40" y="530" width="260" height="88" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="170" y="584" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">Internet</text><rect x="40" y="630" width="260" height="188" rx="18" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="170" y="734" font-size="28" font-weight="800" text-anchor="middle" fill="#0f100d">Network Access</text><rect x="330" y="130" width="330" height="88" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="375" cy="174" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="375" y="184" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">7</text><text x="410" y="184" font-size="28" font-weight="600" text-anchor="start" fill="#0f100d">Application</text><text x="765" y="184" font-size="26" font-weight="600" text-anchor="middle" fill="#0f100d">Data</text><text x="1020" y="182" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">HTTP, DNS, SSH</text><rect x="330" y="230" width="330" height="88" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="375" cy="274" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="375" y="284" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">6</text><text x="410" y="284" font-size="28" font-weight="600" text-anchor="start" fill="#0f100d">Presentation</text><text x="765" y="284" font-size="26" font-weight="600" text-anchor="middle" fill="#0f100d">Data</text><text x="1020" y="282" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">TLS, enkripsi, JPEG</text><rect x="330" y="330" width="330" height="88" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="375" cy="374" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="375" y="384" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">5</text><text x="410" y="384" font-size="28" font-weight="600" text-anchor="start" fill="#0f100d">Session</text><text x="765" y="384" font-size="26" font-weight="600" text-anchor="middle" fill="#0f100d">Data</text><text x="1020" y="382" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">Mengelola sesi</text><rect x="330" y="430" width="330" height="88" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="375" cy="474" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="375" y="484" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">4</text><text x="410" y="484" font-size="28" font-weight="600" text-anchor="start" fill="#0f100d">Transport</text><text x="765" y="484" font-size="21" font-weight="600" text-anchor="middle" fill="#0f100d">Segmen / datagram</text><text x="1020" y="482" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">TCP, UDP, nomor port</text><rect x="330" y="530" width="330" height="88" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="375" cy="574" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="375" y="584" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">3</text><text x="410" y="584" font-size="28" font-weight="600" text-anchor="start" fill="#0f100d">Network</text><text x="765" y="584" font-size="26" font-weight="600" text-anchor="middle" fill="#0f100d">Paket</text><text x="1020" y="582" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">IP, router</text><rect x="330" y="630" width="330" height="88" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="375" cy="674" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="375" y="684" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">2</text><text x="410" y="684" font-size="28" font-weight="600" text-anchor="start" fill="#0f100d">Data Link</text><text x="765" y="684" font-size="26" font-weight="600" text-anchor="middle" fill="#0f100d">Frame</text><text x="1020" y="682" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">Ethernet, MAC, switch</text><rect x="330" y="730" width="330" height="88" rx="14" fill="#ffffff" stroke="#0f100d" stroke-width="4"/><circle cx="375" cy="774" r="22" fill="#e3edc8" stroke="#0f100d" stroke-width="4"/><text x="375" y="784" font-size="26" font-weight="800" text-anchor="middle" fill="#0f100d">1</text><text x="410" y="784" font-size="28" font-weight="600" text-anchor="start" fill="#0f100d">Physical</text><text x="765" y="784" font-size="26" font-weight="600" text-anchor="middle" fill="#0f100d">Bit</text><text x="1020" y="782" font-size="22" font-weight="500" text-anchor="middle" fill="#0f100d">Kabel, sinyal, hub</text><text x="600" y="880" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Data turun dari lapisan 7 ke 1 di pengirim, lalu naik dari 1 ke 7 di penerima.</text><text x="600" y="916" font-size="24" font-weight="500" text-anchor="middle" fill="#0f100d">Setiap lapisan menambah header: itu enkapsulasi. Penerima melepasnya: 