# Runs the guest end-to-end tests against each production deployment once
# Vercel reports it ready. Read-only: the tests never sign in or write.
name: E2E

on: deployment_status

jobs:
  e2e:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          # The production alias, not environment_url: per-deployment URLs sit
          # behind Vercel's login. A ready production deploy owns the alias.
          E2E_BASE_URL: https://lms-ruang-materi.vercel.app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
