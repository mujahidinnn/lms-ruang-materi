# Checks every push and pull request: types, lint, unit tests, and the
# database smoke test on a fresh local Supabase stack (migrations from zero).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Types for .ts, .tsx and .astro files.
      - run: npx astro check
      - run: npm run lint
      - run: npm run test:run

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Storage policies need the storage schema, so storage-api runs too.
      - run: supabase start -x realtime,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase test db
